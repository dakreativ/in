<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesin Cetak QR Code Review</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0px 8px 16px rgba(0,0,0,0.1); max-width: 450px; margin: 40px auto; }
        h2 { margin-top: 0; color: #2c3e50; font-size: 22px; }
        .step-box { background: #eef2f3; padding: 15px; border-radius: 8px; text-align: left; margin-bottom: 20px; border-left: 4px solid #4285F4; }
        .step-title { font-weight: bold; color: #333; margin-bottom: 8px; font-size: 14px; }
        
        input { width: 100%; padding: 14px; margin: 10px 0; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; transition: 0.3s; box-sizing: border-box; }
        input:focus { border-color: #4285F4; outline: none; }
        
        button { border: none; padding: 14px 20px; cursor: pointer; border-radius: 8px; font-size: 15px; width: 100%; font-weight: bold; transition: 0.3s; box-sizing: border-box; }
        .btn-api { background: #fff; color: #8e44ad; border: 2px solid #8e44ad; margin-bottom: 10px; }
        .btn-api:hover { background: #f5eef8; transform: translateY(-2px); }
        .btn-generate { background: #4285F4; color: white; margin-top: 5px; }
        .btn-generate:hover { background: #357ae8; transform: translateY(-2px); }
        
        /* Desain Kartu QR Code */
        #qrCard { 
            margin: 25px auto 0; 
            display: none; 
            flex-direction: column; 
            align-items: center;
            background: white;
            padding: 20px;
            border: 2px dashed #bdc3c7;
            border-radius: 12px;
            width: fit-content;
        }
        #qrCard img { border-radius: 8px; }
        .qr-label { 
            margin-top: 15px; 
            font-size: 18px; 
            font-weight: bold; 
            color: #2c3e50; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .instruction-save { font-size: 12px; color: #7f8c8d; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 Mesin Cetak QR Pro</h2>
    
    <!-- LANGKAH 1 -->
    <div class="step-box" style="border-left-color: #8e44ad;">
        <div class="step-title">LANGKAH 1: Dapatkan Link Review</div>
        <p style="font-size: 12px; color: #555; margin-top: 0;">Gunakan web ProductMate untuk mencari toko dan menyalin link reviewnya.</p>
        <button class="btn-api" onclick="window.open('https://productmate.com/id/developers/google-review-link', '_blank')">
            🔗 Buka Generator Link ProductMate
        </button>
    </div>

    <!-- LANGKAH 2 -->
    <div class="step-box" style="border-left-color: #4285F4;">
        <div class="step-title">LANGKAH 2: Cetak Barcode</div>
        
        <!-- Kolom Link -->
        <input type="text" id="linkInput" placeholder="1. Paste Link dari ProductMate di sini...">
        
        <!-- Kolom Kode/Nama Klien -->
        <input type="text" id="kodeInput" placeholder="2. Masukkan Nama Klien / Kode (Opsional)">
        
        <button class="btn-generate" onclick="generateQR()">Cetak QR Code</button>
    </div>

    <!-- Hasil QR Code -->
    <div id="qrCard">
        <div id="qrcodeImg"></div>
        <div id="qrLabel" class="qr-label"></div>
    </div>
    
    <div id="saveHint" class="instruction-save" style="display: none;">
        <i>Trik: Screenshot area kotak putus-putus di atas agar nama klien dan barcode tidak terpisah.</i>
    </div>
</div>

<script>
    function generateQR() {
        var linkVal = document.getElementById("linkInput").value.trim();
        var kodeVal = document.getElementById("kodeInput").value.trim();

        if (!linkVal) {
            alert("Bro, paste dulu linknya di kolom pertama!");
            return;
        }

        // Jika kolom kode/nama klien dikosongkan, buat kode random otomatis (misal: ORD-8472)
        if (!kodeVal) {
            kodeVal = "ORD-" + Math.floor(1000 + Math.random() * 9000);
        }

        // Panggil API untuk membuat gambar QR
        var apiUrl = "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" + encodeURIComponent(linkVal);
        
        // Tampilkan hasil
        document.getElementById("qrcodeImg").innerHTML = "<img src='" + apiUrl + "' alt='QR Code'>";
        document.getElementById("qrLabel").innerText = kodeVal;
        
        document.getElementById("qrCard").style.display = "flex";
        document.getElementById("saveHint").style.display = "block";
    }
</script>

</body>
</html>
