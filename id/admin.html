<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superadmin | Manajemen Galeri</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0F172A; color: white; margin: 0; padding: 20px; }
        .hidden { display: none !important; }
        .container { max-width: 900px; margin: 0 auto; }
        
        /* Glassmorphism Card */
        .card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 30px; margin-bottom: 20px; }
        
        h2 { margin-top: 0; font-weight: 800; color: #38BDF8; }
        
        /* Input & Form */
        .input-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        label { font-size: 13px; font-weight: 700; margin-bottom: 5px; color: #94A3B8; text-transform: uppercase; }
        input, select { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 12px 15px; border-radius: 10px; outline: none; font-family: inherit; font-size: 14px; transition: 0.3s; }
        input:focus, select:focus { border-color: #38BDF8; }
        
        .flex-row { display: flex; gap: 15px; }
        .flex-row > div { flex: 1; }
        
        button { background: #38BDF8; color: #0F172A; font-weight: 800; border: none; padding: 14px; border-radius: 10px; cursor: pointer; transition: 0.3s; width: 100%; font-size: 15px; }
        button:hover { background: #0EA5E9; transform: translateY(-2px); }
        button:disabled { background: #475569; cursor: not-allowed; }

        /* Tabel Data */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); }
        th { color: #94A3B8; font-size: 12px; text-transform: uppercase; }
        .badge-event { background: rgba(239, 68, 68, 0.2); color: #FCA5A5; padding: 4px 8px; border-radius: 6px; font-size: 11px; }
        .badge-info { background: rgba(34, 197, 94, 0.2); color: #86EFAC; padding: 4px 8px; border-radius: 6px; font-size: 11px; }
        .btn-copy { background: transparent; border: 1px solid #38BDF8; color: #38BDF8; padding: 6px 12px; border-radius: 6px; font-size: 12px; width: auto;}
    </style>
</head>
<body>

    <div class="container">
        <!-- HALAMAN LOGIN -->
        <div id="loginSection" class="card" style="max-width: 400px; margin: 100px auto; text-align: center;">
            <h2>Admin Login</h2>
            <p style="color: #94A3B8; font-size: 14px;">Masukkan password untuk mengelola galeri.</p>
            <input type="password" id="adminPass" placeholder="Password Rahasia" style="width: 90%; text-align: center; margin-bottom: 20px;">
            <button onclick="doLogin()">Masuk Workspace</button>
        </div>

        <!-- HALAMAN DASHBOARD -->
        <div id="dashboardSection" class="hidden">
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h1 style="margin: 0; font-size: 24px;">Workspace <span style="color:#38BDF8;">Admin</span></h1>
                <button onclick="logout()" style="width: auto; background: transparent; border: 1px solid #EF4444; color: #EF4444; padding: 8px 15px;">Keluar</button>
            </div>

            <!-- Form Tambah Galeri -->
            <div class="card">
                <h2>+ Buat Galeri / Akses Baru</h2>
                <div class="flex-row">
                    <div class="input-group">
                        <label>Kode Unik (Buat Barcode)</label>
                        <input type="text" id="orderId" placeholder="cth: client01" oninput="this.value = this.value.replace(/\s+/g, '').toLowerCase()">
                    </div>
                    <div class="input-group">
                        <label>Nama Klien / Acara</label>
                        <input type="text" id="clientName" placeholder="cth: Dadan & Nisa">
                    </div>
                </div>

                <div class="flex-row">
                    <div class="input-group">
                        <label>Tipe Link</label>
                        <select id="linkType" onchange="togglePassword()">
                            <option value="Event">Event (Pakai Password)</option>
                            <option value="Info">Info / Affiliate (Tanpa Password)</option>
                        </select>
                    </div>
                    <div class="input-group" id="passContainer">
                        <label>Password (Kunci)</label>
                        <input type="text" id="clientPass" placeholder="cth: 123456">
                    </div>
                    <div class="input-group">
                        <label>No WA Klien</label>
                        <input type="number" id="clientWa" placeholder="628123...">
                    </div>
                </div>

                <div class="input-group">
                    <label>Link Folder Google Drive (Akses: Siapa Saja)</label>
                    <input type="text" id="driveLink" placeholder="https://drive.google.com/drive/folders/...">
                </div>

                <button id="btnSave" onclick="saveData()">Simpan Data</button>
            </div>

            <!-- Tabel Data Klien -->
            <div class="card">
                <h2>Daftar Klien / Galeri Aktif</h2>
                <button onclick="loadData()" style="width: auto; margin-bottom: 15px; font-size: 12px; padding: 8px 15px;">🔄 Refresh Data</button>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Kode Unik</th>
                                <th>Nama Klien</th>
                                <th>Tipe</th>
                                <th>Password</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr><td colspan="5" style="text-align: center;">Memuat data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. SETTING URL WEB APP GAS & URL GITHUB LU
        // ==========================================
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxS2Xad3FCI7YL2xvjJ8v6cXq_oa0l1Drj4RnzqEtbtwiHVuC90xFS-HcoDsnDL438BSQ/exec"; 
        const WEB_URL = window.location.origin + window.location.pathname.replace('admin.html', ''); // URL web utama lu

        let currentPass = sessionStorage.getItem('adminPass');

        // Cek login saat refresh
        if (currentPass) { showDashboard(); }

        function doLogin() {
            const p = document.getElementById('adminPass').value;
            if(!p) return alert("Isi password!");
            currentPass = p;
            sessionStorage.setItem('adminPass', p);
            showDashboard();
        }

        function logout() {
            sessionStorage.removeItem('adminPass');
            location.reload();
        }

        function showDashboard() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            loadData();
        }

        function togglePassword() {
            const type = document.getElementById('linkType').value;
            document.getElementById('passContainer').style.display = (type === 'Info') ? 'none' : 'flex';
        }

        // --- FUNGSI AMBIL DATA (GET) ---
        function loadData() {
            const tb = document.getElementById('tableBody');
            tb.innerHTML = '<tr><td colspan="5" style="text-align:center;">Memuat data dari Google Sheets...</td></tr>';
            
            fetch(`${GAS_URL}?action=get_all&pass=${encodeURIComponent(currentPass)}`)
            .then(res => res.json())
            .then(data => {
                if(data.status === 'error') {
                    alert(data.message); logout(); return;
                }
                
                tb.innerHTML = '';
                if(data.data.length === 0) {
                    tb.innerHTML = '<tr><td colspan="5" style="text-align:center;">Belum ada data klien.</td></tr>';
                    return;
                }

                data.data.forEach(row => {
                    const badge = row.tipe === 'Event' ? 'badge-event' : 'badge-info';
                    const targetUrl = `${WEB_URL}?id=${row.order_id}`;
                    
                    tb.innerHTML += `
                        <tr>
                            <td style="color:#38BDF8; font-weight:bold;">${row.order_id}</td>
                            <td>${row.name}</td>
                            <td><span class="${badge}">${row.tipe}</span></td>
                            <td>${row.tipe === 'Event' ? row.password : '-'}</td>
                            <td>
                                <button class="btn-copy" onclick="copyLink('${targetUrl}')">🔗 Copy Link Barcode</button>
                            </td>
                        </tr>
                    `;
                });
            }).catch(() => {
                tb.innerHTML = '<tr><td colspan="5" style="text-align:center; color:red;">Gagal mengambil data. Pastikan Link GAS benar.</td></tr>';
            });
        }

        // --- FUNGSI SIMPAN DATA (POST) ---
        function saveData() {
            const btn = document.getElementById('btnSave');
            const payload = {
                action: 'add',
                pass: currentPass,
                order_id: document.getElementById('orderId').value,
                name: document.getElementById('clientName').value,
                wa: document.getElementById('clientWa').value,
                tipe: document.getElementById('linkType').value,
                password: document.getElementById('clientPass').value,
                folder_url: document.getElementById('driveLink').value
            };

            if(!payload.order_id || !payload.name || !payload.folder_url) {
                return alert("Lengkapi Kode, Nama, dan Link Drive!");
            }

            btn.disabled = true; btn.innerText = "Menyimpan ke Google Sheets...";

            fetch(GAS_URL, {
                method: 'POST',
                // PENTING: Pakai text/plain agar tidak kena error CORS Preflight dari browser
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                btn.disabled = false; btn.innerText = "Simpan Data";
                if(data.status === 'success') {
                    alert("Berhasil! Klien ditambahkan.");
                    document.getElementById('orderId').value = '';
                    document.getElementById('clientName').value = '';
                    document.getElementById('driveLink').value = '';
                    loadData(); // Otomatis refresh tabel
                } else {
                    alert("Gagal: " + data.message);
                }
            }).catch(err => {
                btn.disabled = false; btn.innerText = "Simpan Data";
                alert("Error koneksi jaringan.");
            });
        }

        // --- FUNGSI COPY LINK ---
        function copyLink(url) {
            navigator.clipboard.writeText(url).then(() => {
                alert("Link berhasil dicopy!\n\n" + url + "\n\nSekarang lu bisa paste link ini di web pembuat QR Code.");
            }).catch(() => {
                alert("Gagal copy link otomatis. Manual aja: " + url);
            });
        }
    </script>
</body>
</html>
