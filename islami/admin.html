<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - WA DKTV</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0F172A; color: white; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: #1E293B; border-radius: 16px; padding: 25px; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        h1, h2 { color: #10B981; margin-top: 0; }
        input, select { width: 100%; background: #0F172A; border: 1px solid #334155; color: white; padding: 12px; border-radius: 8px; box-sizing: border-box; margin-bottom: 15px; }
        button { background: #10B981; color: #0F172A; font-weight: bold; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; }
        button:hover { background: #059669; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { padding: 12px; border-bottom: 1px solid #334155; text-align: left; }
        .badge-kosong { background: #FCA5A5; color: #7F1D1D; padding: 4px 8px; border-radius: 4px; font-size: 11px; }
        .badge-aktif { background: #6EE7B7; color: #064E3B; padding: 4px 8px; border-radius: 4px; font-size: 11px; }
        .flex-row { display: flex; gap: 15px; } .flex-row > div { flex: 1; }
        #qr-container { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 20px; justify-content: center; }
        .qr-wrapper { background: white; padding: 15px; border-radius: 10px; text-align: center; color: black; font-weight: bold; font-size: 13px; }
        .qr-box { margin: 0 auto 10px; display: flex; justify-content: center; }
        .btn-dl { background: #3B82F6; color: white; padding: 8px; font-size: 12px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>WA DKTV - Admin Panel</h1>
            <p>Generate Barcode Kosong untuk Klien</p>
            <div class="flex-row">
                <div>
                    <label>Prefix ID (Mulai dari)</label>
                    <input type="text" id="prefixId" placeholder="cth: DKTV-001" value="DKTV-">
                </div>
                <div>
                    <label>Jumlah Barcode</label>
                    <input type="number" id="qty" placeholder="cth: 10" value="1">
                </div>
            </div>
            <button id="btnGen" onclick="generateCards()">Generate Barcode Kosong</button>
            <div id="qr-container"></div>
        </div>

        <div class="card">
            <h2 style="display:flex; justify-content:space-between;">Database Kartu <button onclick="loadData()" style="width:auto; padding:8px 15px; font-size:12px;">🔄 Refresh</button></h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead><tr><th>ID Kartu</th><th>Nama Klien</th><th>No. WA</th><th>Status</th></tr></thead>
                    <tbody id="tabel"><tr><td colspan="4" style="text-align: center;">Memuat data...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // GANTI BAGIAN INI SAJA!
        // ==========================================
        const SUPABASE_URL = 'https://bkxclrjycsdpchodgzzb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_F9D19Umk_ofD3bwZDP5sng_O4kSsG_3'; 
        // ==========================================

        const WEB_URL = window.location.origin + window.location.pathname.replace('admin.html', 'index.html'); 
        
        // Deklarasi Supabase (PASTIKAN HANYA ADA SATU DI SELURUH FILE INI)
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function generateCards() {
            const prefix = document.getElementById('prefixId').value;
            const qty = parseInt(document.getElementById('qty').value) || 1;
            const btn = document.getElementById('btnGen');

            if(!prefix) return alert("Prefix ID wajib diisi!");
            btn.disabled = true; btn.innerText = "Memproses Database...";

            const dataToInsert = [];
            for(let i = 1; i <= qty; i++) {
                let finalId = qty === 1 ? prefix : `${prefix}-${i}`;
                dataToInsert.push({ id: finalId, status: 'Kosong' });
            }

            const { data, error } = await supabase.from('cards').insert(dataToInsert).select();

            btn.disabled = false; btn.innerText = "Generate Barcode Kosong";

            if (error) {
                if(error.code === '23505') return alert("Error: ID Kartu tersebut sudah ada di database!");
                return alert("Gagal menyimpan ke database: " + error.message);
            }

            document.getElementById('qr-container').innerHTML = '';
            dataToInsert.forEach(item => bikinQR(item.id));
            loadData();
        }

        function bikinQR(id) {
            const wrapper = document.createElement('div'); wrapper.className = 'qr-wrapper';
            const qrBox = document.createElement('div'); qrBox.className = 'qr-box'; qrBox.id = 'qr-' + id;
            new QRCode(qrBox, { text: WEB_URL + "?id=" + id, width: 130, height: 130 });
            
            const teksId = document.createElement('div'); teksId.innerText = "ID: " + id;
            const btnDl = document.createElement('button'); btnDl.className = 'btn-dl'; btnDl.innerText = '⬇️ Download QR';
            btnDl.onclick = function() {
                const canvas = qrBox.querySelector('canvas');
                if(canvas) {
                    const link = document.createElement('a'); link.href = canvas.toDataURL("image/png");
                    link.download = 'WADKTV_' + id + '.png'; link.click();
                }
            };
            wrapper.appendChild(qrBox); wrapper.appendChild(teksId); wrapper.appendChild(btnDl);
            document.getElementById('qr-container').appendChild(wrapper);
        }

        async function loadData() {
            const tbody = document.getElementById('tabel');
            tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">Memuat data...</td></tr>';
            
            const { data, error } = await supabase.from('cards').select('*').order('created_at', { ascending: false });
            
            if (error) {
                tbody.innerHTML = `<tr><td colspan="4" style="color:red; text-align:center;">Error DB: Pastikan tabel Supabase bernama 'cards' sudah terbuat. Detail: ${error.message}</td></tr>`;
                return;
            }

            let html = '';
            data.forEach(row => {
                let badge = row.status === 'Kosong' ? 'badge-kosong' : 'badge-aktif';
                html += `<tr>
                            <td><strong>${row.id}</strong></td>
                            <td>${row.nama || '-'}</td>
                            <td>${row.wa || '-'}</td>
                            <td><span class="${badge}">${row.status}</span></td>
                         </tr>`;
            });
            tbody.innerHTML = html || '<tr><td colspan="4" style="text-align:center;">Belum ada data kartu.</td></tr>';
        }

        loadData();
    </script>
</body>
</html>
