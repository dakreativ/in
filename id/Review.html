<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesin Jasa QR Google Review</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0px 8px 16px rgba(0,0,0,0.1); max-width: 450px; margin: 40px auto; }
        h2 { margin-top: 0; color: #2c3e50; font-size: 22px; }
        .step-box { background: #eef2f3; padding: 15px; border-radius: 8px; text-align: left; margin-bottom: 20px; border-left: 4px solid #4285F4; }
        .step-title { font-weight: bold; color: #333; margin-bottom: 8px; font-size: 14px; }
        
        input { width: 90%; padding: 14px; margin: 10px 0; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; transition: 0.3s; box-sizing: border-box; }
        input:focus { border-color: #4285F4; outline: none; }
        
        button { border: none; padding: 14px 20px; cursor: pointer; border-radius: 8px; font-size: 15px; width: 100%; font-weight: bold; transition: 0.3s; box-sizing: border-box; }
        .btn-api { background: #fff; color: #4285F4; border: 2px solid #4285F4; margin-bottom: 10px; }
        .btn-api:hover { background: #f0f5ff; transform: translateY(-2px); }
        .btn-generate { background: #4285F4; color: white; margin-top: 5px; }
        .btn-generate:hover { background: #357ae8; transform: translateY(-2px); }
        
        #qrcode { margin: 25px auto; display: flex; justify-content: center; min-height: 200px; }
        #linkOutput { font-size: 13px; color: #27ae60; word-break: break-all; margin-top: 15px; padding: 15px; border-radius: 8px; background: #e9f7ef; display: none; text-align: left;}
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 Generator QR Review Pro</h2>
    
    <!-- LANGKAH 1 -->
    <div class="step-box">
        <div class="step-title">LANGKAH 1: Ambil Data API Google</div>
        <p style="font-size: 12px; color: #555; margin-top: 0;">Klik tombol di bawah ini, cari nama bisnis klien di peta, lalu copy <b>Place ID</b>-nya (Contoh: ChIJ...).</p>
        <button class="btn-api" onclick="window.open('https://developers.google.com/maps/documentation/javascript/examples/places-placeid-finder', '_blank')">
            🔍 Buka Pencari Place ID Google
        </button>
    </div>

    <!-- LANGKAH 2 -->
    <div class="step-box" style="border-left-color: #27ae60;">
        <div class="step-title">LANGKAH 2: Buat Barcode Bintang 5</div>
        <p style="font-size: 12px; color: #555; margin-top: 0;">Paste Place ID atau link panjang Google Maps yang sudah didapat ke kolom ini.</p>
        <input type="text" id="userInput" placeholder="Paste Place ID (ChIJ...) di sini...">
        <button class="btn-generate" onclick="generateQR()">Generate Auto 5-Star QR</button>
    </div>

    <div id="qrcode"></div>
    <div id="linkOutput"></div>
</div>

<script>
    function generateQR() {
        var inputVal = document.getElementById("userInput").value.trim();
        var finalLink = "";

        if (!inputVal) {
            alert("Kolom tidak boleh kosong!");
            return;
        }

        // Peringatan jika memasukkan link pendek
        if (inputVal.includes("maps.app.goo.gl") || inputVal.includes("goo.gl")) {
            alert("Error: Jangan gunakan link pendek. Gunakan Place ID dari Langkah 1.");
            return;
        }
        
        // Logika 1: Jika input adalah Place ID resmi dari API Google (ChIJ...)
        if (inputVal.startsWith("ChIJ")) {
            finalLink = "https://search.google.com/local/writereview?placeid=" + inputVal;
        }
        // Logika 2: Backup Bypass jika tetap menggunakan Link Panjang Google Maps
        else if (inputVal.includes("1s0x") && inputVal.includes(":0x")) {
            var match = inputVal.match(/1s(0x[0-9a-fA-F]+):(0x[0-9a-fA-F]+)/);
            if (match && match[1] && match[2]) {
                try {
                    var hex1 = match[1];
                    var hex2 = match[2];
                    var decimalCid = BigInt(hex2).toString(); 
                    finalLink = "https://www.google.com/search?q=Review&ludocid=" + decimalCid + "#lrd=" + hex1 + ":" + hex2 + ",3";
                } catch (e) { 
                    alert("Gagal memproses link."); return; 
                }
            } else {
                alert("Kode unik toko tidak lengkap pada link."); return;
            }
        } 
        else {
            alert("Format tidak valid! Pastikan Anda mem-paste Place ID yang diawali huruf 'ChIJ'.");
            return;
        }

        // Generate QR Code ke API
        var apiUrl = "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" + encodeURIComponent(finalLink);
        
        document.getElementById("qrcode").innerHTML = "<img src='" + apiUrl + "' alt='QR Code' style='border: 2px solid #27ae60; border-radius: 8px; padding: 10px; background: white;'>";
        
        var outputDiv = document.getElementById("linkOutput");
        outputDiv.style.display = "block";
        outputDiv.innerHTML = "<b>✅ Sukses! Link Pop-up Review:</b><br><br><a href='" + finalLink + "' target='_blank' style='color:#2c3e50;'>" + finalLink + "</a><br><br><i style='color:#7f8c8d;'>Klik link di atas untuk memastikan popup bintang 5 muncul sebelum QR dikirim ke klien.</i>";
    }
</script>

</body>
</html>
