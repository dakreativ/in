<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesin Jasa QR Google Review</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0px 8px 16px rgba(0,0,0,0.1); max-width: 450px; margin: 40px auto; }
        h2 { margin-top: 0; color: #2c3e50; }
        .instruction { font-size: 13px; color: #555; background: #eef2f3; padding: 15px; border-radius: 8px; text-align: left; margin-bottom: 20px; line-height: 1.5;}
        .highlight { font-weight: bold; color: #d35400; }
        input { width: 90%; padding: 14px; margin: 10px 0; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; transition: 0.3s;}
        input:focus { border-color: #4285F4; outline: none; }
        button { background: #4285F4; color: white; border: none; padding: 14px 20px; cursor: pointer; border-radius: 8px; font-size: 16px; width: 90%; font-weight: bold; transition: 0.3s; margin-top: 5px;}
        button:hover { background: #357ae8; transform: translateY(-2px); }
        .btn-alt { background: #27ae60; margin-top: 15px; font-size: 14px;}
        .btn-alt:hover { background: #219653; }
        #qrcode { margin: 25px auto; display: flex; justify-content: center; min-height: 200px; }
        #linkOutput { font-size: 13px; color: #27ae60; word-break: break-all; margin-top: 15px; padding: 10px; border-radius: 8px; background: #e9f7ef; display: none;}
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 Generator QR Review Pro</h2>
    
    <div class="instruction">
        <b>SOP Paling Gampang:</b><br>
        1. Cari nama toko klien di <b>Google Pencarian biasa</b>.<br>
        2. Klik tombol <span class="highlight">"Tulis Ulasan"</span> pada info tokonya.<br>
        3. Copy URL di address bar (yang ada tulisan <i>lrd=...</i>).<br>
        4. Paste ke kolom di bawah.
    </div>
    
    <input type="text" id="userInput" placeholder="Paste Link di sini...">
    <button onclick="generateQR()">Generate Auto 5-Star QR</button>

    <div style="margin-top: 20px; border-top: 1px solid #ddd; padding-top: 15px;">
        <p style="font-size: 12px; color: #7f8c8d; margin-bottom: 10px;">Atau cari Place ID manual:</p>
        <a href="https://placeid.io/" target="_blank" style="text-decoration: none;">
            <button class="btn-alt">🔍 Buka Web Pencari Place ID</button>
        </a>
    </div>

    <div id="qrcode"></div>
    <div id="linkOutput"></div>
</div>

<script>
    function generateQR() {
        var inputVal = document.getElementById("userInput").value.trim();
        var finalLink = "";

        if (!inputVal) {
            alert("Bro, kolom link jangan dikosongin!");
            return;
        }

        // Peringatan jika yang dimasukkan link pendek
        if (inputVal.includes("maps.app.goo.gl") || inputVal.includes("goo.gl")) {
            alert("Itu link pendek bro! Ikuti SOP di atas: Buka Google biasa, cari tokonya, klik 'Tulis Ulasan', lalu copy linknya.");
            return;
        }
        
        // 1. Jika bro dapat Place ID murni (ChIJ...)
        if (inputVal.startsWith("ChIJ")) {
            finalLink = "https://search.google.com/local/writereview?placeid=" + inputVal;
        } 
        // 2. DETEKSI BARU: Link dari tombol "Tulis Ulasan" di Google (Ada kode #lrd=)
        else if (inputVal.includes("lrd=")) {
            var match = inputVal.match(/lrd=[^:]+:0x([0-9a-fA-F]+)/);
            if (match && match[1]) {
                try {
                    var decimalCid = BigInt("0x" + match[1]).toString(); 
                    finalLink = "https://search.google.com/local/writereview?ludocid=" + decimalCid;
                } catch (e) { alert("Gagal proses ID dari link Ulasan!"); return; }
            } else {
                alert("Kode unik toko tidak ketemu di link lrd! Copy ulang linknya ya."); return;
            }
        }
        // 3. Link Google Maps panjang (1s0x...:0x...)
        else if (inputVal.includes("1s0x") && inputVal.includes(":0x")) {
            var match = inputVal.match(/1s0x[0-9a-fA-F]+:0x([0-9a-fA-F]+)/);
            if (match && match[1]) {
                try {
                    var decimalCid = BigInt("0x" + match[1]).toString(); 
                    finalLink = "https://search.google.com/local/writereview?ludocid=" + decimalCid;
                } catch (e) { alert("Gagal proses ID dari link Maps!"); return; }
            } else {
                alert("Kode unik toko tidak ketemu! Ikuti SOP di atas aja biar gampang bro."); return;
            }
        } 
        else {
            alert("Format link tidak valid! Link yang bro masukin kayaknya link pencarian, bukan link ulasan toko. Ikuti SOP di kotak abu-abu ya.");
            return;
        }

        // Tampilkan QR Code via API
        var apiUrl = "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" + encodeURIComponent(finalLink);
        
        document.getElementById("qrcode").innerHTML = "<img src='" + apiUrl + "' alt='QR Code' style='border: 2px solid #4285F4; border-radius: 8px; padding: 10px; background: white;'>";
        
        var outputDiv = document.getElementById("linkOutput");
        outputDiv.style.display = "block";
        outputDiv.innerHTML = "<b>Sukses Diekstrak! Link Auto 5-Star:</b><br><br><a href='" + finalLink + "' target='_blank'>" + finalLink + "</a>";
    }
</script>

</body>
</html>
