<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator QR Code Google Review</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f0f2f5; margin: 0; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0px 4px 12px rgba(0,0,0,0.1); max-width: 400px; margin: 40px auto; }
        h2 { margin-top: 0; color: #333; }
        input { width: 90%; padding: 12px; margin: 15px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        button { background: #4285F4; color: white; border: none; padding: 12px 20px; cursor: pointer; border-radius: 6px; font-size: 16px; width: 90%; font-weight: bold; }
        button:hover { background: #357ae8; }
        #qrcode { margin: 25px auto; display: flex; justify-content: center; min-height: 200px; }
        .note { font-size: 12px; color: #666; margin-top: 15px; }
        #linkOutput { font-size: 13px; color: #4285F4; word-break: break-all; margin-top: 10px;}
    </style>
</head>
<body>

<div class="container">
    <h2>Pembuat QR Google Review</h2>
    <p style="font-size: 14px; color: #555;">Masukkan Google Place ID <b>ATAU</b> Link Google Maps / Review.</p>
    
    <input type="text" id="userInput" placeholder="Contoh: ChIJP3... atau https://g.page/r/...">
    <button onclick="generateQR()">Buat QR Code</button>

    <div id="qrcode"></div>
    <div id="linkOutput"></div>
</div>

<script>
    function generateQR() {
        var inputVal = document.getElementById("userInput").value.trim();
        
        if (!inputVal) {
            alert("Bro, kolomnya jangan dikosongin!");
            return;
        }

        var finalLink = "";

        // Logika Pintar: Cek apakah input itu URL atau Place ID
        if (inputVal.startsWith("http://") || inputVal.startsWith("https://") || inputVal.includes("google.com") || inputVal.includes("goo.gl")) {
            // Jika user memasukkan link utuh, langsung gunakan link tersebut
            finalLink = inputVal;
        } else {
            // Jika user memasukkan Place ID, gabungkan dengan format rahasia Google
            finalLink = "https://search.google.com/local/writereview?placeid=" + inputVal;
        }

        // Gunakan API QR Server agar langsung jadi gambar
        var apiUrl = "https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=" + encodeURIComponent(finalLink);

        // Tampilkan gambar dan link
        document.getElementById("qrcode").innerHTML = "<img src='" + apiUrl + "' alt='QR Code' style='border: 1px solid #ddd; border-radius: 8px; padding: 10px;'>";
        document.getElementById("linkOutput").innerHTML = "<b>Link yang dipakai:</b><br><a href='" + finalLink + "' target='_blank'>" + finalLink + "</a>";
    }
</script>

</body>
</html>
