<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin - Dynamic QR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #f8fafc; --surface: #ffffff; --border: #e2e8f0; --text: #0f172a; --primary: #000000; }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); padding: 30px 20px; }
        .container { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .card-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr auto; gap: 16px; align-items: end; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: #475569; }
        .form-group input { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; outline: none; }
        .btn { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; margin-top: 10px; }
        th { background: #f1f5f9; padding: 12px 16px; border-bottom: 2px solid var(--border); }
        td { padding: 14px 16px; border-bottom: 1px solid var(--border); }
        .badge-link { background: #dbeafe; color: #1e40af; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; }
        .btn-sm { background: #e2e8f0; color: #0f172a; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; border: none; font-weight: 600; }
        .btn-sm.copy { background: #10b981; color: white; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-title">👑 Buat QR Code & Akses Klien</div>
        <form class="form-grid" id="qrForm" onsubmit="generateBaru(event)">
            <div class="form-group"><label>Nama Klien</label><input type="text" id="nama" required></div>
            <div class="form-group"><label>No. WA Klien</label><input type="number" id="wa" required></div>
            <button type="submit" class="btn" id="btnSubmit">+ Generate Baru</button>
        </form>
    </div>

    <div class="card">
        <div class="card-title">📂 Database QR & Klien</div>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr><th>ID QR</th><th>Klien</th><th>Link Tujuan (Aktif)</th><th>Link Akses Klien (Kasih ke Klien)</th><th>Aksi</th></tr>
                </thead>
                <tbody id="tableBody"><tr><td colspan="5">Memuat data...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const supabaseUrl = 'https://bkxclrjycsdpchodgzzb.supabase.co';
    const supabaseKey = 'sb_publishable_F9D19Umk_ofD3bwZDP5sng_O4kSsG_3';
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
    
    // UBAH INI NANTI SESUAI DOMAIN LU!
   // UBAH INI NANTI SESUAI DOMAIN LU!
const DOMAIN_JEMBATAN = "https://dkrtv.vercel.app/qrcode/scan.html?id="; 
const DOMAIN_EDIT_KLIEN = "https://dkrtv.vercel.app/qrcode/edit.html?token=";

    async function loadData() {
        const { data, error } = await supabaseClient.from('dynamic_links').select('*').order('created_at', { ascending: false });
        renderTable(data || []);
    }

    async function generateBaru(e) {
        e.preventDefault();
        const nama = document.getElementById('nama').value;
        const wa = document.getElementById('wa').value;
        
        // Generate ID QR & Token Rahasia
        const idUnik = "QR-" + Math.floor(100000 + Math.random() * 900000);
        const tokenRahasia = "TKN-" + Math.random().toString(36).substr(2, 9) + Math.random().toString(36).substr(2, 9);

        await supabaseClient.from('dynamic_links').insert([{ 
            qr_id: idUnik, token_rahasia: tokenRahasia, nama_klien: nama, wa_klien: wa 
        }]);
        
        document.getElementById('qrForm').reset();
        loadData();
    }

    function copyAkses(token) {
        const linkFull = DOMAIN_EDIT_KLIEN + token;
        navigator.clipboard.writeText(linkFull);
        alert("Link akses berhasil dicopy! Silakan kasih link ini ke WA Klien.");
    }

    function downloadQR(idQR) {
        const qr = new QRious({ value: DOMAIN_JEMBATAN + idQR, size: 800, level: 'H' });
        const a = document.createElement('a'); a.href = qr.toDataURL('image/png'); a.download = `QR_${idQR}.png`; a.click();
    }

    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = data.map(item => `
            <tr>
                <td><b>${item.qr_id}</b></td>
                <td>${item.nama_klien}<br><span style="color:gray;font-size:11px;">${item.wa_klien}</span></td>
                <td>${item.target_url ? `<span class="badge-link">${item.target_url}</span>` : '<i>Belum diatur</i>'}</td>
                <td>
                    <button class="btn-sm copy" onclick="copyAkses('${item.token_rahasia}')">Copy Link Akses Klien</button>
                </td>
                <td style="display:flex; gap:8px;">
                    <button class="btn-sm" onclick="downloadQR('${item.qr_id}')">Download QR</button>
                    <button class="btn-sm" style="background:#ef4444; color:white;" onclick="hapus('${item.qr_id}')">Hapus</button>
                </td>
            </tr>
        `).join('') || `<tr><td colspan="5" align="center">Belum ada data.</td></tr>`;
    }

    async function hapus(id) { if(confirm("Yakin dihapus?")) { await supabaseClient.from('dynamic_links').delete().eq('qr_id', id); loadData(); } }
    window.onload = loadData;
</script>
</body>
</html>
