<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dakreativ AI - Video Prompts</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root { 
            --bg: #f8fafc; 
            --text-main: #0f172a; 
            --text-muted: #64748b; 
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg); 
            color: var(--text-main); 
            -webkit-font-smoothing: antialiased;
        }
        
        /* --- HEADER & SEARCH --- */
        header { text-align: center; padding: 50px 20px 30px; }
        header h1 { font-size: 32px; font-weight: 800; letter-spacing: -1px; }
        header p { color: var(--text-muted); font-size: 16px; margin-top: 8px; font-weight: 500; margin-bottom: 30px; }
        
        .search-container {
            max-width: 500px;
            margin: 0 auto;
            position: relative;
        }
        .search-container i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            color: var(--text-muted);
        }
        .search-input {
            width: 100%;
            padding: 16px 20px 16px 50px;
            border-radius: 50px;
            border: 1px solid #e2e8f0;
            background: #fff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-main);
            outline: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            transition: 0.3s;
        }
        .search-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 4px 20px rgba(59,130,246,0.1);
        }
        
        /* --- GALLERY GRID --- */
        .gallery { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
            gap: 24px; 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 0 20px 80px; 
        }
        
        /* --- KARTU PORTRAIT (REELS STYLE) --- */
        .card { 
            position: relative;
            background: #000;
            border-radius: 24px; 
            overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            cursor: pointer;
            aspect-ratio: 9 / 16; 
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease; 
        }
        
        .card:hover { 
            transform: translateY(-8px) scale(1.02); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.15); 
        }
        
        /* Gambar Background */
        .card img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transition: transform 0.5s ease; 
            opacity: 0.85;
        }
        .card:hover img { transform: scale(1.08); opacity: 1; }

        /* Fake Viewers Badge */
        .view-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #fff;
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }

        /* Icon Play Tengah */
        .play-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 56px;
            height: 56px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 28px;
            border: 1px solid rgba(255,255,255,0.3);
            pointer-events: none;
            transition: 0.3s;
        }
        .card:hover .play-center { background: #ef4444; border-color: #ef4444; transform: translate(-50%, -50%) scale(1.1); }
        
        /* Gradient Overlay Bawah */
        .card-overlay { 
            position: absolute; 
            bottom: 0; left: 0; right: 0; 
            height: 60%;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 40%, transparent 100%);
            display: flex; 
            flex-direction: column; 
            justify-content: flex-end;
            padding: 24px 20px;
            pointer-events: none; 
        }
        
        .card-title { 
            color: #ffffff;
            font-size: 18px; 
            font-weight: 800; 
            margin-bottom: 16px; 
            line-height: 1.3; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        /* Glassmorphism Box untuk Tombol Action */
        .action-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 12px 12px 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto; 
        }

        .action-label {
            color: rgba(255,255,255,0.9);
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .action-label i { font-size: 16px; color: #60a5fa; }

        .btn-copy { 
            background: #ffffff; 
            color: #0f172a; 
            border: none; 
            padding: 10px 16px; 
            border-radius: 12px; 
            font-weight: 800; 
            font-size: 13px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            transition: 0.2s; 
            font-family: inherit;
        }
        .btn-copy:hover { transform: scale(1.05); box-shadow: 0 4px 12px rgba(255,255,255,0.2); }
        
        #loader, #noResult { text-align: center; width: 100%; padding: 40px; color: var(--text-muted); font-weight: 600; grid-column: 1 / -1; }
        #noResult { display: none; }

        /* --- MODAL ZOOM PREVIEW --- */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s ease;
        }
        .modal.active { opacity: 1; visibility: visible; }
        
        .modal-content {
            width: 100%;
            max-width: 420px; 
            aspect-ratio: 9 / 16;
            background: #000;
            border-radius: 24px;
            position: relative;
            transform: scale(0.9);
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .modal.active .modal-content { transform: scale(1); }

        .close-btn {
            position: absolute;
            top: -50px;
            right: 0;
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: none;
            width: 40px; height: 40px;
            border-radius: 50%;
            font-size: 20px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .close-btn:hover { background: #ef4444; }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 24px;
        }

        /* Responsive Mobile */
        @media (max-width: 480px) {
            .gallery { grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 16px 40px; }
            .card-title { font-size: 14px; margin-bottom: 12px; }
            .action-box { padding: 8px; border-radius: 12px; flex-direction: column; gap: 8px; }
            .btn-copy { width: 100%; justify-content: center; padding: 8px; font-size: 12px; }
            .play-center { width: 40px; height: 40px; font-size: 20px; }
            .modal-content { max-width: 85vw; border-radius: 16px; }
            iframe { border-radius: 16px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>AI Video Database</h1>
        <p>Koleksi Referensi YouTube & Prompt AI Siap Copas.</p>
        
        <div class="search-container">
            <i class="ph ph-magnifying-glass"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="Cari judul konten atau ide prompt..." onkeyup="searchData()">
        </div>
    </header>

    <div class="gallery" id="galleryContainer">
        <div id="loader"><i class="ph ph-spinner ph-spin" style="font-size: 24px; vertical-align: middle;"></i> Memuat inspirasi...</div>
        <div id="noResult">Yahh, pencarian kamu nggak ketemu Bro. Coba kata kunci lain.</div>
    </div>

    <!-- Modal Zoom Preview -->
    <div class="modal" id="videoModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeModal(event)"><i class="ph ph-x"></i></button>
            <iframe id="ytIframe" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyO_pvfm2Dtx30ZTq8gRCdT2l3Cg4g6WsKTZWBA-a8iUcu-In85PzyMAajl3wNcA56wCQ/exec";

        // Fungsi generate fake viewers (Range: 10.1k - 99.9k)
        function generateFakeViews() {
            const views = Math.floor(Math.random() * 90) + 10;
            const decimals = Math.floor(Math.random() * 9);
            return `${views}.${decimals}k`;
        }

        async function loadData() {
            const container = document.getElementById('galleryContainer');
            const noResult = document.getElementById('noResult');
            
            try {
                const response = await fetch(GAS_URL);
                const textResponse = await response.text(); 
                
                let data;
                try {
                    data = JSON.parse(textResponse);
                } catch (err) {
                    container.innerHTML = `<div id="loader" style="color:#ef4444;">Error Akses! Pastikan Google Apps Script diatur 'Siapa Saja'.</div>`;
                    return;
                }
                
                if(data.error) {
                    container.innerHTML = `<div id="loader" style="color:#ef4444;">Script Error: ${data.error}</div>`;
                    return;
                }
                
                document.getElementById('loader').style.display = 'none';
                
                if(!data || data.length === 0) {
                    container.innerHTML = '<div id="loader">Belum ada data. Tambahkan di halaman Admin.</div>';
                    return;
                }

                data.forEach(item => {
                    const thumbnailUrl = `https://img.youtube.com/vi/${item.ytId}/hqdefault.jpg`;
                    const fakeViews = generateFakeViews(); // Panggil fungsi fake viewers
                    
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.setAttribute('data-title', item.title.toLowerCase());
                    card.setAttribute('data-prompt', item.prompt.toLowerCase());
                    card.onclick = () => openModal(item.ytId);
                    
                    card.innerHTML = `
                        <div class="view-badge"><i class="ph-fill ph-play-circle"></i> ${fakeViews}</div>
                        
                        <img src="${thumbnailUrl}" alt="${item.title}" loading="lazy">
                        
                        <div class="play-center"><i class="ph-fill ph-play"></i></div>
                        
                        <div class="card-overlay">
                            <div class="card-title">${item.title}</div>
                            
                            <div class="action-box">
                                <div class="action-label"><i class="ph-fill ph-magic-wand"></i> Prompt</div>
                                <button class="btn-copy" onclick="copyPrompt(event, \`${item.prompt.replace(/`/g, '\\`')}\`, this)">
                                    <i class="ph ph-copy"></i> Salin
                                </button>
                            </div>
                        </div>
                    `;
                    // Kita insertBefore parent Node loader & noResult
                    container.insertBefore(card, noResult);
                });
            } catch (error) {
                container.innerHTML = `<div id="loader" style="color:#ef4444;">Gagal memuat data. Periksa koneksi internet.</div>`;
            }
        }

        // Fungsi Search / Filter Data
        function searchData() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.card');
            let hasResult = false;

            cards.forEach(card => {
                const title = card.getAttribute('data-title');
                const prompt = card.getAttribute('data-prompt');
                
                if(title.includes(keyword) || prompt.includes(keyword)) {
                    card.style.display = 'block';
                    hasResult = true;
                } else {
                    card.style.display = 'none';
                }
            });

            // Tampilkan pesan jika pencarian tidak ditemukan
            document.getElementById('noResult').style.display = hasResult ? 'none' : 'block';
        }

        function copyPrompt(event, text, btn) {
            event.stopPropagation(); 
            
            navigator.clipboard.writeText(text).then(() => {
                const originalHtml = btn.innerHTML;
                btn.innerHTML = '<i class="ph ph-check-circle"></i> Tersalin';
                btn.style.background = '#10b981';
                btn.style.color = '#fff';
                
                setTimeout(() => {
                    btn.innerHTML = originalHtml;
                    btn.style.background = '#ffffff';
                    btn.style.color = '#0f172a';
                }, 2000);
            });
        }

        function openModal(ytId) {
            const modal = document.getElementById('videoModal');
            const iframe = document.getElementById('ytIframe');
            iframe.src = `https://www.youtube.com/embed/${ytId}?autoplay=1`;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden'; 
        }

        function closeModal(event) {
            if(event) event.stopPropagation();
            const modal = document.getElementById('videoModal');
            const iframe = document.getElementById('ytIframe');
            iframe.src = ''; 
            modal.classList.remove('active');
            document.body.style.overflow = 'auto'; 
        }

        window.onload = loadData;
    </script>
</body>
</html>
