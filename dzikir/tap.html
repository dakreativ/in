<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>dkrtv. - Premium Islamic Companion</title>
    
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: {
                        gold: { 400: '#E5C158', 500: '#D4AF37', 600: '#AA8C2C' },
                        theme: {
                            main: 'var(--bg-main)', card: 'var(--bg-card)', text: 'var(--text-main)', 
                            muted: 'var(--text-muted)', border: 'var(--border-color)', accent: 'var(--bg-accent)'
                        }
                    },
                    boxShadow: { 'soft-glow': '0 10px 40px -10px rgba(212, 175, 55, 0.4)' }
                }
            }
        }
    </script>
    
    <style>
        /* CSS Variables untuk Tema */
        :root { --bg-main: #F9FAFB; --bg-card: #FFFFFF; --text-main: #1F2937; --text-muted: #9CA3AF; --border-color: #F3F4F6; --bg-accent: #F3F4F6; }
        body.theme-dark { --bg-main: #121212; --bg-card: #1E1E1E; --text-main: #F3F4F6; --text-muted: #6B7280; --border-color: #2D3748; --bg-accent: #2D3748; }
        body.theme-cream { --bg-main: #FAF7F2; --bg-card: #FFFFFF; --text-main: #4A4036; --text-muted: #A8A29E; --border-color: #E7E5DF; --bg-accent: #F5F0E6; }
        body.theme-navy { --bg-main: #0F172A; --bg-card: #1E293B; --text-main: #F8FAFC; --text-muted: #94A3B8; --border-color: #334155; --bg-accent: #334155; }
        body.theme-green { --bg-main: #064E3B; --bg-card: #065F46; --text-main: #ECFDF5; --text-muted: #6EE7B7; --border-color: #047857; --bg-accent: #047857; }

        body { 
            background-color: #111; 
            display: flex; justify-content: center; 
            overscroll-behavior-y: contain; 
            -webkit-tap-highlight-color: transparent;
            
            /* ANTI COPY / HIGHLIGHT TEXT */
            user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none;
        }
        ::-webkit-scrollbar { display: none; }
        
        /* Container App UI Presisi */
        #app-container {
            width: 100%; max-width: 480px; height: 100vh;
            background-color: var(--bg-main); color: var(--text-main);
            position: relative; overflow: hidden; box-shadow: 0 0 40px rgba(0,0,0,0.2);
        }

        /* Animasi Tab */
        .tab-content { transition: opacity 0.3s ease, transform 0.3s ease; }
        .tab-hidden { opacity: 0; transform: translateY(10px); pointer-events: none; position: absolute; inset: 0; z-index: 0; }
        .tab-active { opacity: 1; transform: translateY(0); z-index: 10; position: absolute; inset: 0; overflow-y: auto; }
        
        /* Animasi Tombol Dzikir */
        .btn-dzikir { transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-dzikir:active { transform: scale(0.92); box-shadow: 0 5px 20px -5px rgba(212, 175, 55, 0.5); }
        
        /* Efek Ripple saat target tercapai */
        @keyframes pulse-ring { 0% { transform: scale(0.9); opacity: 0.6; } 100% { transform: scale(1.4); opacity: 0; } }
        .target-reached::before { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 4px solid #D4AF37; animation: pulse-ring 0.6s ease-out; }

        .compass-ring { transition: transform 0.1s linear; }
    </style>
</head>
<body class="theme-light antialiased transition-colors duration-300">

    <div id="app-container">
        
        <!-- HEADER -->
        <header class="pt-6 pb-4 px-6 sticky top-0 bg-theme-main/90 backdrop-blur-md z-30 border-b border-theme-border">
            
            <!-- Pesan Custom Nama -->
            <div id="custom-greeting" class="hidden mb-4 text-[11px] bg-theme-card border border-theme-border rounded-full px-3 py-1.5 inline-flex items-center text-theme-text shadow-sm w-full overflow-hidden whitespace-nowrap text-ellipsis">
                <!-- Text diisi JS -->
            </div>

            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-extrabold tracking-tighter">
                    dkrtv<span class="text-gold-500">.</span>
                </h1>
                
                <!-- Theme Switcher -->
                <div class="flex space-x-1.5 bg-theme-card p-1.5 rounded-full border border-theme-border shadow-sm">
                    <button onclick="changeTheme('light')" class="w-5 h-5 rounded-full bg-[#FAFAFA] border border-gray-200"></button>
                    <button onclick="changeTheme('cream')" class="w-5 h-5 rounded-full bg-[#FAF7F2] border border-gray-300"></button>
                    <button onclick="changeTheme('green')" class="w-5 h-5 rounded-full bg-[#064E3B]"></button>
                    <button onclick="changeTheme('navy')" class="w-5 h-5 rounded-full bg-[#0F172A]"></button>
                    <button onclick="changeTheme('dark')" class="w-5 h-5 rounded-full bg-[#121212] border border-gray-700"></button>
                </div>
            </div>
        </header>

        <!-- MAIN CONTENT AREA -->
        <main class="relative w-full h-full pb-24">
            
            <!-- 1. TAB TASBIH (Default) -->
            <section id="tab-tasbih" class="tab-content tab-active flex flex-col items-center justify-center px-6 pt-10">
                
                <!-- Pilihan Target -->
                <div class="mb-8 flex space-x-2 bg-theme-card p-1.5 rounded-full shadow-sm border border-theme-border">
                    <button onclick="setTarget(33)" id="btn-t33" class="px-5 py-1.5 rounded-full text-sm font-bold bg-theme-accent text-gold-500 transition-all">33</button>
                    <button onclick="setTarget(99)" id="btn-t99" class="px-5 py-1.5 rounded-full text-sm font-medium text-theme-muted hover:text-theme-text transition-all">99</button>
                    <button onclick="setTarget(0)" id="btn-t0" class="px-5 py-1.5 rounded-full text-sm font-medium text-theme-muted hover:text-theme-text transition-all"><i class="fa-solid fa-infinity text-xs"></i></button>
                </div>

                <!-- Tombol Tasbih Utama -->
                <div class="relative flex items-center justify-center mb-10">
                    <!-- Layer bayangan luar -->
                    <div class="absolute w-64 h-64 bg-gold-500/20 rounded-full blur-2xl"></div>
                    
                    <button id="tap-btn" class="btn-dzikir relative w-64 h-64 rounded-full bg-theme-card text-theme-text flex flex-col items-center justify-center border-[6px] border-theme-accent z-10 outline-none shadow-lg">
                        <span id="dzikir-text" class="text-[11px] font-semibold text-gold-500 tracking-widest uppercase mb-1">Subhanallah</span>
                        <span id="counter-display" class="text-7xl font-bold tracking-tighter mb-2">0</span>
                        <span class="text-xs text-theme-muted font-medium bg-theme-accent px-3 py-1 rounded-full"><i class="fa-solid fa-hand-pointer mr-1.5"></i>Tap layar</span>
                    </button>
                </div>

                <!-- Tombol Reset -->
                <button id="reset-btn" class="text-theme-muted hover:text-red-400 transition-colors flex items-center space-x-2 px-5 py-2.5 bg-theme-card rounded-full shadow-sm border border-theme-border active:scale-95">
                    <i class="fa-solid fa-rotate-left"></i>
                    <span class="text-xs font-semibold uppercase tracking-wider">Reset</span>
                </button>
            </section>

            <!-- 2. TAB JADWAL SHOLAT -->
            <section id="tab-jadwal" class="tab-content tab-hidden flex-col items-center px-6 pt-6">
                
                <div class="w-full bg-theme-card rounded-3xl shadow-sm border border-theme-border p-6 mb-6 text-center relative overflow-hidden">
                    <div class="absolute top-0 right-0 p-4 opacity-10"><i class="fa-solid fa-mosque text-6xl"></i></div>
                    <h2 class="text-xs text-theme-muted font-semibold uppercase tracking-widest mb-1 relative z-10">Lokasi Anda</h2>
                    <p id="lokasi-teks" class="text-lg font-bold text-theme-text mb-5 relative z-10">Belum terdeteksi</p>
                    
                    <button onclick="getLocationAndPrayerTimes()" class="bg-gradient-to-r from-gold-500 to-gold-400 text-white px-5 py-3 rounded-full text-sm font-semibold shadow-soft-glow w-full relative z-10 active:scale-95 transition-transform">
                        <i class="fa-solid fa-location-crosshairs mr-2"></i> Deteksi Lokasi Otomatis
                    </button>
                </div>

                <div id="prayer-container" class="w-full space-y-3 opacity-50 pointer-events-none transition-opacity duration-500">
                    <!-- Jadwal list -->
                    <div class="flex justify-between items-center bg-theme-card p-4.5 px-5 rounded-2xl shadow-sm border border-theme-border">
                        <span class="font-semibold text-theme-muted text-sm">Subuh</span><span class="font-bold text-theme-text text-lg" id="time-Fajr">--:--</span>
                    </div>
                    <div class="flex justify-between items-center bg-theme-card p-4.5 px-5 rounded-2xl shadow-sm border border-theme-border">
                        <span class="font-semibold text-theme-muted text-sm">Dzuhur</span><span class="font-bold text-theme-text text-lg" id="time-Dhuhr">--:--</span>
                    </div>
                    <div class="flex justify-between items-center bg-theme-card p-4.5 px-5 rounded-2xl shadow-sm border border-theme-border">
                        <span class="font-semibold text-theme-muted text-sm">Ashar</span><span class="font-bold text-theme-text text-lg" id="time-Asr">--:--</span>
                    </div>
                    <div class="flex justify-between items-center bg-theme-card p-4.5 px-5 rounded-2xl shadow-sm border border-theme-border">
                        <span class="font-semibold text-theme-muted text-sm">Maghrib</span><span class="font-bold text-theme-text text-lg" id="time-Maghrib">--:--</span>
                    </div>
                    <div class="flex justify-between items-center bg-theme-card p-4.5 px-5 rounded-2xl shadow-sm border border-theme-border">
                        <span class="font-semibold text-theme-muted text-sm">Isya</span><span class="font-bold text-theme-text text-lg" id="time-Isha">--:--</span>
                    </div>
                </div>
            </section>

            <!-- 3. TAB KIBLAT -->
            <section id="tab-kiblat" class="tab-content tab-hidden flex-col items-center justify-center px-6 pt-12">
                <div class="text-center mb-10">
                    <h2 class="text-2xl font-bold text-theme-text">Arah Kiblat</h2>
                    <p class="text-xs text-theme-muted mt-2">Letakkan HP di permukaan yang datar (lantai/meja).</p>
                </div>
                
                <div class="relative w-72 h-72 flex items-center justify-center mb-10">
                    <!-- Compass Outer Design -->
                    <div class="absolute inset-0 rounded-full border-[8px] border-theme-accent shadow-sm"></div>
                    
                    <!-- Compass Rose (Rotates) -->
                    <div id="compass-rose" class="compass-ring absolute inset-2 rounded-full border border-theme-border flex items-center justify-center bg-theme-card shadow-inner">
                        <div class="absolute top-3 text-red-500 font-bold text-sm">U</div>
                        <div class="absolute bottom-3 text-theme-muted font-bold text-sm">S</div>
                        <div class="absolute right-3 text-theme-muted font-bold text-sm">T</div>
                        <div class="absolute left-3 text-theme-muted font-bold text-sm">B</div>
                        
                        <!-- Kaaba Pointer -->
                        <div id="qibla-pointer" class="absolute w-full h-full flex items-start justify-center transition-transform duration-200" style="transform: rotate(0deg);">
                            <div class="bg-theme-main p-2 rounded-full shadow-md mt-8 border border-theme-border">
                                <i class="fa-solid fa-kaaba text-3xl text-gold-500"></i>
                            </div>
                            <!-- Garis penunjuk -->
                            <div class="absolute top-0 w-1 h-8 bg-gold-500 rounded-full"></div>
                        </div>
                    </div>
                </div>

                <button onclick="requestCompassPermission()" class="bg-theme-card border border-theme-border text-theme-text px-6 py-3 rounded-full text-sm font-semibold shadow-sm active:scale-95 transition-transform">
                    <i class="fa-regular fa-compass mr-2 text-gold-500"></i> Kalibrasi Kompas
                </button>
                <p id="kiblat-status" class="text-[10px] text-theme-muted mt-4 text-center bg-theme-accent px-4 py-2 rounded-full uppercase tracking-wider">Menunggu Sensor...</p>
            </section>

        </main>

        <!-- BOTTOM NAVIGATION -->
        <nav class="absolute bottom-0 w-full bg-theme-card/90 backdrop-blur-lg border-t border-theme-border px-6 py-4 flex justify-around items-center z-30 pb-safe shadow-[0_-10px_30px_rgba(0,0,0,0.05)] rounded-t-3xl">
            <button onclick="switchTab('tasbih')" id="nav-tasbih" class="nav-btn flex flex-col items-center text-gold-500 w-1/3 transition-colors">
                <i class="fa-solid fa-fingerprint text-2xl mb-1.5"></i>
                <span class="text-[10px] font-bold tracking-wide">Tasbih</span>
            </button>
            <button onclick="switchTab('jadwal')" id="nav-jadwal" class="nav-btn flex flex-col items-center text-theme-muted hover:text-gold-400 w-1/3 transition-colors">
                <i class="fa-solid fa-clock text-2xl mb-1.5"></i>
                <span class="text-[10px] font-medium tracking-wide">Jadwal</span>
            </button>
            <button onclick="switchTab('kiblat')" id="nav-kiblat" class="nav-btn flex flex-col items-center text-theme-muted hover:text-gold-400 w-1/3 transition-colors">
                <i class="fa-solid fa-kaaba text-2xl mb-1.5"></i>
                <span class="text-[10px] font-medium tracking-wide">Kiblat</span>
            </button>
        </nav>
    </div>

    <!-- LOGIKA JAVASCRIPT & ANTI HACKER -->
    <script>
        // ================= ANTI HACKER / ANTI COPY SYSTEM =================
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if (e.keyCode == 123) return false; // F12
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false; // Ctrl+Shift+I
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false; // Ctrl+Shift+C
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false; // Ctrl+Shift+J
            if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false; // Ctrl+U
            if (e.ctrlKey && e.keyCode == 'C'.charCodeAt(0)) return false; // Ctrl+C
            if (e.ctrlKey && e.keyCode == 'S'.charCodeAt(0)) return false; // Ctrl+S
        };
        // ==================================================================

        // --- INIT & THEME ---
        document.addEventListener("DOMContentLoaded", () => {
            initTheme();
            checkCustomGreeting();
        });

        function changeTheme(theme) {
            document.body.className = `theme-${theme} antialiased transition-colors duration-300`;
            localStorage.setItem('dkrtv_theme', theme);
        }
        function initTheme() {
            const savedTheme = localStorage.getItem('dkrtv_theme') || 'light';
            changeTheme(savedTheme);
        }

        // --- CUSTOM GREETING UNIVERSAL ---
        function checkCustomGreeting() {
            const urlParams = new URLSearchParams(window.location.search);
            const customName = urlParams.get('by') || urlParams.get('dari'); 
            const customMsg = urlParams.get('msg') || 'Salam hangat dari'; 

            if (customName) {
                const greetingEl = document.getElementById('custom-greeting');
                greetingEl.innerHTML = `<i class="fa-solid fa-gift text-gold-500 mr-2 text-sm"></i> ${customMsg}: <span class="font-bold ml-1">${customName}</span>`;
                greetingEl.classList.remove('hidden');
            }
        }

        // --- AUDIO ENGINE ---
        let audioCtx;
        function playClickSound() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(600, audioCtx.currentTime); // Nada lebih modern, tidak kasar
            oscillator.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);
            
            gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.05);
        }

        // --- 1. TAB NAVIGATION ---
        function switchTab(tabName) {
            ['tasbih', 'jadwal', 'kiblat'].forEach(t => {
                const el = document.getElementById(`tab-${t}`);
                el.classList.replace('tab-active', 'tab-hidden');
                
                const nav = document.getElementById(`nav-${t}`);
                nav.classList.remove('text-gold-500'); nav.classList.add('text-theme-muted');
                nav.querySelector('span').classList.remove('font-bold'); nav.querySelector('span').classList.add('font-medium');
            });

            document.getElementById(`tab-${tabName}`).classList.replace('tab-hidden', 'tab-active');
            
            const activeNav = document.getElementById(`nav-${tabName}`);
            activeNav.classList.remove('text-theme-muted'); activeNav.classList.add('text-gold-500');
            activeNav.querySelector('span').classList.remove('font-medium'); activeNav.querySelector('span').classList.add('font-bold');
        }

        // --- 2. TASBIH DIGITAL ---
        const tapBtn = document.getElementById('tap-btn');
        const counterDisplay = document.getElementById('counter-display');
        const dzikirText = document.getElementById('dzikir-text');
        
        let count = localStorage.getItem('dkrtv_count') ? parseInt(localStorage.getItem('dkrtv_count')) : 0;
        let target = localStorage.getItem('dkrtv_target') ? parseInt(localStorage.getItem('dkrtv_target')) : 33;
        
        counterDisplay.innerText = count;
        updateTargetUI(); updateDzikirText();

        tapBtn.addEventListener('click', () => {
            count++; counterDisplay.innerText = count; localStorage.setItem('dkrtv_count', count);
            playClickSound();

            if (navigator.vibrate) {
                if (target > 0 && count % target === 0) {
                    navigator.vibrate([100, 50, 100]);
                    tapBtn.classList.remove('target-reached');
                    void tapBtn.offsetWidth; 
                    tapBtn.classList.add('target-reached');
                } else {
                    navigator.vibrate(30);
                }
            }
            updateDzikirText();
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            if(confirm('Reset hitungan ke 0?')) {
                count = 0; counterDisplay.innerText = count; localStorage.setItem('dkrtv_count', count); updateDzikirText();
            }
        });

        function setTarget(newTarget) {
            target = newTarget; localStorage.setItem('dkrtv_target', target);
            updateTargetUI(); updateDzikirText();
        }

        function updateTargetUI() {
            ['t33', 't99', 't0'].forEach(id => {
                let btn = document.getElementById('btn-' + id);
                btn.className = 'px-5 py-1.5 rounded-full text-sm font-medium text-theme-muted hover:text-theme-text transition-all';
            });
            let activeId = target === 33 ? 't33' : (target === 99 ? 't99' : 't0');
            document.getElementById('btn-' + activeId).className = 'px-5 py-1.5 rounded-full text-sm font-bold bg-theme-accent text-gold-500 transition-all';
        }

        function updateDzikirText() {
            if (target === 33 || target === 99) {
                let phase = count % 99;
                if (phase < 33) dzikirText.innerText = "Subhanallah";
                else if (phase < 66) dzikirText.innerText = "Alhamdulillah";
                else dzikirText.innerText = "Allahu Akbar";
                if(count === 0) dzikirText.innerText = "Subhanallah";
            } else { dzikirText.innerText = "Dzikir"; }
        }

        // --- 3. JADWAL SHOLAT & LOKASI ---
        let userLat, userLon;
        function getLocationAndPrayerTimes() {
            const locText = document.getElementById('lokasi-teks');
            locText.innerText = "Mendeteksi...";
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    userLat = position.coords.latitude; userLon = position.coords.longitude;
                    locText.innerText = "Lokasi Ditemukan";
                    
                    fetch(`https://api.aladhan.com/v1/timings?latitude=${userLat}&longitude=${userLon}&method=2`)
                        .then(res => res.json())
                        .then(data => {
                            const t = data.data.timings;
                            document.getElementById('time-Fajr').innerText = t.Fajr;
                            document.getElementById('time-Dhuhr').innerText = t.Dhuhr;
                            document.getElementById('time-Asr').innerText = t.Asr;
                            document.getElementById('time-Maghrib').innerText = t.Maghrib;
                            document.getElementById('time-Isha').innerText = t.Isha;
                            document.getElementById('prayer-container').classList.remove('opacity-50', 'pointer-events-none');
                        })
                        .catch(err => locText.innerText = "Gagal memuat jadwal");
                        
                    calculateQibla(userLat, userLon);
                }, () => { locText.innerText = "Izin lokasi ditolak/gagal"; });
            } else { locText.innerText = "GPS tidak didukung"; }
        }

        // --- 4. ARAH KIBLAT (KOMPAS) ---
        let qiblaBearing = 0;
        function calculateQibla(lat, lon) {
            const latK = 21.422487 * Math.PI / 180.0, lonK = 39.826206 * Math.PI / 180.0;
            const phi = lat * Math.PI / 180.0, lambda = lon * Math.PI / 180.0;
            const y = Math.sin(lonK - lambda);
            const x = Math.cos(phi) * Math.tan(latK) - Math.sin(phi) * Math.cos(lonK - lambda);
            let bearing = Math.atan2(y, x) * 180.0 / Math.PI;
            qiblaBearing = (bearing + 360) % 360;
            document.getElementById('kiblat-status').innerText = `Kiblat: ${qiblaBearing.toFixed(1)}° (Dari Utara)`;
        }

        function requestCompassPermission() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(state => {
                    if (state === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation, true);
                        if(!userLat) getLocationAndPrayerTimes();
                    } else alert("Izin sensor kompas ditolak.");
                }).catch(console.error);
            } else {
                window.addEventListener('deviceorientationabsolute', handleOrientation, true);
                if(!userLat) getLocationAndPrayerTimes();
            }
        }

        function handleOrientation(event) {
            let alpha = event.alpha, webkitHeading = event.webkitCompassHeading;
            let heading = webkitHeading || (360 - alpha); 
            if (typeof heading === 'number') {
                document.getElementById('compass-rose').style.transform = `rotate(${-heading}deg)`;
                document.getElementById('qibla-pointer').style.transform = `rotate(${qiblaBearing}deg)`;
            }
        }
    </script>
</body>
</html>
