<!DOCTYPE html>
<html lang="id">
<head>
    <title>Akses Galeri</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; background: #f8fafc; padding: 20px;}
        .card { background: white; padding: 20px; border-radius: 10px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1);}
        input, select { width: 100%; padding: 10px; margin-bottom: 15px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px;}
        button { background: #2563eb; color: white; padding: 10px; width: 100%; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;}
        .hidden { display: none !important; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 20px;}
        .grid img, .grid video { width: 100%; border-radius: 8px; aspect-ratio: 1; object-fit: cover;}
    </style>
</head>
<body>

    <h2 id="loadingText" style="text-align:center;">Memproses...</h2>

    <!-- FORM SETUP BUAT KLIEN KALO BARCODE KOSONG -->
    <div class="card hidden" id="formSetup">
        <h3>✨ Aktifkan Galeri Anda</h3>
        <p style="font-size:14px; color:gray;">Barcode ini masih kosong. Isi data untuk mengaktifkan.</p>
        <label>Nama Acara / Toko</label>
        <input type="text" id="cName">
        <label>Tipe Galeri</label>
        <select id="cTipe">
            <option value="Info">Katalog Publik (Tanpa Password)</option>
            <option value="Event">Event Privat (Pakai Password)</option>
        </select>
        <label>Password (Kunci Event)</label>
        <input type="text" id="cPass" placeholder="Isi jika tipe Event">
        <label>Link Folder Google Drive</label>
        <input type="text" id="cDrive" placeholder="Pastikan hak akses 'Siapa Saja'">
        <button onclick="klaim()">Aktifkan Galeri</button>
    </div>

    <!-- TAMPILAN GALERI BUAT TAMU KALO BARCODE UDAH AKTIF -->
    <div class="card hidden" id="galleryView" style="max-width: 600px;">
        <h2 id="gTitle"></h2>
        <div id="gridFoto" class="grid"></div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxS2Xad3FCI7YL2xvjJ8v6cXq_oa0l1Drj4RnzqEtbtwiHVuC90xFS-HcoDsnDL438BSQ/exec"; 
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('id');

        if(orderId) {
            fetch(GAS_URL + "?action=check&id=" + orderId).then(r=>r.json()).then(data => {
                document.getElementById('loadingText').classList.add('hidden');
                
                if (data.status === 'success') {
                    if (data.state === 'Kosong') {
                        // Kalo kosong, suruh klien isi form
                        document.getElementById('formSetup').classList.remove('hidden');
                    } else if (data.state === 'Aktif') {
                        // Kalo aktif, cek password (kalo event)
                        if (data.tipe === 'Event') {
                            let p = prompt("Masukkan Kunci Akses:");
                            if (p !== data.password) return alert("Password Salah!");
                        }
                        // Buka galeri
                        document.getElementById('galleryView').classList.remove('hidden');
                        document.getElementById('gTitle').innerText = data.name;
                        loadFoto(data.folder_url);
                    }
                } else alert(data.message);
            });
        }

        function klaim() {
            fetch(GAS_URL, {
                method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    action: 'claim', order_id: orderId, name: document.getElementById('cName').value,
                    wa: '', tipe: document.getElementById('cTipe').value,
                    password: document.getElementById('cPass').value, folder_url: document.getElementById('cDrive').value
                })
            }).then(r=>r.json()).then(d => { alert(d.message); location.reload(); });
        }

        function loadFoto(url) {
            document.getElementById('gridFoto').innerHTML = "Memuat Foto...";
            fetch(GAS_URL + "?action=get_images&url=" + encodeURIComponent(url)).then(r=>r.json()).then(d => {
                let html = '';
                d.images.forEach(img => {
                    if(img.type.includes('image')) html += `<img src="${img.url}">`;
                    if(img.type.includes('video')) html += `<video src="${img.url}" controls></video>`;
                });
                document.getElementById('gridFoto').innerHTML = html;
            });
        }
    </script>
</body>
</html>
