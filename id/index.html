<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Galeri Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F8FAFC; color: #0F172A; margin: 0; padding: 20px; }
        .hidden { display: none !important; }
        .container { max-width: 500px; margin: 50px auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        
        /* Loading */
        .loader { border: 4px solid #E2E8F0; border-top: 4px solid #2563EB; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        h2 { text-align: center; font-weight: 800; color: #1E293B; margin-top: 0; }
        p { text-align: center; color: #64748B; font-size: 14px; }
        
        /* Form Element */
        label { font-size: 13px; font-weight: 700; color: #475569; display: block; margin: 15px 0 5px; }
        input, select { width: 100%; padding: 14px; border: 1.5px solid #E2E8F0; border-radius: 12px; box-sizing: border-box; font-family: inherit; outline: none; transition: 0.3s; }
        input:focus, select:focus { border-color: #2563EB; }
        button { width: 100%; background: #2563EB; color: white; border: none; padding: 15px; border-radius: 12px; font-weight: 800; cursor: pointer; margin-top: 20px; transition: 0.3s; }
        button:hover { background: #1D4ED8; }
        button:disabled { background: #94A3B8; }

        /* Gallery Grid */
        .gallery-container { max-width: 900px; margin: 0 auto; }
        .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin-top: 20px; }
        .photo-item { width: 100%; aspect-ratio: 1; border-radius: 15px; object-fit: cover; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <!-- 1. LOADING SCREEN -->
    <div class="container" id="loadingScreen">
        <div class="loader"></div>
        <h2 id="loadingText">Memeriksa Barcode...</h2>
    </div>

    <!-- 2. FORM KLAIM (Klien Input Data) -->
    <div class="container hidden" id="claimForm">
        <h2>✨ Setup Galeri Anda</h2>
        <p>Barcode ini masih kosong. Silakan isi data di bawah untuk mengaktifkan galeri Anda.</p>
        
        <label>Nama Acara / Toko</label>
        <input type="text" id="cName" placeholder="Contoh: Katalog Baju Lebaran">
        
        <label>No. WhatsApp</label>
        <input type="number" id="cWa" placeholder="628123...">

        <label>Tipe Galeri</label>
        <select id="cTipe">
            <option value="Info">Katalog Publik (Tanpa Password)</option>
            <option value="Event">Event Privat (Pakai Password)</option>
        </select>
        
        <label>Password / PIN (Untuk Edit / Kunci)</label>
        <input type="text" id="cPass" placeholder="Buat PIN Rahasia">

        <label>Link Folder Google Drive</label>
        <input type="text" id="cDrive" placeholder="Pastikan akses: 'Siapa Saja / Anyone'">
        
        <button id="btnClaim" onclick="claimBarcode()">Aktifkan Barcode Sekarang</button>
    </div>

    <!-- 3. TAMPILAN GALERI (End-User) -->
    <div class="gallery-container hidden" id="galleryView">
        <h2 id="gTitle" style="font-size: 28px; margin-bottom: 5px;">Nama Galeri</h2>
        <p>Dokumentasi & Katalog Resmi</p>
        
        <div id="gLoader" class="loader"></div>
        <div class="photo-grid" id="photoGrid"></div>
    </div>

    <script>
        // ==========================================
        // PASTE  WEB APP GOOGLE SCRIPT LU DI SINI
        // ==========================================
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxS2Xad3FCI7YL2xvjJ8v6cXq_oa0l1Drj4RnzqEtbtwiHVuC90xFS-HcoDsnDL438BSQ/exec"; 
        
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('id');

        // Saat web dibuka, langsung cek status barcode
        if(orderId) {
            checkStatus();
        } else {
            document.getElementById('loadingText').innerText = "❌ URL Tidak Valid";
            document.querySelector('.loader').style.display = 'none';
        }

        function checkStatus() {
            fetch(GAS_URL + "?action=check&id=" + orderId)
            .then(res => res.json())
            .then(data => {
                document.getElementById('loadingScreen').classList.add('hidden');
                
                if (data.status === 'success') {
                    if (data.state === 'Kosong') {
                        // Jika Kosong, tampilkan Form Setup
                        document.getElementById('claimForm').classList.remove('hidden');
                    } else if (data.state === 'Aktif') {
                        // Jika Aktif, tampilkan UI Galeri, lalu load gambar dari Drive
                        document.getElementById('galleryView').classList.remove('hidden');
                        document.getElementById('gTitle').innerText = data.name;
                        loadGalleryImages(data.folder_url);
                    }
                } else {
                    alert(data.message);
                }
            }).catch(err => alert("Jaringan Error!"));
        }

        function claimBarcode() {
            const btn = document.getElementById('btnClaim');
            const payload = {
                action: 'claim', order_id: orderId,
                name: document.getElementById('cName').value,
                wa: document.getElementById('cWa').value,
                tipe: document.getElementById('cTipe').value,
                password: document.getElementById('cPass').value,
                folder_url: document.getElementById('cDrive').value
            };

            if(!payload.name || !payload.folder_url) return alert("Nama dan Link Drive wajib diisi!");
            
            btn.disabled = true; btn.innerText = "Menyimpan & Mengaktifkan...";

            fetch(GAS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    alert("Sukses! QR Code sudah aktif.");
                    window.location.reload(); // Reload halaman, otomatis masuk ke tampilan Galeri
                } else {
                    alert(data.message);
                    btn.disabled = false; btn.innerText = "Coba Lagi";
                }
            });
        }

        // Fungsi nyedot foto dari Google Drive via API Backend
        function loadGalleryImages(drive) {
            const grid = document.getElementById('photoGrid');
            const loader = document.getElementById('gLoader');
            
            fetch(GAS_ + "?action=get_images&=" + encodeURIComponent(drive))
            .then(res => res.json())
            .then(data => {
                loader.style.display = 'none';
                if(data.status === 'success') {
                    if(data.images.length === 0) {
                        grid.innerHTML = "<p>Folder Drive masih kosong atau file bukan foto/video.</p>";
                        return;
                    }
                    data.images.forEach(img => {
                        // Menampilkan foto
                        if(img.type.includes('image')) {
                            grid.innerHTML += `<img src="${img.}" class="photo-item" loading="lazy" alt="Foto">`;
                        } else if(img.type.includes('video')) {
                            // Menampilkan video
                            grid.innerHTML += `<video src="${img.}" class="photo-item" controls></video>`;
                        }
                    });
                } else {
                    grid.innerHTML = "<p style='color:red;'>Gagal memuat foto. Pastikan link drive benar dan aksesnya SIAPA SAJA (Public).</p>";
                }
            });
        }
    </script>
</body>
</html>
