<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Card - Dakreativ</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #141414;
            --text-main: #f0f0f0;
            --text-muted: #888;
            --accent: #333;
            --border: #222;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .card {
            background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 24px;
            padding: 40px 24px; width: 100%; max-width: 380px; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); opacity: 0; transform: translateY(10px);
            animation: fadeIn 0.5s forwards ease-out;
        }

        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

        .avatar { width: 80px; height: 80px; background: linear-gradient(135deg, #333, #111); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 32px; font-weight: bold; margin: 0 auto 20px; border: 1px solid var(--border); color: #fff;}
        .name { font-size: 24px; font-weight: 600; margin-bottom: 8px; letter-spacing: -0.5px; }
        .bio { font-size: 14px; color: var(--text-muted); line-height: 1.5; margin-bottom: 24px; }
        .badge { display: inline-block; padding: 4px 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); border-radius: 20px; font-size: 12px; color: var(--text-muted); margin-bottom: 24px; }
        
        .links { display: flex; flex-direction: column; gap: 12px; }
        .btn {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            padding: 14px 20px; background-color: transparent; border: 1px solid var(--border);
            color: var(--text-main); text-decoration: none; border-radius: 12px; font-size: 14px;
            font-weight: 500; transition: all 0.2s ease;
        }
        .btn:hover { background-color: var(--accent); transform: scale(1.02); }
        .btn svg { width: 20px; height: 20px; fill: currentColor; }
        
        .spinner { width: 30px; height: 30px; border: 3px solid var(--border); border-top-color: var(--text-main); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .state-text { color: var(--text-muted); font-size: 14px; }
    </style>
</head>
<body>

    <div id="card-container" class="card">
        <div class="spinner"></div>
        <p class="state-text">Memuat profil...</p>
    </div>

    <script>
        // MASUKKAN LINK GOOGLE APPS SCRIPT LO DI BAWAH INI (TANDA KUTIP JANGAN DIHAPUS)
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxxKQCp8huU_pEJ2uOF3aYE30oYHo_3FYNXJ1pX2AEiHfiVO8LPZip8Z3e9uE8OPJquew/exec'; 

        const urlParams = new URLSearchParams(window.location.search);
        const idProduk = urlParams.get('id');
        const container = document.getElementById('card-container');

        // Fungsi Format WA Anti-Error
        function formatWA(number) {
            if(!number) return "";
            let cleaned = number.toString().replace(/\D/g, ''); 
            if(cleaned.startsWith('0')) return '62' + cleaned.substring(1);
            if(cleaned.startsWith('8')) return '62' + cleaned;
            return cleaned; 
        }

        // Fungsi Inisial Nama untuk Avatar Profile
        function getInitials(name) {
            return name ? name.charAt(0).toUpperCase() : "D";
        }

        if (!idProduk) {
            container.innerHTML = '<p class="state-text" style="color: #ff4d4d;">Akses ditolak: ID Produk tidak valid.</p>';
        } else {
            fetch(`${scriptURL}?id=${idProduk}`)
                .then(res => res.json())
                .then(res => {
                    const data = res.data || res; 
                    
                    if (res.error || !data.Nama_Pemilik) {
                        if(data.Status === "Kosong") {
                            container.innerHTML = `
                                <div class="avatar">?</div>
                                <h2 class="name">Kartu Belum Aktif</h2>
                                <p class="bio">Digital card ini belum diatur oleh pemiliknya.</p>
                                <span class="badge">ID: ${idProduk}</span>
                            `;
                            return;
                        }
                        container.innerHTML = `<p class="state-text" style="color: #ff4d4d;">Data tidak ditemukan.</p>`;
                        return;
                    }

                    // Tampilkan Tombol Sosmed Hanya Kalau Datanya Ada
                    let buttonsHTML = '';
                    
                    if (data.WA_Pemilik) {
                        const waReady = formatWA(data.WA_Pemilik);
                        buttonsHTML += `<a href="https://wa.me/${waReady}" class="btn" target="_blank">
                            <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>
                            WhatsApp
                        </a>`;
                    }
                    if (data.IG_Pemilik) {
                        buttonsHTML += `<a href="https://instagram.com/${data.IG_Pemilik.replace('@','')}" class="btn" target="_blank">
                            <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/></svg>
                            Instagram
                        </a>`;
                    }
                    if (data.TikTok_Pemilik) {
                        buttonsHTML += `<a href="https://tiktok.com/@${data.TikTok_Pemilik.replace('@','')}" class="btn" target="_blank">
                            <svg viewBox="0 0 24 24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93v7.2c0 1.96-.5 3.96-1.75 5.42-1.67 1.95-4.33 2.8-6.9 2.22-2.8-.62-5-2.92-5.4-5.74-.2-1.32-.04-2.71.55-3.9 1.15-2.3 3.65-3.72 6.22-3.7.02 1.4.01 2.8.03 4.2-.9-.05-1.85.12-2.6.7-.85.65-1.3 1.7-1.15 2.75.18 1.15 1.1 2.1 2.25 2.35 1.22.28 2.6-.08 3.32-1.1.7-.95.82-2.15.82-3.3V0h3.53z"/></svg>
                            TikTok
                        </a>`;
                    }

                    container.innerHTML = `
                        <div class="avatar">${getInitials(data.Nama_Pemilik)}</div>
                        <h2 class="name">${data.Nama_Pemilik}</h2>
                        <p class="bio">${data.Pesan_Custom || "Silakan hubungi saya melalui link di bawah ini."}</p>
                        <div class="links">
                            ${buttonsHTML || '<p class="state-text">Belum ada sosial media tertaut.</p>'}
                        </div>
                    `;
                })
                .catch(error => {
                    container.innerHTML = '<p class="state-text" style="color: #ff4d4d;">Koneksi gagal. Silakan muat ulang halaman ini.</p>';
                });
        }
    </script>
</body>
</html>
