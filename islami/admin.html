<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - WA DKTV</title>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- QRCode & JSZip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* === UI/UX MODERN MINIMALIST === */
        :root {
            --bg-body: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-main: #0F172A;
            --text-sub: #64748B;
            --border: #E2E8F0;
            --primary: #10B981;
            --primary-hover: #059669;
            --ring: rgba(16, 185, 129, 0.2);
            --radius: 16px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg-body); color: var(--text-main); padding: 20px; line-height: 1.5; }
        
        .container { max-width: 1000px; margin: 0 auto; display: grid; gap: 24px; }
        @media(min-width: 768px) { .container { grid-template-columns: 350px 1fr; align-items: start; padding-top: 40px; } }

        .card { background: var(--bg-card); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .card-header { margin-bottom: 20px; }
        .card-title { font-size: 18px; font-weight: 800; color: var(--text-main); letter-spacing: -0.5px; }
        .card-desc { font-size: 13px; color: var(--text-sub); }

        /* Form Inputs */
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.5px; }
        .form-control { width: 100%; padding: 12px 16px; background: var(--bg-body); border: 1px solid var(--border); border-radius: 10px; font-size: 14px; font-weight: 600; color: var(--text-main); transition: 0.2s; outline: none; }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--ring); background: var(--bg-card); }
        
        .flex-row { display: flex; gap: 12px; }
        .flex-row > div { flex: 1; }

        /* Buttons */
        .btn { width: 100%; padding: 14px 20px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.2s; border: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 12px var(--ring); }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); padding: 8px 12px; font-size: 12px; width: auto; }
        .btn-outline:hover { background: var(--bg-body); border-color: var(--text-sub); }

        /* Table Responsive */
        .table-wrapper { overflow-x: auto; margin-top: 10px; border-radius: 10px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; text-align: left; min-width: 600px; }
        th, td { padding: 14px 16px; font-size: 13px; border-bottom: 1px solid var(--border); }
        th { background: var(--bg-body); font-weight: 700; color: var(--text-sub); text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
        tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: #F8FAFC; }

        .badge { padding: 4px 10px; border-radius: 100px; font-size: 11px; font-weight: 700; display: inline-block; }
        .badge-kosong { background: #FEE2E2; color: #DC2626; }
        .badge-aktif { background: #D1FAE5; color: #059669; }

        /* Action Buttons */
        .action-btns { display: flex; gap: 8px; }
        .btn-icon { padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--bg-card); transition: 0.2s; }
        .btn-icon:hover { background: var(--bg-body); }
        .btn-qr { color: var(--primary); border-color: rgba(16,185,129,0.3); background: rgba(16,185,129,0.05); }
        .btn-qr:hover { background: rgba(16,185,129,0.1); }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- KOLOM KIRI: GENERATOR FORM -->
        <div class="card">
            <div class="card-header">
                <h1 class="card-title">📦 Buat Barcode (Batch)</h1>
                <p class="card-desc">Generate barcode massal untuk pembeli</p>
            </div>

            <div class="form-group">
                <label>Kualifikasi / Nama Pembeli</label>
                <input type="text" id="pembeli" class="form-control" placeholder="Cth: Dadan Project">
            </div>

            <div class="flex-row">
                <div class="form-group">
                    <label>Prefix ID</label>
                    <input type="text" id="prefixId" class="form-control" placeholder="Cth: DKN" value="DKN-">
                </div>
                <div class="form-group">
                    <label>Jumlah Barcode</label>
                    <input type="number" id="qty" class="form-control" placeholder="Cth: 10" value="10">
                </div>
            </div>

            <button id="btnGen" class="btn btn-primary" onclick="generateAndZip()">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Generate & Download ZIP
            </button>
        </div>

        <!-- KOLOM KANAN: DATABASE TABLE -->
        <div class="card">
            <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h2 class="card-title">Data Kartu NFC/QR</h2>
                    <p class="card-desc">Semua barcode yang telah digenerate</p>
                </div>
                <button class="btn btn-outline" onclick="loadData()">🔄 Refresh</button>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID Barcode</th>
                            <th>Pembeli (Batch)</th>
                            <th>Klien / User</th>
                            <th>No. WA</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabel">
                        <tr><td colspan="6" style="text-align: center;">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- ELEMEN INVISIBLE UNTUK RENDER QR SEBELUM DI-ZIP -->
    <div id="hidden-qr-engine" style="display:none;"></div>

    <script>
        // ==========================================
        const SUPA_URL = 'URL_SUPABASE_ANDA';
        const SUPA_KEY = 'KEY_SUPABASE_ANDA'; 
        // ==========================================

        const WEB_URL = window.location.origin + window.location.pathname.replace('admin.html', 'index.html'); 
        var dbSupabase = window.supabase.createClient(SUPA_URL, SUPA_KEY);

        // ==============================================
        // FITUR BARU: GENERATE DATABASE & LANGSUNG ZIP 📦
        // ==============================================
        async function generateAndZip() {
            const pembeli = document.getElementById('pembeli').value;
            const prefix = document.getElementById('prefixId').value;
            const qty = parseInt(document.getElementById('qty').value) || 1;
            const btn = document.getElementById('btnGen');

            if(!pembeli || !prefix) return alert("Nama Pembeli dan Prefix ID wajib diisi!");
            btn.disabled = true; btn.innerHTML = "⏳ Memproses Database...";

            // 1. Siapkan Array Data
            const dataToInsert = [];
            const kumpulanId = [];
            for(let i = 1; i <= qty; i++) {
                let finalId = qty === 1 ? prefix : `${prefix}-${i}`;
                dataToInsert.push({ id: finalId, status: 'Kosong', pembeli: pembeli });
                kumpulanId.push(finalId);
            }

            // 2. Insert ke Supabase
            const { error } = await dbSupabase.from('wa1').insert(dataToInsert);

            if (error) {
                btn.disabled = false; btn.innerHTML = "Generate & Download ZIP";
                if(error.code === '23505') return alert("Error: Ada ID Barcode yang sama di database!");
                return alert("Gagal menyimpan ke database: " + error.message);
            }

            // 3. Mulai Proses Pembuatan ZIP File
            btn.innerHTML = "📦 Sedang membungkus ZIP...";
            
            const zip = new JSZip();
            // Buat folder di dalam file zip berdasarkan nama pembeli
            const folderZip = zip.folder(`QR_${pembeli.replace(/\s+/g, '_')}`);

            for(let id of kumpulanId) {
                // Generate QR Code menjadi Base64 Images secara background (tanpa tampil di layar)
                const base64Data = await generateQRBase64(id);
                // Masukkan gambar ke dalam folder ZIP (ambil data base64-nya saja tanpa header mime-type)
                folderZip.file(`${id}.png`, base64Data.split(',')[1], {base64: true});
            }

            // 4. Download File ZIP ke Komputer/HP
            zip.generateAsync({type:"blob"}).then(function(content) {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = `Batch_QR_${pembeli.replace(/\s+/g, '_')}.zip`;
                link.click();
                
                // Reset Tombol & Refresh Tabel
                btn.disabled = false; 
                btn.innerHTML = `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> Generate & Download ZIP`;
                
                document.getElementById('pembeli').value = '';
                document.getElementById('prefixId').value = '';
                document.getElementById('qty').value = '10';
                
                loadData();
                alert(`Sukses! ${qty} Barcode untuk ${pembeli} telah terdownload dalam bentuk ZIP.`);
            });
        }

        // ==============================================
        // MESIN QR RENDERER (Merender gambar tanpa merusak UI)
        // ==============================================
        function generateQRBase64(id) {
            return new Promise((resolve) => {
                const engine = document.getElementById('hidden-qr-engine');
                engine.innerHTML = ''; // Bersihkan canvas sebelumnya
                
                // Buat QR Code Resolusi Tinggi (400x400)
                new QRCode(engine, { text: WEB_URL + "?id=" + id, width: 400, height: 400 });
                
                // Beri waktu browser untuk merender canvas
                setTimeout(() => {
                    const canvas = engine.querySelector('canvas');
                    resolve(canvas.toDataURL("image/png"));
                }, 100);
            });
        }

        // ==============================================
        // FITUR DOWNLOAD SATUAN (Jika ilang/mau di download ulang)
        // ==============================================
        async function downloadSatuQR(id) {
            const base64Data = await generateQRBase64(id);
            const link = document.createElement('a'); 
            link.href = base64Data;
            link.download = `QR_WADKTV_${id}.png`; 
            link.click();
        }

        // ==============================================
        // TAMPILKAN DATABASE
        // ==============================================
        async function loadData() {
            const tbody = document.getElementById('tabel');
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-sub);">Memuat data...</td></tr>';
            
            const { data, error } = await dbSupabase.from('wa1').select('*').order('created_at', { ascending: false });
            
            if (error) {
                tbody.innerHTML = `<tr><td colspan="6" style="color:red; text-align:center;">Error DB: ${error.message}</td></tr>`;
                return;
            }

            let html = '';
            data.forEach(row => {
                let badge = row.status === 'Kosong' ? 'badge-kosong' : 'badge-aktif';
                let targetUrl = WEB_URL + "?id=" + row.id;
                
                html += `<tr>
                            <td><strong style="color:var(--text-main);">${row.id}</strong></td>
                            <td style="color:var(--text-sub);">${row.pembeli || '<span style="opacity:0.5">-</span>'}</td>
                            <td>${row.nama || '<span style="opacity:0.5">-</span>'}</td>
                            <td>${row.wa || '<span style="opacity:0.5">-</span>'}</td>
                            <td><span class="badge ${badge}">${row.status}</span></td>
                            <td>
                                <div class="action-btns">
                                    <button class="btn-icon btn-qr" onclick="downloadSatuQR('${row.id}')" title="Download QR Satuan">⬇️ QR</button>
                                    <button class="btn-icon" onclick="window.open('${targetUrl}', '_blank')" title="Cek Web Klien">🌐 Web</button>
                                </div>
                            </td>
                         </tr>`;
            });
            tbody.innerHTML = html || '<tr><td colspan="6" style="text-align:center; color: var(--text-sub);">Belum ada data barcode.</td></tr>';
        }

        loadData();
    </script>
</body>
</html>
