<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Profile</title>
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <link href="[https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap](https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap)" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0a0a0a; /* Background luar hitam pekat */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Animasi Background Kartu Mewah (Hitam ke Abu-abu metalik) */
        .premium-gradient {
            background: linear-gradient(-45deg, #111111, #2a2a2a, #000000, #1f1f1f);
            background-size: 400% 400%;
            animation: gradientMove 10s ease infinite;
            position: relative;
            overflow: hidden;
        }

        /* Efek kilap/kaca pada kartu */
        .premium-gradient::before {
            content: "";
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.03) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            animation: shine 6s infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        /* Hilangkan scrollbar tapi tetap bisa scroll */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="antialiased text-white p-4">

    <!-- Container Kartu -->
    <main class="w-full max-w-sm mx-auto premium-gradient rounded-3xl p-8 shadow-[0_0_40px_rgba(255,255,255,0.05)] border border-gray-800 flex-grow mt-8 mb-4">
        
        <!-- Profile Section -->
        <div class="flex flex-col items-center mb-8">
            <div class="w-24 h-24 rounded-full bg-white text-black flex items-center justify-center text-3xl font-bold mb-4 shadow-lg border-2 border-gray-300">
                A
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">Aditya Pratama</h1>
            <p class="text-gray-400 text-sm mt-1">Creative Director</p>
        </div>

        <!-- Custom Text / Status Message (Bisa di-loop atau dipilih dari database) -->
        <div class="bg-black/50 border border-gray-700 rounded-xl p-4 mb-8 text-center backdrop-blur-sm">
            <p class="text-sm font-medium text-gray-200">
                <!-- Contoh Opsi C (Bisa diganti A/B lewat backend) -->
                "Terima kasih telah berkenalan, follow social media saya di bawah ya."
            </p>
        </div>

        <!-- Links Data Section -->
        <div class="space-y-4">
            
            <!-- Link WhatsApp -->
            <a href="[https://wa.me/6281234567890](https://wa.me/6281234567890)" target="_blank" class="block w-full bg-white text-black text-center py-3.5 rounded-xl font-semibold hover:bg-gray-200 transition-all transform hover:scale-[1.02] active:scale-95 shadow-md">
                WhatsApp
            </a>

            <!-- Link Instagram -->
            <a href="[https://instagram.com/adityap](https://instagram.com/adityap)" target="_blank" class="block w-full bg-transparent border border-gray-600 text-white text-center py-3.5 rounded-xl font-semibold hover:bg-gray-800 transition-all transform hover:scale-[1.02] active:scale-95">
                Instagram
            </a>

            <!-- Link TikTok -->
            <a href="[https://tiktok.com/@adityap](https://tiktok.com/@adityap)" target="_blank" class="block w-full bg-transparent border border-gray-600 text-white text-center py-3.5 rounded-xl font-semibold hover:bg-gray-800 transition-all transform hover:scale-[1.02] active:scale-95">
                TikTok
            </a>

            <!-- Opsi Custom Button Extra (misal Opsi A/B dijadiin tombol tambahan) -->
            <a href="mailto:email@domain.com" class="block w-full bg-gray-900 border border-dashed border-gray-600 text-gray-400 text-center py-3 rounded-xl text-sm hover:text-white hover:border-gray-400 transition-all mt-6">
                Hubungi saya jika ada project
            </a>

        </div>

    </main>

    <!-- Footer Kecil -->
    <footer class="w-full text-center pb-4">
        <p class="text-[10px] text-gray-600 tracking-wider uppercase font-semibold">
            create PT Dakreativ Digital Media
        </p>
    </footer>

</body>
</html>
