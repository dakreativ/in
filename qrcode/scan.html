<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mengarahkan...</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --biru: #3b82f6; --dark: #0f172a; --gray: #64748b; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: var(--dark); text-align: center;}
        
        .loader { border: 4px solid #e2e8f0; border-top: 4px solid var(--biru); border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin: 0 auto 15px;}
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Form Klaim (Untuk Grosir) */
        #claimScreen { display: none; width: 100%; max-width: 400px; padding: 20px; }
        .glass-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 24px; padding: 35px 25px; box-shadow: 0 20px 40px -10px rgba(0,0,0,0.1); }
        .icon-lock { background: #dbeafe; width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
        .input-group { text-align: left; margin-bottom: 20px; }
        .input-group label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 8px; }
        .input-group input { width: 100%; padding: 16px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 14px; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: var(--biru); }
        .btn-simpan { width: 100%; background: var(--dark); color: white; border: none; padding: 16px; border-radius: 12px; font-weight: 800; font-size: 15px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="loadingScreen">
        <div class="loader"></div>
        <h3 style="color:var(--gray);">Memproses QR Code...</h3>
    </div>

    <div id="claimScreen">
        <div class="glass-card">
            <div class="icon-lock">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </div>
            <h2 style="font-size:22px; font-weight:800; margin-bottom:8px;">Klaim QR Code</h2>
            <p style="font-size:14px; color:var(--gray); margin-bottom:24px;">Masukkan link Anda. Setelah dikunci, link ini tidak dapat diubah lagi.</p>

            <form onsubmit="kunciQR(event)">
                <div class="input-group">
                    <label>Link / URL Tujuan</label>
                    <input type="url" id="linkTujuan" placeholder="https://instagram.com/akun" required>
                </div>
                <button type="submit" class="btn-simpan" id="btnSubmit">Kunci QR Code 🔒</button>
            </form>
        </div>
    </div>

<script>
    const supabaseUrl = 'https://bkxclrjycsdpchodgzzb.supabase.co';
    const supabaseKey = 'sb_publishable_F9D19Umk_ofD3bwZDP5sng_O4kSsG_3';
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    const idQR = new URLSearchParams(window.location.search).get('id');
    const loadingScreen = document.getElementById('loadingScreen');
    const claimScreen = document.getElementById('claimScreen');

    async function proses() {
        if (!idQR) return loadingScreen.innerHTML = '<h3 style="color:red;">QR Tidak Valid</h3>';

        const { data, error } = await supabaseClient.from('dynamic_links').select('*').eq('qr_id', idQR).single();
        if (error || !data) return loadingScreen.innerHTML = '<h3 style="color:red;">QR Code Tidak Terdaftar</h3>';

        // 1. JIKA LINK SUDAH ADA (Langsung Redirect + Hitung Klik)
        if (data.target_url && data.target_url.trim() !== "") {
            const klikBaru = (data.clicks || 0) + 1;
            supabaseClient.from('dynamic_links').update({ clicks: klikBaru }).eq('qr_id', idQR).then(() => {
                window.location.replace(data.target_url);
            }).catch(() => window.location.replace(data.target_url));
            return;
        }

        // 2. JIKA LINK MASIH KOSONG, TAPI INI LAYANAN PREMIUM (EDITABLE)
        if (data.tipe_qr === 'Editable') {
            loadingScreen.innerHTML = `
                <div style="background:white; padding:30px; border-radius:16px; border:1px solid #e2e8f0;">
                    <h3>Belum Diatur</h3>
                    <p style="font-size:14px; color:gray; margin-top:10px;">Pemilik QR belum memasukkan link melalui Dashboard Klien.</p>
                </div>`;
            return;
        }

        // 3. JIKA LINK MASIH KOSONG & INI PRODUK GROSIR (SEKALI KLAIM)
        if (data.tipe_qr === 'Sekali_Klaim') {
            loadingScreen.style.display = 'none';
            claimScreen.style.display = 'block';
        }
    }

    window.kunciQR = async function(e) {
        e.preventDefault();
        const linkBaru = document.getElementById('linkTujuan').value;
        const { error } = await supabaseClient.from('dynamic_links').update({ target_url: linkBaru, status: 'Terkunci' }).eq('qr_id', idQR);
        if (!error) window.location.replace(linkBaru);
    }

    proses();
</script>
</body>
</html>
