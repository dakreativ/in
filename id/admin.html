<!DOCTYPE html>
<html lang="id">
<head>
    <title>Admin Bikin Barcode</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #1e293b; color: white;}
        .card { background: #334155; padding: 20px; border-radius: 10px; max-width: 500px; margin: 0 auto 20px;}
        input { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box;}
        button { background: #38bdf8; padding: 10px; width: 100%; border: none; font-weight: bold; cursor: pointer;}
        table { width: 100%; margin-top: 20px; border-collapse: collapse;}
        td, th { padding: 10px; border: 1px solid #475569;}
    </style>
</head>
<body>
    <div class="card">
        <h2>1. Bikin Barcode Kosong</h2>
        <input type="password" id="pass" value="Tetydadan21@" placeholder="Password Admin">
        <input type="text" id="orderId" placeholder="Masukkan ID (cth: B001)">
        <button onclick="buatSlot()">Buat Slot Barcode</button>
    </div>

    <div class="card">
        <h2>2. Data Barcode</h2>
        <button onclick="loadData()">Refresh Data</button>
        <table>
            <thead><tr><th>ID</th><th>Status</th><th>Klien</th></tr></thead>
            <tbody id="tabel"></tbody>
        </table>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxS2Xad3FCI7YL2xvjJ8v6cXq_oa0l1Drj4RnzqEtbtwiHVuC90xFS-HcoDsnDL438BSQ/exec"; 

        function buatSlot() {
            fetch(GAS_URL, {
                method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'add_slot', pass: document.getElementById('pass').value, order_id: document.getElementById('orderId').value })
            }).then(r=>r.json()).then(d => { alert(d.message); loadData(); });
        }

        function loadData() {
            fetch(`${GAS_URL}?action=get_all&pass=${document.getElementById('pass').value}`)
            .then(r=>r.json()).then(d => {
                let html = '';
                d.data.forEach(x => { html += `<tr><td>${x.order_id}</td><td>${x.status}</td><td>${x.name || '-'}</td></tr>`; });
                document.getElementById('tabel').innerHTML = html;
            });
        }
    </script>
</body>
</html>
