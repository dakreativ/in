<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pilihin - Client Portal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

<style>
:root, [data-theme="dark"] {
  --bg:#0f0e0d; --surface:#1a1916; --surface2:#242220; --line:#2e2c29;
  --text:#f0ece6; --muted:#7a766f;
  --gold:#c9a96e; --gold-dim:#8a6e42; --gold-deep:#6c542d; --on-gold:#0f0e0d;
  --gold-grad:linear-gradient(135deg, var(--gold), var(--gold-deep));
  --r-md:10px; --r-lg:16px; --r-full:99px;
  --ease:160ms cubic-bezier(.4,0,.2,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color:transparent; }
body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; }
button { font: inherit; border: 0; cursor: pointer; color: inherit; background: none; }
img { display: block; }

/* NAVIGASI UTAMA */
.topnav { position: sticky; top: 0; z-index: 100; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 20px; height: 60px; justify-content: space-between; }
.brand { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 700; color: var(--gold); }
.badge-role { background: var(--surface2); border: 1px solid var(--gold-dim); padding: 4px 10px; border-radius: var(--r-full); font-size: 11px; font-weight: 700; color: var(--gold); letter-spacing: 1px; }

/* WADAH KONTEN */
.container { width: 100%; max-width: 800px; margin: 0 auto; padding: 32px 20px 100px; animation: fadeUp 0.3s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* KOMPONEN KARTU & INPUT */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 24px; margin-bottom: 24px; }
.input-label { font-size: 11px; font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 8px; }
.input-field { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px; color: var(--text); font-size: 15px; outline: none; margin-bottom: 12px; font-family: inherit;}
.input-field:focus { border-color: var(--gold); }

/* TOMBOL */
.btn-bubble { display: inline-flex; align-items: center; justify-content: center; width: 100%; padding: 15px 22px; border-radius: var(--r-full); background: var(--gold-grad); color: #fff; font-weight: 700; font-size: 15px; border: 1px solid var(--gold); cursor: pointer; transition: var(--ease); }
.btn-bubble:hover { filter: brightness(1.1); transform: translateY(-1px); }
.btn-bubble:active { transform: scale(.97); }
.btn-ghost { background: var(--surface2); border-color: var(--line); color: var(--text); }
.btn-wa { background: #1a7a45; border-color: #1a7a45; text-decoration: none;}

/* LINK GENERATOR */
.link-box { background: var(--bg); border: 1px dashed var(--gold); padding: 16px; border-radius: var(--r-md); margin-top: 16px; word-break: break-all; font-family: monospace; font-size: 15px; color: var(--gold); display: none; }

/* GRID FOTO (SELEKSI) */
.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; margin-top: 20px; }
.photo-item { position: relative; aspect-ratio: 1; border-radius: var(--r-md); overflow: hidden; background: var(--surface2); cursor: pointer; border: 2px solid transparent; }
.photo-item img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
.photo-name-overlay { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.6); color: #fff; font-size: 10px; padding: 4px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
.photo-item.selected { border-color: var(--gold); }
.photo-item.selected::after { content: ''; position: absolute; inset: 0; background: rgba(201,169,110,.16); border: 3px solid var(--gold); border-radius: 8px; pointer-events: none; }
.photo-check { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 50%; background: var(--gold); display: flex; align-items: center; justify-content: center; opacity: 0; transform: scale(.6); z-index: 3; color: var(--on-gold); font-weight: bold; font-size: 12px; transition: .15s; }
.photo-item.selected .photo-check { opacity: 1; transform: scale(1); }

/* FLOATING BAR & TOAST */
#loader { text-align: center; color: var(--gold); padding: 20px; font-weight: 600; display: none; }
.save-bar { position: fixed; bottom: 0; left: 0; right: 0; background: color-mix(in srgb, var(--surface) 90%, transparent); backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding: 16px 20px; display: none; justify-content: space-between; align-items: center; z-index: 200; box-shadow: 0 -4px 20px rgba(0,0,0,0.5); }
.toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(12px); background: var(--surface2); border: 1px solid var(--gold-dim); border-radius: var(--r-full); padding: 12px 24px; font-size: 14px; font-weight: 600; color: var(--gold); opacity: 0; pointer-events: none; transition: var(--ease); z-index: 999; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

  <!-- NAVIGASI ATAS -->
  <nav class="topnav">
    <div class="brand">Pilihin Studio</div>
    <div class="badge-role" id="roleBadge">ADMIN MODE</div>
  </nav>

  <!-- ============================================== -->
  <!-- PANEL ADMIN (FOTOGRAFER) -->
  <!-- ============================================== -->
  <div class="container" id="panelAdmin" style="display: none;">
    <div style="text-align: center; margin-bottom: 24px;">
      <h2 style="font-family: 'Cormorant Garamond', serif; color: var(--gold); font-size: 28px;">Generate Link Catin</h2>
      <p style="color: var(--muted); font-size: 14px;">Masukkan link folder Drive. Link yang dihasilkan akan jadi link pendek permanen.</p>
    </div>

    <div class="card">
      <label class="input-label">1. Paste Link Google Drive</label>
      <input class="input-field" type="url" id="adminDriveUrl" placeholder="https://drive.google.com/drive/folders/...">
      
      <label class="input-label" style="margin-top:16px;">2. Nomor WA Fotografer (Awali dengan 62)</label>
      <input class="input-field" type="number" id="adminWaNumber" placeholder="6281234567890">

      <button class="btn-bubble" id="btnGenLink" onclick="generateClientLink()">Buat Link Klien Sekarang</button>

      <div class="link-box" id="linkResultBox">
        <label class="input-label">🎉 Link Khusus Catin (Siap Share)</label>
        <div id="generatedLinkText" style="margin-bottom: 16px; user-select: all; text-align: center; font-size: 18px; font-weight:bold;"></div>
        <div style="display: flex; gap: 10px;">
          <button class="btn-bubble btn-ghost" onclick="copyClientLink()">📋 Copy Link</button>
          <button class="btn-bubble" onclick="openClientLink()">Buka Mode Klien →</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============================================== -->
  <!-- PANEL KLIEN (CATIN) -->
  <!-- ============================================== -->
  <div class="container" id="panelKlien" style="display: none; padding-top: 24px;">
    <div style="text-align: center; margin-bottom: 20px;">
      <h2 style="font-family: 'Cormorant Garamond', serif; color: var(--gold); font-size: 24px;">Pilih Foto Favoritmu</h2>
      <p style="color: var(--muted); font-size: 13px;">Tap foto untuk menandai. Jika sudah selesai, klik tombol WhatsApp di bawah.</p>
    </div>

    <div id="loader">⟳ Sedang memuat foto dari Google Drive...</div>
    <div class="photo-grid" id="photoGrid"></div>
    
    <!-- ACTION BAR BAWAH -->
    <div class="save-bar" id="saveBar">
      <div style="font-size: 14px; color: var(--muted);">Terpilih: <strong style="color: var(--gold); font-size: 18px;" id="selCount">0</strong></div>
      <button class="btn-bubble btn-wa" style="width: auto; margin: 0; padding: 10px 24px; font-size: 14px;" onclick="kirimKeFotografer()">Kirim WA ke Fotografer</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // =================================================================
    // ⬇️⬇️⬇️ PASTE URL WEB APP GOOGLE APPS SCRIPT DI BAWAH INI ⬇️⬇️⬇️
    // =================================================================
    const GAS_API_URL = "URL_GAS_KAMU_DISINI"; 

    let photoData = [];
    let selectedPhotos = new Set();
    let generatedUrl = "";
    let activeClientFolderId = ""; 
    let targetWaNumber = "";

    window.onload = () => {
      const urlParams = new URLSearchParams(window.location.search);
      const folderParam = urlParams.get('folder');
      targetWaNumber = urlParams.get('wa') || "";
      
      if(folderParam && folderParam.length > 10) {
        activeClientFolderId = folderParam;
        document.getElementById('panelAdmin').style.display = 'none';
        document.getElementById('panelKlien').style.display = 'block';
        
        const badge = document.getElementById('roleBadge');
        badge.innerText = "CLIENT MODE";
        badge.style.borderColor = "var(--gold)";
        badge.style.color = "var(--gold)";
        
        startLoadImagesKlien(activeClientFolderId);
      } else {
        document.getElementById('panelAdmin').style.display = 'block';
        document.getElementById('panelKlien').style.display = 'none';
      }
    };

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 3000);
    }

    async function generateClientLink() {
      const url = document.getElementById('adminDriveUrl').value;
      const wa = document.getElementById('adminWaNumber').value;
      
      if(!url) { alert("Paste link Google Drive dulu bro!"); return; }
      
      const match = url.match(/[-\w]{25,}/);
      const folderId = match ? match[0] : null;

      if(!folderId) {
        alert("Link Drive tidak valid. Pastikan formatnya benar.");
        return;
      }

      const btn = document.getElementById('btnGenLink');
      btn.innerText = "Mempersiapkan Link..."; 

      const baseUrl = window.location.origin + window.location.pathname;
      let longUrl = baseUrl + "?folder=" + folderId;
      if(wa) {
          longUrl += "&wa=" + wa;
      }

      try {
        const response = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(longUrl)}`);
        if(response.ok) {
          generatedUrl = await response.text(); 
        } else {
          generatedUrl = longUrl; 
        }
      } catch (err) {
        generatedUrl = longUrl; 
      }

      document.getElementById('generatedLinkText').innerText = generatedUrl;
      document.getElementById('linkResultBox').style.display = 'block';
      btn.innerText = "Buat Link Klien Sekarang"; 
      showToast("✅ Link berhasil dibuat!");
    }

    function copyClientLink() {
      navigator.clipboard.writeText(generatedUrl).then(() => {
        showToast("Link disalin! Tinggal kirim ke WA catin.");
      });
    }

    function openClientLink() {
      window.open(generatedUrl, '_blank');
    }

    async function startLoadImagesKlien(folderId) {
      if(GAS_API_URL === "https://script.google.com/macros/s/AKfycbyQ_FrPCNqvfUKbvLE2fcqhpYQC9V01iNzk63A9kEY/dev") {
          alert("PERHATIAN ADMIN: Anda belum memasukkan URL Google Apps Script di dalam kode HTML.");
          return;
      }

      document.getElementById('loader').style.display = 'block';
      document.getElementById('photoGrid').innerHTML = '';
      
      try {
        const response = await fetch(`${GAS_API_URL}?folder=${folderId}`);
        const res = await response.json();

        document.getElementById('loader').style.display = 'none';

        if(res && res.success) {
          photoData = res.data;
          renderGrid();
        } else {
          alert("GAGAL MEMUAT FOTO. Pastikan akses Folder Drive di-set 'Anyone with the link'.");
        }
      } catch(err) {
        document.getElementById('loader').style.display = 'none';
        alert("Error Koneksi: " + err.message);
      }
    }

    function renderGrid() {
      const grid = document.getElementById('photoGrid');
      grid.innerHTML = photoData.map((p) => `
        <div class="photo-item ${selectedPhotos.has(p.id) ? 'selected' : ''}" id="grid-${p.id}" onclick="togglePick('${p.id}')">
          <img src="${p.url}" loading="lazy">
          <div class="photo-name-overlay">${p.name}</div>
          <div class="photo-check">✓</div>
        </div>
      `).join('');
    }

    function togglePick(id) {
      const item = document.getElementById(`grid-${id}`);
      if(selectedPhotos.has(id)) {
        selectedPhotos.delete(id);
        item.classList.remove('selected');
      } else {
        selectedPhotos.add(id);
        item.classList.add('selected');
      }
      updateSelectedUI();
    }

    function updateSelectedUI() {
      const count = selectedPhotos.size;
      document.getElementById('selCount').innerText = count;
      document.getElementById('saveBar').style.display = count > 0 ? 'flex' : 'none';
    }

    function kirimKeFotografer() {
      // Bikin list nomor format WA (1. File, 2. File)
      const selectedNames = photoData
        .filter(p => selectedPhotos.has(p.id))
        .map((p, index) => `${index + 1}. ${p.name}`)
        .join('\n');
        
      const teksMsg = `Halo Kak!\nIni daftar foto yang saya pilih untuk diedit:\n\n${selectedNames}\n\nTerima kasih!`;
      
      let waLink = "";
      if(targetWaNumber) {
        waLink = `https://wa.me/${targetWaNumber}?text=${encodeURIComponent(teksMsg)}`;
      } else {
        waLink = `https://wa.me/?text=${encodeURIComponent(teksMsg)}`;
      }
      
      navigator.clipboard.writeText(teksMsg).then(() => {
        showToast("Daftar foto disalin! Membuka WhatsApp...");
        setTimeout(() => { window.open(waLink, '_blank'); }, 1000);
      }).catch(() => {
        window.open(waLink, '_blank');
      });
    }
  </script>
</body>
</html>
