<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyO_pvfm2Dtx30ZTq8gRCdT2l3Cg4g6WsKTZWBA-a8iUcu-In85PzyMAajl3wNcA56wCQ/exec";

    document.getElementById('addForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const originalText = btn.innerHTML;
        
        btn.innerHTML = '<i class="ph ph-spinner ph-spin"></i> Menyimpan...';
        btn.style.opacity = '0.7';
        btn.disabled = true;

        // Ubah jadi URLSearchParams agar lolos dari blokir CORS Google
        const params = new URLSearchParams();
        params.append('title', document.getElementById('title').value);
        params.append('ytLink', document.getElementById('ytLink').value);
        params.append('prompt', document.getElementById('prompt').value);

        try {
            await fetch(GAS_URL, {
                method: 'POST',
                mode: 'no-cors', // Pakai no-cors agar browser tidak memblokir redirect
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: params.toString()
            });

            alert('Mantap Bro! Data sukses masuk ke Google Sheets.');
            document.getElementById('addForm').reset();
        } catch (error) {
            alert('Gagal nyimpen data. Detail: ' + error.message);
        } finally {
            btn.innerHTML = originalText;
            btn.style.opacity = '1';
            btn.disabled = false;
        }
    });
</script>
