<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Dokumentasi</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* === SISTEM TEMA DINAMIS === */
        :root {
            /* Default Theme (Abu-abu terang) */
            --bg-color: #F4F7F6;
            --text-color: #1E293B;
            --text-sub: #64748B;
            --card-bg: #FFFFFF;
            --accent: #3B82F6;
            --border: #E2E8F0;
        }

        /* Maroon Red */
        [data-theme="maroon"] {
            --bg-color: #FFFBFB;
            --text-color: #4A0404;
            --text-sub: #9CA3AF;
            --card-bg: #FFFFFF;
            --accent: #991B1B;
            --border: #FEE2E2;
        }

        /* Navy Blue */
        [data-theme="navy"] {
            --bg-color: #F0F4F8;
            --text-color: #0F172A;
            --text-sub: #64748B;
            --card-bg: #FFFFFF;
            --accent: #1E3A8A;
            --border: #E2E8F0;
        }

        /* Hijau Tua (Elegan) */
        [data-theme="hijautua"] {
            --bg-color: #0F172A;
            --text-color: #FFFFFF;
            --text-sub: #94A3B8;
            --card-bg: #1E293B;
            --accent: #10B981;
            --border: #334155;
        }

        /* Cream Premium */
        [data-theme="cream"] {
            --bg-color: #FAF9F6;
            --text-color: #43302B;
            --text-sub: #A89F91;
            --card-bg: #FFFFFF;
            --accent: #C2A878;
            --border: #EAE6DF;
        }

        /* === STYLING DASAR === */
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; transition: background 0.3s, color 0.3s; }
        .hidden { display: none !important; }
        
        .card { background: var(--card-bg); width: 100%; max-width: 450px; padding: 35px 25px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.06); text-align: center; box-sizing: border-box; margin-top: 5vh; border: 1px solid var(--border); transition: background 0.3s; }
        
        .loading-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60vh; }
        .spinner { width: 50px; height: 50px; border: 4px solid var(--border); border-top: 4px solid var(--accent); border-radius: 50%; animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .loading-text { font-size: 16px; font-weight: 800; color: var(--text-color); transition: opacity 0.3s ease; }
        .progress-bar { width: 200px; height: 6px; background: var(--border); border-radius: 10px; margin-top: 15px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: var(--accent); transition: width 0.5s ease; border-radius: 10px; }
        
        h2 { font-weight: 800; margin: 0 0 8px; font-size: 24px; letter-spacing: -0.5px; color: var(--text-color); }
        p { color: var(--text-sub); font-size: 14px; margin-bottom: 25px; line-height: 1.6; }
        label { text-align: left; display: block; font-size: 13px; font-weight: 800; color: var(--text-color); margin: 15px 0 8px; }
        
        input, select { width: 100%; padding: 16px; background: var(--bg-color); border: 2px solid var(--border); color: var(--text-color); border-radius: 14px; box-sizing: border-box; outline: none; transition: 0.3s; font-family: inherit; font-size: 14px; font-weight: 600; }
        input:focus, select:focus { border-color: var(--accent); }
        
        button { background: var(--accent); color: #fff; border: none; padding: 16px; border-radius: 14px; font-weight: 800; font-size: 15px; cursor: pointer; width: 100%; transition: 0.3s; margin-top: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        button:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.2); }
        button:disabled { background: var(--text-sub); cursor: not-allowed; box-shadow: none; transform: none; }

        .gallery-wrap { max-width: 1000px; width: 100%; margin: 0 auto; text-align: center; }
        .gallery-header { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
        .gallery-header h2 { font-size: 32px; color: var(--text-color); }
        .gallery-header p { color: var(--text-sub); }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; margin-top: 10px; }
        .grid img { width: 100%; border-radius: 16px; aspect-ratio: 4/5; object-fit: cover; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: 0.3s; cursor: pointer; border: 1px solid var(--border); }
        .grid img:hover { transform: scale(1.03); box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        
        /* Tema Gelap Khusus untuk select option text biar terbaca */
        [data-theme="hijautua"] select { color: #fff; }
        [data-theme="hijautua"] select option { background: #1E293B; color: #fff; }
    </style>
</head>
<body id="appBody" data-theme="default">

    <!-- 1. LOADING SCREEN -->
    <div class="loading-container" id="loadingBox">
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">Memindai Barcode...</div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <!-- 2. FORM SETUP KLIEN -->
    <div class="card hidden" id="setupBox">
        <h2>Setup Galeri ✨</h2>
        <p>Aktivasi barcode Anda dengan mengisi data di bawah.</p>
        
        <label>Nama Bisnis / Acara</label>
        <input type="text" id="setupNama" placeholder="Ketik nama di sini...">
        
        <label>Link Folder Google Drive</label>
        <input type="text" id="setupDrive" placeholder="Hak akses 'Siapa Saja (Public)'">
        
        <label>Tema Background</label>
        <select id="setupTema" onchange="previewTheme(this.value)">
            <option value="default">Putih Terang (Default)</option>
            <option value="maroon">Merah Maroon (Elegan)</option>
            <option value="navy">Biru Navy (Formal)</option>
            <option value="hijautua">Hijau Tua (Dark Mode)</option>
            <option value="cream">Cream (Aesthetic)</option>
        </select>

        <button onclick="submitSetup()" id="btnSetup">Aktifkan & Kunci Barcode</button>
    </div>

    <!-- 3. TAMPILAN GALERI -->
    <div class="gallery-wrap hidden" id="galleryBox">
        <div class="gallery-header">
            <h2 id="gTitle">Nama Galeri</h2>
            <p style="margin-bottom:0;">Terima Kasih</p>
        </div>
        <div id="gridFoto" class="grid"></div>
    </div>

    <script>
        // ==============================================
        // GANTI INI DENGAN URL DEPLOYMENT GAS ANDA
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxS2Xad3FCI7YL2xvjJ8v6cXq_oa0l1Drj4RnzqEtbtwiHVuC90xFS-HcoDsnDL438BSQ/exec"; 
        // ==============================================
        
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('id');
        let dbDrive = "";

        // Fungsi Preview Tema Saat Setup
        function previewTheme(themeName) {
            document.getElementById('appBody').setAttribute('data-theme', themeName);
        }

        const loadingMessages = ["Menghubungkan ke server...", "Memeriksa database...", "Memindai folder foto...", "Mempersiapkan galeri..."];
        let msgIndex = 0, progress = 5;

        const loadingInterval = setInterval(() => {
            msgIndex = (msgIndex + 1) % loadingMessages.length;
            const textEl = document.getElementById('loadingText');
            textEl.style.opacity = 0;
            setTimeout(() => { textEl.innerText = loadingMessages[msgIndex]; textEl.style.opacity = 1; }, 300);
        }, 1500);

        const progressInterval = setInterval(() => {
            if(progress < 90) progress += Math.random() * 10;
            document.getElementById('progressFill').style.width = progress + "%";
        }, 500);

        if(orderId) {
            fetch(`${GAS_URL}?action=scan&id=${orderId}`)
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    dbDrive = data.drive;
                    document.getElementById('gTitle').innerText = data.nama || "Galeri Foto";
                    
                    // Terapkan Tema yang didapat dari Database
                    if(data.tema) previewTheme(data.tema);

                    if (data.state === 'Kosong') {
                        hentikanLoading();
                        document.getElementById('setupBox').classList.remove('hidden');
                    } else if (data.state === 'Aktif') {
                        bukaGaleri(); 
                    }
                } else { tampilkanError(data.message); }
            }).catch(err => tampilkanError("Gagal terhubung ke server."));
        } else {
            tampilkanError("Silakan Scan Barcode yang Valid.");
        }

        function hentikanLoading() {
            clearInterval(loadingInterval); clearInterval(progressInterval);
            document.getElementById('progressFill').style.width = "100%";
            setTimeout(() => { document.getElementById('loadingBox').classList.add('hidden'); }, 500);
        }

        function tampilkanError(pesan) {
            clearInterval(loadingInterval); clearInterval(progressInterval);
            document.querySelector('.spinner').style.display = 'none';
            document.querySelector('.progress-bar').style.display = 'none';
            document.getElementById('loadingText').innerHTML = `<span style="color:#EF4444; font-size:20px;">⚠️<br><br>${pesan}</span>`;
        }

        function submitSetup() {
            const nama = document.getElementById('setupNama').value;
            const drive = document.getElementById('setupDrive').value;
            const tema = document.getElementById('setupTema').value;
            const btn = document.getElementById('btnSetup');

            if(!nama || !drive) return alert("Semua kolom wajib diisi!");
            btn.disabled = true; btn.innerText = "Menyimpan Data...";

            const formData = new URLSearchParams();
            formData.append('action', 'first_setup');
            formData.append('id', orderId);
            formData.append('nama', nama);
            formData.append('drive', drive);
            formData.append('tema', tema); // Kirim data tema ke backend

            fetch(GAS_URL, { 
                method: 'POST', 
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: formData 
            })
            .then(r => r.json())
            .then(d => {
                if(d.status === 'success') { window.location.reload(); } 
                else { alert(d.message); btn.disabled = false; btn.innerText = "Aktifkan & Kunci Barcode"; }
            }).catch(err => {
                alert("Terjadi kesalahan jaringan.");
                btn.disabled = false; btn.innerText = "Aktifkan & Kunci Barcode"; 
            });
        }

        function bukaGaleri() {
            document.getElementById('loadingText').innerText = "Mengunduh galeri dari Drive...";
            
            fetch(`${GAS_URL}?action=get_images&url=${encodeURIComponent(dbDrive)}`)
            .then(r => r.json())
            .then(d => {
                hentikanLoading();
                document.getElementById('galleryBox').classList.remove('hidden');
                
                let html = '';
                if (d.status === 'success') {
                    if(d.images && d.images.length > 0) {
                        d.images.forEach(img => {
                            let fileType = (img.type || "").toLowerCase();
                            
                            if (fileType.includes('video') || fileType.includes('mp4') || fileType.includes('mov')) {
                                let thumbUrl = `https://drive.google.com/thumbnail?id=${img.id}&sz=w800`;
                                let playUrl = `https://drive.google.com/file/d/${img.id}/view`;
                                
                                html += `
                                <div style="position: relative; cursor: pointer; width: 100%; border-radius: 16px; aspect-ratio: 4/5; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: 0.3s; border: 1px solid var(--border);" onmouseover="this.style.transform='scale(1.03)'" onmouseout="this.style.transform='scale(1)'" onclick="window.open('${playUrl}', '_blank')">
                                    <img src="${thumbUrl}" loading="lazy" alt="Video" referrerpolicy="no-referrer" style="width: 100%; height: 100%; object-fit: cover; filter: brightness(0.7); display: block; border-radius: 0; border: none; box-shadow: none;">
                                    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(255,255,255,0.2); border-radius: 50%; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); border: 2px solid white;">
                                        <div style="width: 0; height: 0; border-top: 10px solid transparent; border-bottom: 10px solid transparent; border-left: 16px solid white; margin-left: 5px;"></div>
                                    </div>
                                </div>`;
                            } else {
                                html += `<img src="${img.url}" loading="lazy" alt="Gallery Image" referrerpolicy="no-referrer">`;
                            }
                        });
                    } else { html = "<p style='grid-column:1/-1; color: var(--text-color);'>Folder kosong / tidak ada file dokumentasi.</p>"; }
                } else { html = `<p style='grid-column:1/-1; color:#EF4444;'>Gagal memuat galeri.<br>${d.message}</p>`; }
                document.getElementById('gridFoto').innerHTML = html;
            }).catch(err => {
                hentikanLoading(); document.getElementById('galleryBox').classList.remove('hidden');
                document.getElementById('gridFoto').innerHTML = "<p style='grid-column:1/-1; color:#EF4444;'>Jaringan bermasalah.</p>";
            });
        }
    </script>
</body>
</html>
