<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - PT Dakreativ Digital Media</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Library untuk Generate QR secara Lokal & Bikin ZIP -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 antialiased min-h-screen">
    
    <nav class="border-b px-8 py-5 flex justify-between items-center bg-white shadow-sm">
        <div class="text-lg font-bold">ADMIN<span class="font-light">PANEL</span></div>
        <div class="text-xs bg-black text-white px-3 py-1 rounded-full">PT Dakreativ</div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-10">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold">Data Order & Batch QR</h1>
            <button onclick="openAddModal()" class="bg-black text-white px-5 py-2.5 rounded-xl text-xs font-semibold hover:bg-neutral-800 shadow-md">
                + Buat Batch & Download ZIP
            </button>
        </div>

        <div class="bg-white border rounded-xl overflow-hidden shadow-sm">
            <table class="w-full text-left text-xs whitespace-nowrap">
                <thead class="bg-neutral-100 font-semibold uppercase text-neutral-600">
                    <tr>
                        <th class="px-6 py-4">ID Produk</th>
                        <th class="px-6 py-4">Klien</th>
                        <th class="px-6 py-4">Status</th>
                        <th class="px-6 py-4">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="divide-y divide-neutral-100 font-medium"></tbody>
            </table>
        </div>
    </main>

    <!-- MODAL Generate -->
    <div id="addModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl">
            <h3 class="font-bold text-lg mb-4">Buat Batch Baru</h3>
            <form id="formTambah" class="space-y-4">
                <input type="text" id="newKlien" required class="w-full border rounded-lg px-4 py-2 text-sm" placeholder="Nama Klien">
                <input type="text" id="newWaKlien" class="w-full border rounded-lg px-4 py-2 text-sm" placeholder="WA Klien (Opsional)">
                <input type="number" id="newJumlah" value="20" required class="w-full border rounded-lg px-4 py-2 text-sm" placeholder="Jumlah QR (Misal: 20)">
                
                <button type="submit" id="btnSubmitTambah" class="w-full bg-black text-white py-3 rounded-lg font-semibold text-xs mt-2">
                    Generate & Download ZIP
                </button>
                <button type="button" onclick="closeAddModal()" class="w-full text-neutral-500 text-xs py-2">Batal</button>
            </form>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxxKQCp8huU_pEJ2uOF3aYE30oYHo_3FYNXJ1pX2AEiHfiVO8LPZip8Z3e9uE8OPJquew/exec"; 
        const TARGET_CARD_URL = "https://dakreativ.github.io/in/card/index.html"; 

        document.addEventListener("DOMContentLoaded", loadAdminData);

        function loadAdminData() {
            fetch(`${SCRIPT_URL}?action=getOrders`).then(res => res.json()).then(data => {
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';
                data.forEach(item => {
                    const st = item.status === "Terisi" ? "<span class='text-green-600'>Aktif</span>" : "<span class='text-gray-400'>Kosong</span>";
                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-50">
                            <td class="px-6 py-4 font-mono font-bold">${item.idProduk}</td>
                            <td class="px-6 py-4">${item.klienPembeli}</td>
                            <td class="px-6 py-4">${st}</td>
                            <td class="px-6 py-4"><a href="${TARGET_CARD_URL}?id=${item.idProduk}" target="_blank" class="text-blue-500 underline text-[10px]">Cek Link</a></td>
                        </tr>`;
                });
            });
        }

        function openAddModal() { document.getElementById('addModal').classList.remove('hidden'); }
        function closeAddModal() { document.getElementById('addModal').classList.add('hidden'); }

        // Fungsi Bikin Canvas Gambar QR + Teks Kodenya
        async function createQRCanvasBase64(url, idText) {
            const canvas = document.createElement('canvas');
            canvas.width = 350; canvas.height = 400; // Ruang ekstra di bawah untuk teks
            const ctx = canvas.getContext('2d');
            
            // Background Putih
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Bikin QR Code
            const qrCanvas = await QRCode.toCanvas(document.createElement('canvas'), url, { width: 300, margin: 1 });
            ctx.drawImage(qrCanvas, 25, 20); // Posisi QR Code

            // Tulis Teks ID di bawah QR
            ctx.fillStyle = "#000000";
            ctx.font = "bold 24px Inter, Arial";
            ctx.textAlign = "center";
            ctx.fillText(idText, canvas.width / 2, 360);

            // Return string base64 untuk masuk ZIP
            return canvas.toDataURL("image/png").split(',')[1]; 
        }

        document.getElementById('formTambah').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmitTambah');
            btn.innerText = 'Memproses ke Database...';
            btn.disabled = true;

            const payload = {
                action: 'addBatchOrder',
                klienPembeli: document.getElementById('newKlien').value,
                waKlien: document.getElementById('newWaKlien').value,
                jumlah: document.getElementById('newJumlah').value
            };

            fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) })
            .then(res => res.json())
            .then(async res => {
                if(res.success) {
                    btn.innerText = 'Membungkus File ZIP...';
                    const zip = new JSZip();
                    const folder = zip.folder(`QR_${payload.klienPembeli.replace(/\s+/g, '_')}`);

                    // Loop semua ID yang baru ke-generate
                    for (let i = 0; i < res.generatedIds.length; i++) {
                        const id = res.generatedIds[i];
                        const fullUrl = `${TARGET_CARD_URL}?id=${id}`;
                        
                        // Bikin Gambar QR+Teks
                        const base64Img = await createQRCanvasBase64(fullUrl, id);
                        // Masukin ke ZIP
                        folder.file(`${id}.png`, base64Img, {base64: true});
                    }

                    // Download ZIP
                    zip.generateAsync({type:"blob"}).then(function(content) {
                        saveAs(content, `Batch-QR-${payload.klienPembeli}.zip`);
                        closeAddModal();
                        loadAdminData();
                        btn.innerText = 'Generate & Download ZIP';
                        btn.disabled = false;
                    });
                } else {
                    alert('Gagal: ' + res.message);
                }
            });
        });
    </script>
</body>
</html>
