<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>dkrtv. Quran - Membaca Al-Quran</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'], arabic: ['Amiri', 'serif'] },
                    colors: {
                        gold: { 400: '#E5C158', 500: '#D4AF37', 600: '#AA8C2C' },
                        theme: {
                            main: 'var(--bg-main)',
                            card: 'var(--bg-card)',
                            text: 'var(--text-main)',
                            muted: 'var(--text-muted)',
                            border: 'var(--border-color)',
                            accent: 'var(--bg-accent)'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        /* CSS Variables untuk Tema */
        :root { /* Light */
            --bg-main: #F9FAFB; --bg-card: #FFFFFF; --text-main: #1F2937; --text-muted: #9CA3AF; --border-color: #F3F4F6; --bg-accent: #F3F4F6;
        }
        body.theme-dark {
            --bg-main: #121212; --bg-card: #1E1E1E; --text-main: #F3F4F6; --text-muted: #6B7280; --border-color: #2D3748; --bg-accent: #2D3748;
        }
        body.theme-cream {
            --bg-main: #FAF7F2; --bg-card: #FFFFFF; --text-main: #4A4036; --text-muted: #A8A29E; --border-color: #E7E5DF; --bg-accent: #F5F0E6;
        }
        body.theme-navy {
            --bg-main: #0F172A; --bg-card: #1E293B; --text-main: #F8FAFC; --text-muted: #94A3B8; --border-color: #334155; --bg-accent: #334155;
        }
        body.theme-green {
            --bg-main: #064E3B; --bg-card: #065F46; --text-main: #ECFDF5; --text-muted: #6EE7B7; --border-color: #047857; --bg-accent: #047857;
        }

        body { background-color: #111; display: flex; justify-content: center; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { display: none; }
        
        /* Container App untuk UI HP & Web */
        #app-container {
            width: 100%; max-width: 480px; height: 100vh;
            background-color: var(--bg-main); color: var(--text-main);
            position: relative; overflow: hidden; box-shadow: 0 0 40px rgba(0,0,0,0.1);
        }

        .screen-hidden { transform: translateX(100%); opacity: 0; pointer-events: none; position: absolute; inset: 0; transition: 0.3s ease-in-out; }
        .screen-active { transform: translateX(0); opacity: 1; position: absolute; inset: 0; overflow-y: auto; transition: 0.3s ease-in-out; }
        
        @keyframes shimmer { 0% { background-position: -1000px 0; } 100% { background-position: 1000px 0; } }
        .skeleton { background: linear-gradient(90deg, var(--bg-accent) 25%, var(--border-color) 50%, var(--bg-accent) 75%); background-size: 1000px 100%; animation: shimmer 2s infinite linear; }
        
        .playing-audio { color: #D4AF37; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .mushaf-playing { color: #D4AF37; transition: color 0.3s; }
    </style>
</head>
<body class="theme-light antialiased transition-colors duration-300">

    <div id="app-container">
        
        <!-- ================= LAYAR 1: BERANDA ================= -->
        <div id="home-screen" class="screen-active flex flex-col bg-theme-main">
            
            <!-- Header & Search -->
            <header class="pt-6 pb-4 px-5 sticky top-0 bg-theme-main/95 backdrop-blur-md z-10 border-b border-theme-border">
                
                <!-- Pesan Custom Nama (Muncul kalau ada URL parameter ?by= atau ?for=) -->
                <div id="custom-greeting" class="hidden mb-3 text-[11px] bg-theme-card border border-theme-border rounded-full px-3 py-1.5 inline-flex items-center text-theme-text shadow-sm">
                    <!-- Text injected by JS -->
                </div>

                <div class="flex justify-between items-center mb-4">
                    <h1 class="text-2xl font-extrabold tracking-tighter">
                        dkrtv<span class="text-gold-500">.</span> Quran
                    </h1>
                    
                    <!-- Theme Switcher -->
                    <div class="flex space-x-1.5 bg-theme-card p-1.5 rounded-full border border-theme-border">
                        <button onclick="changeTheme('light')" class="w-5 h-5 rounded-full bg-[#FAFAFA] border border-gray-200 shadow-sm"></button>
                        <button onclick="changeTheme('cream')" class="w-5 h-5 rounded-full bg-[#FAF7F2] border border-gray-300 shadow-sm"></button>
                        <button onclick="changeTheme('green')" class="w-5 h-5 rounded-full bg-[#064E3B] shadow-sm"></button>
                        <button onclick="changeTheme('navy')" class="w-5 h-5 rounded-full bg-[#0F172A] shadow-sm"></button>
                        <button onclick="changeTheme('dark')" class="w-5 h-5 rounded-full bg-[#121212] shadow-sm border border-gray-700"></button>
                    </div>
                </div>
                
                <div class="relative w-full">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 transform -translate-y-1/2 text-theme-muted text-sm"></i>
                    <input type="text" id="search-input" placeholder="Cari surat..." class="w-full bg-theme-card border border-theme-border text-sm rounded-2xl py-3 pl-10 pr-4 outline-none focus:border-gold-500 text-theme-text transition shadow-sm placeholder-theme-muted">
                </div>
            </header>

            <!-- Main Content -->
            <main class="px-5 flex-1">
                <!-- Card Terakhir Dibaca -->
                <div id="last-read-card" class="bg-gradient-to-tr from-gold-500 to-gold-400 rounded-2xl p-5 text-white mt-5 mb-5 hidden relative overflow-hidden cursor-pointer active:scale-95 transition-transform shadow-lg shadow-gold-500/20">
                    <div class="absolute -right-4 -top-4 opacity-20"><i class="fa-solid fa-book-quran text-9xl"></i></div>
                    <div class="relative z-10">
                        <div class="flex items-center space-x-2 mb-2">
                            <i class="fa-solid fa-book-open text-xs"></i>
                            <span class="text-[10px] font-medium uppercase tracking-wider">Terakhir Dibaca</span>
                        </div>
                        <h2 id="lr-surah" class="text-xl font-bold mb-0.5">Al-Baqarah</h2>
                        <p id="lr-ayah" class="text-xs opacity-90">Ayat 1</p>
                    </div>
                </div>

                <!-- Custom Tabs -->
                <div class="flex mb-4 mt-3 bg-theme-card p-1 rounded-full border border-theme-border shadow-sm">
                    <button onclick="switchTab('surat')" id="tab-surat" class="flex-1 py-2 font-semibold bg-theme-accent text-theme-text rounded-full text-xs transition">Daftar Surat</button>
                    <button onclick="switchTab('bookmark')" id="tab-bookmark" class="flex-1 py-2 font-medium text-theme-muted hover:text-theme-text rounded-full text-xs transition">Tersimpan</button>
                </div>

                <div id="content-surat" class="space-y-3 pb-8 block">
                    <div id="surah-list" class="space-y-3">
                        <div class="flex items-center p-4 bg-theme-card rounded-2xl border border-theme-border"><div class="w-10 h-10 rounded-full skeleton"></div><div class="ml-4 space-y-2 flex-1"><div class="h-4 w-24 rounded skeleton"></div><div class="h-3 w-16 rounded skeleton"></div></div></div>
                    </div>
                </div>

                <div id="content-bookmark" class="pb-8 hidden space-y-3">
                    <div id="bookmark-list" class="text-center pt-10"></div>
                </div>
            </main>
        </div>

        <!-- ================= LAYAR 2: BACA AYAT ================= -->
        <div id="surah-screen" class="screen-hidden flex flex-col bg-theme-main">
            <!-- Header Surat -->
            <header class="pt-6 pb-4 px-4 sticky top-0 bg-theme-main/95 backdrop-blur-md z-20 flex items-center justify-between border-b border-theme-border">
                <div class="flex items-center">
                    <button onclick="closeSurah()" class="text-theme-muted hover:text-theme-text transition w-10 h-10 flex items-center justify-center bg-theme-card rounded-full border border-theme-border shadow-sm">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <div class="ml-3">
                        <h2 id="detail-surah-name" class="font-bold text-base text-theme-text leading-tight">Memuat...</h2>
                        <p id="detail-surah-info" class="text-[10px] text-theme-muted uppercase tracking-widest">...</p>
                    </div>
                </div>
                
                <!-- Toggle Mode -->
                <button onclick="toggleViewMode()" class="bg-theme-accent text-theme-text px-3 py-1.5 rounded-full text-[10px] font-bold tracking-wider uppercase flex items-center shadow-sm border border-theme-border active:scale-95 transition">
                    <i id="mode-icon" class="fa-solid fa-list mr-1.5"></i> 
                    <span id="mode-text">Terjemah</span>
                </button>
            </header>

            <main class="px-4 pb-24 relative">
                <div id="bismillah-container" class="my-8 text-center hidden">
                    <h1 class="font-arabic text-3xl text-theme-text">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</h1>
                </div>
                <div id="ayah-list"></div>
            </main>
        </div>

        <!-- Global Audio -->
        <audio id="global-audio-player"></audio>
    </div>

    <!-- LOGIKA JAVASCRIPT -->
    <script>
        const API_URL = 'https://equran.id/api/v2/surat';
        let allSurahs = []; 
        let currentSurahData = null;
        let bookmarks = JSON.parse(localStorage.getItem('dkrtv_bookmarks')) || [];
        let viewMode = localStorage.getItem('dkrtv_viewmode') || 'terjemah'; 
        const audioPlayer = document.getElementById('global-audio-player');
        let currentPlayingBtn = null; 

        document.addEventListener("DOMContentLoaded", () => {
            initTheme();
            checkCustomGreeting();
            loadSurahs();
            checkLastRead();
            updateModeButtonUI();
        });

        // --- THEME & GREETING LOGIC ---
        function changeTheme(theme) {
            document.body.className = `theme-${theme} antialiased transition-colors duration-300`;
            localStorage.setItem('dkrtv_theme', theme);
        }
        function initTheme() {
            const savedTheme = localStorage.getItem('dkrtv_theme') || 'light';
            changeTheme(savedTheme);
        }

        function checkCustomGreeting() {
            const urlParams = new URLSearchParams(window.location.search);
            // Mendukung parameter ?by=Nama atau ?for=Nama atau ?untuk=Nama
            const customName = urlParams.get('by') || urlParams.get('for') || urlParams.get('untuk');
            if (customName) {
                const greetingEl = document.getElementById('custom-greeting');
                greetingEl.innerHTML = `<i class="fa-solid fa-book-open-reader text-gold-500 mr-2"></i> Dipersembahkan untuk: <span class="font-bold ml-1">${customName}</span>`;
                greetingEl.classList.remove('hidden');
            }
        }

        // --- SEARCH & TABS ---
        document.getElementById('search-input').addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            const filtered = allSurahs.filter(s => s.namaLatin.toLowerCase().includes(keyword) || s.arti.toLowerCase().includes(keyword));
            renderSurahList(filtered);
        });

        function switchTab(tabName) {
            const tabs = ['surat', 'bookmark'];
            tabs.forEach(t => {
                document.getElementById(`tab-${t}`).className = "flex-1 py-2 font-medium text-theme-muted hover:text-theme-text rounded-full text-xs transition";
                document.getElementById(`content-${t}`).classList.add('hidden');
                document.getElementById(`content-${t}`).classList.remove('block');
            });
            document.getElementById(`tab-${tabName}`).className = "flex-1 py-2 font-semibold bg-theme-accent text-theme-text rounded-full text-xs transition shadow-sm";
            document.getElementById(`content-${tabName}`).classList.remove('hidden');
            document.getElementById(`content-${tabName}`).classList.add('block');
            if(tabName === 'bookmark') renderBookmarks();
        }

        // --- FETCH API KEMENAG ---
        async function loadSurahs() {
            try {
                const response = await fetch(API_URL);
                const result = await response.json();
                allSurahs = result.data;
                renderSurahList(allSurahs);
            } catch (error) {
                document.getElementById('surah-list').innerHTML = `<p class="text-center text-red-400 text-sm py-10">Gagal memuat koneksi.</p>`;
            }
        }

        function renderSurahList(surahs) {
            const container = document.getElementById('surah-list');
            container.innerHTML = '';
            if(surahs.length === 0) { container.innerHTML = `<p class="text-center text-theme-muted text-sm py-10">Surat tidak ditemukan.</p>`; return; }

            surahs.forEach(surah => {
                const item = document.createElement('div');
                item.className = 'flex items-center justify-between p-4 bg-theme-card rounded-2xl shadow-sm border border-theme-border hover:border-gold-300 cursor-pointer active:scale-[0.98] transition-all';
                item.onclick = () => openSurah(surah.nomor);
                item.innerHTML = `
                    <div class="flex items-center space-x-4">
                        <div class="relative flex items-center justify-center w-10 h-10 bg-theme-accent rounded-full text-theme-text">
                            <span class="text-xs font-bold">${surah.nomor}</span>
                        </div>
                        <div>
                            <h3 class="font-bold text-theme-text">${surah.namaLatin}</h3>
                            <p class="text-[10px] text-theme-muted font-medium uppercase tracking-wider">${surah.tempatTurun} • ${surah.jumlahAyat} AYAT</p>
                        </div>
                    </div>
                    <h4 class="font-arabic text-xl text-gold-500 font-bold">${surah.nama}</h4>
                `;
                container.appendChild(item);
            });
        }

        function toArabicNum(num) {
            const arabDigits = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
            return num.toString().split('').map(n => arabDigits[n]).join('');
        }

        async function openSurah(nomorSurat) {
            audioPlayer.pause();
            document.getElementById('home-screen').classList.replace('screen-active', 'screen-hidden');
            document.getElementById('surah-screen').classList.replace('screen-hidden', 'screen-active');
            document.getElementById('surah-screen').scrollTop = 0;

            const container = document.getElementById('ayah-list');
            container.innerHTML = `<div class="p-6 bg-theme-card rounded-2xl"><div class="h-6 w-3/4 bg-theme-accent rounded skeleton mb-4 ml-auto"></div><div class="h-4 w-full bg-theme-accent rounded skeleton"></div></div>`;
            document.getElementById('detail-surah-name').innerText = "Memuat...";

            try {
                const response = await fetch(`${API_URL}/${nomorSurat}`);
                const result = await response.json();
                currentSurahData = result.data; 

                document.getElementById('detail-surah-name').innerText = currentSurahData.namaLatin;
                document.getElementById('detail-surah-info').innerText = `${currentSurahData.arti} • ${currentSurahData.jumlahAyat} Ayat`;

                if (nomorSurat !== 1 && nomorSurat !== 9) document.getElementById('bismillah-container').classList.remove('hidden');
                else document.getElementById('bismillah-container').classList.add('hidden');

                renderAyahs();
            } catch (error) {
                container.innerHTML = `<p class="text-center text-red-400 py-10">Gagal memuat ayat.</p>`;
            }
        }

        function toggleViewMode() {
            viewMode = viewMode === 'terjemah' ? 'mushaf' : 'terjemah';
            localStorage.setItem('dkrtv_viewmode', viewMode);
            updateModeButtonUI();
            audioPlayer.pause(); 
            if (currentSurahData) renderAyahs();
        }

        function updateModeButtonUI() {
            const modeIcon = document.getElementById('mode-icon');
            const modeText = document.getElementById('mode-text');
            if (viewMode === 'mushaf') {
                modeIcon.className = 'fa-solid fa-book-quran mr-1.5'; modeText.innerText = 'Mushaf';
            } else {
                modeIcon.className = 'fa-solid fa-list mr-1.5'; modeText.innerText = 'Terjemah';
            }
        }

        function renderAyahs() {
            const container = document.getElementById('ayah-list');
            container.innerHTML = '';
            
            if (viewMode === 'terjemah') {
                container.className = "space-y-4";
                currentSurahData.ayat.forEach(ayat => {
                    const ayatEl = document.createElement('div');
                    ayatEl.className = 'bg-theme-card p-5 rounded-2xl shadow-sm border border-theme-border';
                    const audioUrl = ayat.audio['05'];

                    ayatEl.innerHTML = `
                        <div class="flex justify-between items-center mb-5 bg-theme-accent p-2 rounded-xl">
                            <div class="w-7 h-7 flex items-center justify-center bg-theme-card text-theme-text font-bold text-xs rounded-full shadow-sm">
                                ${ayat.nomorAyat}
                            </div>
                            <div class="flex space-x-1 text-theme-muted">
                                <button onclick="toggleAudio(this, '${audioUrl}')" class="w-8 h-8 rounded-full hover:text-gold-500 transition-colors flex items-center justify-center">
                                    <i class="fa-solid fa-play"></i>
                                </button>
                                <button onclick="saveBookmark(${currentSurahData.nomor}, ${ayat.nomorAyat}, '${currentSurahData.namaLatin}')" class="w-8 h-8 rounded-full hover:text-gold-500 transition-colors flex items-center justify-center">
                                    <i class="fa-regular fa-bookmark"></i>
                                </button>
                            </div>
                        </div>
                        <div class="text-right mb-5">
                            <p class="font-arabic text-3xl leading-loose text-theme-text">${ayat.teksArab}</p>
                        </div>
                        <div class="text-left space-y-2 border-t border-theme-border pt-4">
                            <p class="text-xs font-semibold text-gold-500 tracking-wide leading-relaxed">${ayat.teksLatin}</p>
                            <p class="text-sm text-theme-muted leading-relaxed">${ayat.teksIndonesia}</p>
                        </div>
                    `;
                    container.appendChild(ayatEl);
                });
            } else {
                container.className = "bg-theme-card p-6 rounded-2xl shadow-sm border border-theme-border text-right leading-loose";
                container.setAttribute('dir', 'rtl'); 
                
                let mushafHTML = '';
                currentSurahData.ayat.forEach(ayat => {
                    const audioUrl = ayat.audio['05'];
                    const arabicNumber = toArabicNum(ayat.nomorAyat);
                    mushafHTML += `
                        <span onclick="toggleAudioMushaf(this, '${audioUrl}')" class="inline font-arabic text-3xl leading-[2.5] text-theme-text cursor-pointer hover:text-gold-500 transition-colors">
                            ${ayat.teksArab} <span class="text-gold-500 text-2xl mx-1 font-sans">﴿${arabicNumber}﴾</span>
                        </span>
                    `;
                });
                container.innerHTML = mushafHTML;
            }
        }

        // --- AUDIO LOGIC ---
        function toggleAudio(btn, url) {
            if (audioPlayer.src === url && !audioPlayer.paused) {
                audioPlayer.pause(); btn.innerHTML = '<i class="fa-solid fa-play"></i>'; btn.classList.remove('playing-audio'); return;
            }
            if (currentPlayingBtn && currentPlayingBtn.tagName === 'BUTTON') {
                currentPlayingBtn.innerHTML = '<i class="fa-solid fa-play"></i>'; currentPlayingBtn.classList.remove('playing-audio');
            } else if (currentPlayingBtn && currentPlayingBtn.tagName === 'SPAN') {
                currentPlayingBtn.classList.remove('mushaf-playing');
            }
            audioPlayer.src = url; audioPlayer.play();
            btn.innerHTML = '<i class="fa-solid fa-pause"></i>'; btn.classList.add('playing-audio');
            currentPlayingBtn = btn;
        }

        function toggleAudioMushaf(spanEl, url) {
            if (audioPlayer.src === url && !audioPlayer.paused) {
                audioPlayer.pause(); spanEl.classList.remove('mushaf-playing'); return;
            }
            if (currentPlayingBtn && currentPlayingBtn.tagName === 'SPAN') {
                currentPlayingBtn.classList.remove('mushaf-playing');
            } else if (currentPlayingBtn && currentPlayingBtn.tagName === 'BUTTON') {
                currentPlayingBtn.innerHTML = '<i class="fa-solid fa-play"></i>'; currentPlayingBtn.classList.remove('playing-audio');
            }
            audioPlayer.src = url; audioPlayer.play();
            spanEl.classList.add('mushaf-playing');
            currentPlayingBtn = spanEl;
        }

        audioPlayer.onended = () => {
            if (currentPlayingBtn) {
                if(currentPlayingBtn.tagName === 'BUTTON') { currentPlayingBtn.innerHTML = '<i class="fa-solid fa-play"></i>'; currentPlayingBtn.classList.remove('playing-audio'); } 
                else { currentPlayingBtn.classList.remove('mushaf-playing'); }
            }
        };

        function closeSurah() {
            audioPlayer.pause(); 
            document.getElementById('surah-screen').classList.replace('screen-active', 'screen-hidden');
            document.getElementById('home-screen').classList.replace('screen-hidden', 'screen-active');
            checkLastRead();
        }

        // --- BOOKMARKS & LAST READ ---
        function saveBookmark(surahId, ayahId, surahName) {
            const data = { surahId, ayahId, surahName, date: new Date().toLocaleDateString() };
            localStorage.setItem('dkrtv_lastread', JSON.stringify(data));
            
            const exists = bookmarks.find(b => b.surahId === surahId && b.ayahId === ayahId);
            if(!exists) {
                bookmarks.push(data);
                localStorage.setItem('dkrtv_bookmarks', JSON.stringify(bookmarks));
            }
            alert(`Ayat ${ayahId} surat ${surahName} berhasil ditandai!`);
            renderBookmarks();
        }

        function checkLastRead() {
            const saved = localStorage.getItem('dkrtv_lastread');
            const card = document.getElementById('last-read-card');
            if (saved) {
                const data = JSON.parse(saved);
                document.getElementById('lr-surah').innerText = data.surahName;
                document.getElementById('lr-ayah').innerText = `Ayat ${data.ayahId}`;
                card.classList.remove('hidden');
                card.onclick = () => openSurah(data.surahId);
            }
        }

        function renderBookmarks() {
            const container = document.getElementById('bookmark-list');
            if (bookmarks.length === 0) {
                container.innerHTML = `<i class="fa-regular fa-bookmark text-4xl text-theme-muted mb-3"></i><h3 class="text-theme-text font-medium text-sm">Belum Ada Bookmark</h3><p class="text-xs text-theme-muted mt-1">Tandai ayat favoritmu saat membaca.</p>`;
                return;
            }
            container.innerHTML = '';
            bookmarks.forEach((b, index) => {
                container.innerHTML += `
                    <div onclick="openSurah(${b.surahId})" class="flex justify-between items-center bg-theme-card p-4 rounded-2xl shadow-sm border border-theme-border cursor-pointer hover:border-gold-300 text-left">
                        <div class="flex items-center">
                            <div class="w-10 h-10 bg-theme-accent rounded-full flex items-center justify-center text-gold-500 mr-4"><i class="fa-solid fa-bookmark"></i></div>
                            <div><h4 class="font-bold text-theme-text">${b.surahName}</h4><p class="text-xs text-theme-muted">Ayat ${b.ayahId}</p></div>
                        </div>
                        <button onclick="event.stopPropagation(); removeBookmark(${index})" class="text-red-400 p-2 hover:bg-red-50 rounded-full"><i class="fa-solid fa-trash-can text-sm"></i></button>
                    </div>
                `;
            });
        }
        function removeBookmark(index) {
            bookmarks.splice(index, 1); localStorage.setItem('dkrtv_bookmarks', JSON.stringify(bookmarks)); renderBookmarks();
        }
    </script>
</body>
</html>
