<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyO_pvfm2Dtx30ZTq8gRCdT2l3Cg4g6WsKTZWBA-a8iUcu-In85PzyMAajl3wNcA56wCQ/exec";

    async function loadData() {
        const container = document.getElementById('galleryContainer');
        try {
            const response = await fetch(GAS_URL);
            const textResponse = await response.text(); 
            
            let data;
            try {
                data = JSON.parse(textResponse);
            } catch (err) {
                console.error("Respon bukan JSON:", textResponse);
                container.innerHTML = `<div id="loader" style="color:#ef4444;">Error Akses! Buka link GAS lu di browser baru, pastikan izinnya 'Siapa Saja'.</div>`;
                return;
            }
            
            if(data.error) {
                container.innerHTML = `<div id="loader" style="color:#ef4444;">Script Error: ${data.error}</div>`;
                return;
            }
            
            container.innerHTML = '';
            
            if(!data || data.length === 0) {
                container.innerHTML = '<div id="loader">Belum ada data video. Tambahkan di halaman Admin!</div>';
                return;
            }

            data.forEach(item => {
                const thumbnailUrl = `https://img.youtube.com/vi/${item.ytId}/hqdefault.jpg`;
                
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <a href="${item.ytLink}" target="_blank" class="yt-thumb">
                        <img src="${thumbnailUrl}" alt="Thumbnail">
                        <i class="ph-fill ph-play-circle play-icon"></i>
                    </a>
                    <div class="card-body">
                        <div class="card-title">${item.title}</div>
                        <div class="card-prompt" id="prompt-${item.ytId}">${item.prompt}</div>
                        <div class="card-actions">
                            <button class="btn btn-copy" onclick="copyPrompt(\`${item.prompt.replace(/`/g, '\\`')}\`, this)">
                                <i class="ph ph-copy"></i> Salin Prompt
                            </button>
                            <a href="${item.ytLink}" target="_blank" class="btn btn-yt">
                                <i class="ph ph-youtube-logo"></i> Tonton
                            </a>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        } catch (error) {
            container.innerHTML = `<div id="loader" style="color:#ef4444;">Gagal fetch data: Pastikan internet / URL GAS aman.</div>`;
        }
    }

    function copyPrompt(text, btn) {
        navigator.clipboard.writeText(text).then(() => {
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="ph ph-check-circle"></i> Tersalin!';
            btn.style.background = '#10b981';
            setTimeout(() => {
                btn.innerHTML = originalHtml;
                btn.style.background = 'var(--primary)';
            }, 2000);
        });
    }

    window.onload = loadData;
</script>
