<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webagotchi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center font-sans">

    <!-- LAYAR 1: REGISTER KETIKA QR DI SCAN -->
    <div id="setup-screen" class="bg-white p-8 rounded-xl shadow-lg w-96 text-center">
        <h1 class="text-3xl font-bold text-blue-500 mb-4">Adopsi Pet Baru</h1>
        <input id="ownerName" type="text" placeholder="Nama Kamu" class="w-full mb-3 p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-300">
        <input id="petName" type="text" placeholder="Nama Peliharaan" class="w-full mb-4 p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-300">
        <button onclick="startGame()" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded-lg transition">Mulai Main!</button>
    </div>

    <!-- LAYAR 2: GAME TAMAGOTCHI -->
    <div id="game-screen" class="hidden bg-white p-8 rounded-xl shadow-lg w-96 text-center">
        <h2 id="displayPetName" class="text-2xl font-bold mb-2">Nama Pet</h2>
        <p class="text-gray-500 mb-4">Milik: <span id="displayOwnerName"></span></p>

        <!-- Karakter (Pakai emoji biar simpel, bisa diganti gambar/gif) -->
        <div class="text-8xl mb-6 animate-bounce">👾</div>

        <!-- Status Bar -->
        <div class="text-left mb-6 space-y-2">
            <div>
                <span class="font-bold">Lapar:</span> <span id="statHunger">100</span>%
                <div class="w-full bg-gray-200 rounded-full h-2.5"><div id="barHunger" class="bg-red-500 h-2.5 rounded-full" style="width: 100%"></div></div>
            </div>
            <div>
                <span class="font-bold">Senang:</span> <span id="statHappy">100</span>%
                <div class="w-full bg-gray-200 rounded-full h-2.5"><div id="barHappy" class="bg-yellow-400 h-2.5 rounded-full" style="width: 100%"></div></div>
            </div>
            <div>
                <span class="font-bold">Energi:</span> <span id="statEnergy">100</span>%
                <div class="w-full bg-gray-200 rounded-full h-2.5"><div id="barEnergy" class="bg-blue-500 h-2.5 rounded-full" style="width: 100%"></div></div>
            </div>
        </div>

        <!-- Tombol Aksi -->
        <div class="grid grid-cols-3 gap-2">
            <button onclick="interact('feed')" class="bg-red-100 hover:bg-red-200 text-red-600 font-bold py-2 rounded-lg">🍔 Makan</button>
            <button onclick="interact('play')" class="bg-yellow-100 hover:bg-yellow-200 text-yellow-600 font-bold py-2 rounded-lg">🎾 Main</button>
            <button onclick="interact('sleep')" class="bg-blue-100 hover:bg-blue-200 text-blue-600 font-bold py-2 rounded-lg">💤 Tidur</button>
        </div>
    </div>

    <script>
        // ⚠️ PENTING: GANTI DENGAN URL DAN KEY DARI PROJECT SUPABASE KAMU
        const SUPABASE_URL = 'https://xyzabcdefghijklm.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5c... (PASTE ANON KEY DISINI)';
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let currentPetId = null;

        // Fungsi saat tombol Mulai ditekan
        async function startGame() {
            const owner = document.getElementById('ownerName').value;
            const pet = document.getElementById('petName').value;

            if(!owner || !pet) return alert("Isi nama dulu bro!");

            // 1. Simpan ke Database Supabase
            const { data, error } = await supabase
                .from('pets')
                .insert([{ owner_name: owner, pet_name: pet }])
                .select();

            if (error) {
                console.error(error);
                alert("Gagal simpan ke database");
                return;
            }

            // 2. Setup layar game
            currentPetId = data[0].id;
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            
            document.getElementById('displayPetName').innerText = pet;
            document.getElementById('displayOwnerName').innerText = owner;

            // Mulai kurangi status pelan-pelan (Game Loop sederhana)
            setInterval(decreaseStatsOfflineSimulation, 5000); // Tiap 5 detik ngurangin status
        }

        // Fungsi interaksi tombol
        async function interact(action) {
            let hungerAdd = 0, happyAdd = 0, energyAdd = 0;

            if (action === 'feed') { hungerAdd = 20; energyAdd = -5; }
            if (action === 'play') { happyAdd = 20; energyAdd = -10; hungerAdd = -10; }
            if (action === 'sleep') { energyAdd = 30; hungerAdd = -10; }

            // Ambil data terbaru dulu dari DB
            const { data } = await supabase.from('pets').select('*').eq('id', currentPetId).single();
            
            let newHunger = Math.min(100, Math.max(0, data.hunger + hungerAdd));
            let newHappy = Math.min(100, Math.max(0, data.happiness + happyAdd));
            let newEnergy = Math.min(100, Math.max(0, data.energy + energyAdd));

            // Update ke DB
            await supabase.from('pets').update({
                hunger: newHunger,
                happiness: newHappy,
                energy: newEnergy,
                last_interacted: new Date().toISOString()
            }).eq('id', currentPetId);

            updateUI(newHunger, newHappy, newEnergy);
        }

        // Fungsi simulasi waktu berjalan
        async function decreaseStatsOfflineSimulation() {
            if(!currentPetId) return;
            const { data } = await supabase.from('pets').select('*').eq('id', currentPetId).single();
            
            let newHunger = Math.max(0, data.hunger - 1);
            let newHappy = Math.max(0, data.happiness - 1);
            let newEnergy = Math.max(0, data.energy - 1);

            await supabase.from('pets').update({
                hunger: newHunger, happiness: newHappy, energy: newEnergy
            }).eq('id', currentPetId);

            updateUI(newHunger, newHappy, newEnergy);
        }

        // Update tampilan bar
        function updateUI(hunger, happy, energy) {
            document.getElementById('statHunger').innerText = hunger;
            document.getElementById('barHunger').style.width = hunger + '%';

            document.getElementById('statHappy').innerText = happy;
            document.getElementById('barHappy').style.width = happy + '%';

            document.getElementById('statEnergy').innerText = energy;
            document.getElementById('barEnergy').style.width = energy + '%';
        }
    </script>
</body>
</html>
