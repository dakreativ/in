<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Blank Smart QR</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        :root { --bg: #f8fafc; --surface: #ffffff; --border: #e2e8f0; --text: #0f172a; --primary: #000000; --biru: #3b82f6;}
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); padding: 30px 20px; }
        .container { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        .card-title { font-size: 20px; font-weight: 800; margin-bottom: 20px; letter-spacing: -0.5px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr auto; gap: 16px; align-items: end; }
        .form-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px; color: #475569; }
        .form-group input { width: 100%; padding: 14px; border: 2px solid var(--border); border-radius: 10px; outline: none; font-size: 14px; }
        .form-group input:focus { border-color: var(--biru); }
        .btn { background: var(--primary); color: white; border: none; padding: 14px 24px; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .btn:disabled { opacity: 0.5; cursor: wait; transform: none; }
        
        table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; margin-top: 10px; }
        th { background: #f1f5f9; padding: 14px; border-bottom: 2px solid var(--border); font-weight: 700; }
        td { padding: 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        .badge-kosong { background: #dcfce3; color: #166534; padding: 6px 12px; border-radius: 20px; font-weight: 700; font-size: 11px; }
        .badge-kunci { background: #fee2e2; color: #991b1b; padding: 6px 12px; border-radius: 20px; font-weight: 700; font-size: 11px; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-title">📦 Generate Batch Smart QR (Masal)</div>
        <form class="form-grid" onsubmit="generateBatch(event)">
            <div class="form-group"><label>Nama Order / Batch</label><input type="text" id="batchName" placeholder="Contoh: Suvenir Nikah Rian" required></div>
            <div class="form-group"><label>Jumlah QR (Pcs)</label><input type="number" id="jumlah" min="1" max="100" value="10" required></div>
            <button type="submit" class="btn" id="btnSubmit">Buat & Download ZIP</button>
        </form>
    </div>

    <div class="card">
        <div class="card-title">🗄️ Database QR Code</div>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr><th>ID QR</th><th>Nama Batch</th><th>Status</th><th>Link Tujuan</th><th>Klik</th></tr>
                </thead>
                <tbody id="tableBody"><tr><td colspan="5" align="center">Memuat data...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const supabaseUrl = 'https://bkxclrjycsdpchodgzzb.supabase.co';
    const supabaseKey = 'sb_publishable_F9D19Umk_ofD3bwZDP5sng_O4kSsG_3';
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
    
    // GANTI SAMA DOMAIN VERCEL LU!
    const DOMAIN_JEMBATAN = "https://dkrtv.vercel.app/qrcode/scan.html?id="; 

    async function loadData() {
        const { data, error } = await supabaseClient.from('dynamic_links').select('*').order('created_at', { ascending: false });
        const tbody = document.getElementById('tableBody');
        
        if(error || !data || data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" align="center">Belum ada QR Code.</td></tr>`; return;
        }

        tbody.innerHTML = data.map(item => `
            <tr>
                <td><b>${item.qr_id}</b></td>
                <td>${item.batch_name}</td>
                <td><span class="${item.status === 'Kosong' ? 'badge-kosong' : 'badge-kunci'}">${item.status}</span></td>
                <td style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                    ${item.target_url ? `<a href="${item.target_url}" target="_blank" style="color:#3b82f6;">${item.target_url}</a>` : '<span style="color:gray;">Belum diklaim</span>'}
                </td>
                <td><b>${item.clicks}</b></td>
            </tr>
        `).join('');
    }

    async function generateBatch(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        btn.disabled = true; btn.innerText = "Memproses...";

        const batchName = document.getElementById('batchName').value;
        const jumlah = parseInt(document.getElementById('jumlah').value);
        
        const newQRs = [];
        const prefix = "QR" + Math.floor(1000 + Math.random() * 9000); // Kode unik batch
        
        // 1. Siapkan data buat database
        for (let i = 1; i <= jumlah; i++) {
            const idUnik = `${prefix}-${i.toString().padStart(3, '0')}`;
            newQRs.push({ qr_id: idUnik, batch_name: batchName, status: "Kosong" });
        }

        // 2. Insert masal ke Supabase
        const { error } = await supabaseClient.from('dynamic_links').insert(newQRs);
        if (error) { alert("Gagal simpan ke database: " + error.message); btn.disabled = false; btn.innerText = "Buat & Download ZIP"; return; }

        // 3. Generate File ZIP
        btn.innerText = "Membuat File ZIP...";
        const zip = new JSZip();
        
        for (let qrData of newQRs) {
            const qr = new QRious({ value: DOMAIN_JEMBATAN + qrData.qr_id, size: 600, level: 'H' });
            const base64Data = qr.toDataURL('image/png').split(',')[1];
            zip.file(`${qrData.qr_id}.png`, base64Data, {base64: true});
        }

        const content = await zip.generateAsync({type:"blob"});
        saveAs(content, `Batch_${batchName.replace(/[^a-zA-Z0-9]/g, '_')}_${jumlah}pcs.zip`);

        document.getElementById('batchName').value = '';
        btn.disabled = false; btn.innerText = "Buat & Download ZIP";
        loadData();
    }

    window.onload = loadData;
</script>
</body>
</html>
