<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Klien - Dktv.</title>
    <!-- Font UI/UX Modern -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        :root {
            --merah: #ef4444; --putih: #ffffff; --biru: #3b82f6; --dark: #0f172a; --gray: #64748b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background: linear-gradient(-45deg, var(--merah), #ffffff, var(--biru), #ffffff);
            background-size: 400% 400%; animation: gradientGerak 12s ease infinite;
            display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; color: var(--dark);
        }
        @keyframes gradientGerak { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .glass-card {
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5); padding: 35px 25px; border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15); width: 100%; max-width: 420px; text-align: center;
        }

        .header { margin-bottom: 24px; }
        .logo-dktv { font-size: 32px; font-weight: 800; letter-spacing: -1.5px; color: var(--dark); line-height: 1; margin-bottom: 4px; }
        .logo-pt { font-size: 11px; font-weight: 700; color: var(--gray); text-transform: uppercase; letter-spacing: 1.5px; }
        .welcome-text { font-size: 18px; font-weight: 700; margin-bottom: 5px; }
        .desc-text { font-size: 13px; color: var(--gray); margin-bottom: 24px; line-height: 1.5; }

        /* Icon Minimalis Flat (Pengganti Emoji) */
        .stats-box {
            background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 16px;
            padding: 16px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between;
        }
        .stats-icon {
            background: #dbeafe; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; border-radius: 50%;
        }
        .stats-info { text-align: right; }
        .stats-title { font-size: 12px; font-weight: 600; color: var(--gray); margin-bottom: 2px; }
        .stats-angka { font-size: 22px; font-weight: 800; color: var(--biru); line-height: 1; }

        .qr-box { background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 16px; padding: 20px; margin-bottom: 24px; }
        .qr-box canvas { border-radius: 8px; margin-bottom: 12px; width: 150px; height: 150px; }
        .btn-download {
            background: white; border: 1px solid #cbd5e1; color: var(--dark); padding: 8px 16px;
            border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.2s;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-download:hover { background: #f1f5f9; }

        .input-group { text-align: left; margin-bottom: 20px; }
        .input-group label { display: block; font-size: 12px; font-weight: 700; color: var(--dark); margin-bottom: 8px; }
        .input-group input {
            width: 100%; padding: 14px 16px; border: 2px solid #e2e8f0; border-radius: 12px;
            font-size: 14px; outline: none; transition: 0.3s; background: #ffffff;
        }
        .input-group input:focus { border-color: var(--biru); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }
        
        .btn-simpan {
            width: 100%; background: var(--dark); color: white; border: none; padding: 16px;
            border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.2s;
        }
        .btn-simpan:hover { background: #1e293b; transform: translateY(-2px); }
        .btn-simpan:disabled { opacity: 0.7; cursor: wait; }

        .toast { margin-top: 15px; font-size: 13px; font-weight: 700; color: #10b981; display: none; background: #d1fae5; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="glass-card" id="app">
    <div style="color:var(--gray); font-weight: 600; padding: 40px 0;">Memuat Dashboard...</div>
</div>

<script>
    const supabaseUrl = 'https://bkxclrjycsdpchodgzzb.supabase.co';
    const supabaseKey = 'sb_publishable_F9D19Umk_ofD3bwZDP5sng_O4kSsG_3';
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    const DOMAIN_JEMBATAN = "https://dkrtv.vercel.app/qrcode/scan.html?id="; 
    const token = new URLSearchParams(window.location.search).get('token');
    const app = document.getElementById('app');

    async function loadKlienData() {
        try {
            if (!token) { 
                app.innerHTML = '<h2 style="color:red; margin-bottom:10px;">Link Tidak Lengkap!</h2><p style="font-size:14px; color:gray;">Pastikan Anda membuka link akses yang benar dari Admin (mengandung token).</p>'; 
                return; 
            }

            const { data, error } = await supabaseClient.from('dynamic_links').select('*').eq('token_rahasia', token).single();

            if (error) throw error; // Lempar error ke blok catch biar kebaca

            if (!data) { 
                app.innerHTML = '<h2 style="color:red;">Data Tidak Ditemukan</h2><p>Hubungi admin untuk link akses baru.</p>'; 
                return; 
            }

            const jumlahKlik = data.clicks || 0;
            const targetLink = data.target_url || '';

            app.innerHTML = `
                <div class="header">
                    <div class="logo-dktv">Dktv.</div>
                    <div class="logo-pt">PT Dakreativ Digital Media</div>
                </div>

                <div class="welcome-text">Halo, ${data.nama_klien}! 👋</div>
                <div class="desc-text">Kelola QR Code dan lihat statistik Anda di sini.</div>

                <div class="stats-box">
                    <div class="stats-icon">
                        <!-- Icon Minimalis Flat -->
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 7V4h3"></path><path d="M20 7V4h-3"></path><path d="M4 17v3h3"></path><path d="M20 17v3h-3"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </div>
                    <div class="stats-info">
                        <div class="stats-title">TOTAL SCAN QR</div>
                        <div class="stats-angka">${jumlahKlik} <span style="font-size:12px; color:gray; font-weight:600;">Orang</span></div>
                    </div>
                </div>

                <div class="qr-box">
                    <canvas id="qrCanvas"></canvas>
                    <br>
                    <button class="btn-download" onclick="downloadQR('${data.qr_id}')">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        Download QR Code
                    </button>
                </div>

                <form onsubmit="updateLink(event)">
                    <div class="input-group">
                        <label>Link Tujuan QR Code Saat Ini:</label>
                        <input type="url" id="linkBaru" placeholder="Contoh: https://instagram.com/akun" value="${targetLink}" required>
                    </div>
                    <button type="submit" class="btn-simpan" id="btnSimpan">Simpan Perubahan</button>
                </form>
                <div id="msg" class="toast">✅ Link berhasil diperbarui! QR Code langsung terupdate.</div>
            `;

            new QRious({
                element: document.getElementById('qrCanvas'),
                value: DOMAIN_JEMBATAN + data.qr_id,
                size: 300, level: 'H'
            });

        } catch (err) {
            // Kalau gagal, error aslinya akan muncul di layar, bukan loading terus
            app.innerHTML = `<h2 style="color:red; margin-bottom:10px;">Terjadi Kesalahan</h2>
                             <p style="font-size:13px; color:gray; word-break:break-all;">Error: ${err.message}</p>
                             <p style="font-size:13px; color:gray; margin-top:10px;">Cek izin RLS di Supabase lu bro!</p>`;
        }
    }

    window.updateLink = async function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSimpan');
        btn.disabled = true; btn.innerText = "Menyimpan...";

        const linkBaru = document.getElementById('linkBaru').value;
        const { error } = await supabaseClient.from('dynamic_links').update({ target_url: linkBaru }).eq('token_rahasia', token);

        if (!error) {
            document.getElementById('msg').style.display = 'block';
            setTimeout(() => document.getElementById('msg').style.display = 'none', 5000);
        } else {
            alert("Gagal menyimpan: " + error.message);
        }
        btn.disabled = false; btn.innerText = "Simpan Perubahan";
    }

    window.downloadQR = function(idQR) {
        const canvas = document.getElementById('qrCanvas');
        const a = document.createElement('a'); a.href = canvas.toDataURL('image/png'); a.download = `QRCode_${idQR}.png`; a.click();
    }

    loadKlienData();
</script>
</body>
</html>
