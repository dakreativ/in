<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Nama Digital - WA DKTV</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #F1F5F9; color: #1E293B; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; box-sizing: border-box;}
        .hidden { display: none !important; }
        
        .card-container { background: white; width: 100%; max-width: 400px; padding: 40px 30px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); text-align: center; }
        
        .primary-color { color: #10B981; }
        .primary-bg { background: #10B981; color: white; }
        .secondary-bg { background: #F8FAFC; border: 2px solid #E2E8F0; color: #334155; }
        
        h1 { margin: 0 0 10px; font-weight: 800; font-size: 26px; }
        p { color: #64748B; font-size: 14px; margin-bottom: 25px; line-height: 1.5;}
        
        .input-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: 800; margin-bottom: 8px; color: #475569;}
        input { width: 100%; padding: 15px; border: 2px solid #E2E8F0; border-radius: 12px; box-sizing: border-box; outline: none; font-size: 15px; font-family: inherit; transition: 0.3s;}
        input:focus { border-color: #10B981; }
        
        button { width: 100%; padding: 16px; border: none; border-radius: 12px; font-weight: 800; font-size: 15px; cursor: pointer; transition: 0.3s; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

        .profile-avatar { width: 90px; height: 90px; background: #1E293B; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 800; margin: 0 auto 15px; }
        
        .loader { border: 4px solid #E2E8F0; border-top: 4px solid #10B981; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="card-container">
        
        <!-- 1. LOADING SCREEN -->
        <div id="loadingBox">
            <div class="loader"></div>
            <h2 style="font-size: 18px;">Memeriksa Kartu...</h2>
            <p>Mohon tunggu sebentar.</p>
        </div>

        <!-- 2. SETUP SCREEN -->
        <div id="setupBox" class="hidden">
            <h1 class="primary-color">Halo! 👋</h1>
            <p>Kartu WA DKTV ini masih kosong. Silakan masukkan data Anda untuk mengunci kartu ini.</p>
            
            <div class="input-group">
                <label>Nama Lengkap / Panggilan</label>
                <input type="text" id="inputNama" placeholder="Cth: Dadan Furman">
            </div>
            <div class="input-group">
                <label>Nomor WhatsApp</label>
                <input type="number" id="inputWa" placeholder="Cth: 628123456789">
                <small style="color:#94A3B8; font-size:11px; display:block; margin-top:5px;">*Wajib pakai kode negara (cth: 62)</small>
            </div>
            
            <button class="primary-bg" id="btnSetup" onclick="lockCard()">Kunci & Aktifkan Kartu</button>
        </div>

        <!-- 3. PROFILE SCREEN -->
        <div id="profileBox" class="hidden">
            <div class="profile-avatar" id="avatarName">D</div>
            <h1 id="displayName" style="margin-bottom: 5px;">Nama Orang</h1>
            <p style="margin-bottom: 30px;">Let's connect & collaborate!</p>
            
            <button class="primary-bg" onclick="saveContact()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                Simpan Kontak ke HP
            </button>
            
            <button class="secondary-bg" id="btnChat" onclick="openWa()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                Chat via WhatsApp
            </button>
        </div>

        <!-- 4. ERROR SCREEN -->
        <div id="errorBox" class="hidden">
            <h1 style="color: #EF4444;">Opps! ⚠️</h1>
            <p id="errorMsg">Barcode tidak valid atau tidak terdaftar.</p>
        </div>

    </div>

    <script>
        // ==========================================
        const SUPABASE_URL = 'https://bkxclrjycsdpchodgzzb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_F9D19Umk_ofD3bwZDP5sng_O4kSsG_3'; 
        // ==========================================
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const urlParams = new URLSearchParams(window.location.search);
        const cardId = urlParams.get('id');
        let currentData = null;

        async function checkCard() {
            if(!cardId) return showError("Harap Scan Barcode fisik yang valid.");

            // PERUBAHAN DI SINI: MENGGUNAKAN TABEL wa1
            const { data, error } = await supabase.from('wa1').select('*').eq('id', cardId).single();

            document.getElementById('loadingBox').classList.add('hidden');

            if (error) return showError("Kartu belum terdaftar di sistem kami.");

            if (data.status === 'Kosong') {
                document.getElementById('setupBox').classList.remove('hidden');
            } else if (data.status === 'Aktif') {
                currentData = data;
                tampilkanProfile(data);
            }
        }

        async function lockCard() {
            const nama = document.getElementById('inputNama').value;
            const wa = document.getElementById('inputWa').value;
            const btn = document.getElementById('btnSetup');

            if(!nama || !wa) return alert("Nama dan Nomor WA wajib diisi!");
            btn.disabled = true; btn.innerText = "Mengunci Kartu...";

            // PERUBAHAN DI SINI: MENGGUNAKAN TABEL wa1
            const { error } = await supabase
                .from('wa1')
                .update({ status: 'Aktif', nama: nama, wa: wa })
                .eq('id', cardId);

            if (error) {
                alert("Gagal menyimpan data: " + error.message);
                btn.disabled = false; btn.innerText = "Kunci & Aktifkan Kartu";
                return;
            }
            window.location.reload();
        }

        function tampilkanProfile(data) {
            document.getElementById('profileBox').classList.remove('hidden');
            document.getElementById('displayName').innerText = data.nama;
            let inisial = data.nama.charAt(0).toUpperCase();
            document.getElementById('avatarName').innerText = inisial;
        }

        function saveContact() {
            if(!currentData) return;
            let vcard = `BEGIN:VCARD\nVERSION:3.0\nFN:${currentData.nama}\nTEL;TYPE=CELL,VOICE:${currentData.wa}\nEND:VCARD`;
            let blob = new Blob([vcard], { type: 'text/vcard' });
            let url = URL.createObjectURL(blob);
            
            let a = document.createElement('a');
            a.href = url;
            a.download = `${currentData.nama.replace(/\s+/g, '_')}_WADKTV.vcf`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function openWa() {
            if(!currentData) return;
            let cleanWa = currentData.wa.replace(/[^0-9]/g, ''); 
            window.open(`https://wa.me/${cleanWa}?text=Halo,%20saya%20dapat%20nomor%20ini%20dari%20Kartu%20Digital%20WA%20DKTV.`, '_blank');
        }

        function showError(msg) {
            document.getElementById('loadingBox').classList.add('hidden');
            document.getElementById('errorBox').classList.remove('hidden');
            document.getElementById('errorMsg').innerText = msg;
        }

        checkCard();
    </script>
</body>
</html>
