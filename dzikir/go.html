<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>dkrtv. Quran - PT Dakreativ Digital Media</title>
    
    <!-- Google Fonts: Poppins (UI) & Amiri (Arabic) -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'], arabic: ['Amiri', 'serif'] },
                    colors: {
                        gold: { 50: '#FCF9F0', 100: '#F7F0D9', 400: '#E5C158', 500: '#D4AF37', 600: '#AA8C2C' },
                        brokenwhite: '#FAFAFA'
                    },
                    boxShadow: { 'gold-glow': '0 4px 20px -5px rgba(212, 175, 55, 0.4)' }
                }
            }
        }
    </script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #FAFAFA; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
        ::-webkit-scrollbar { display: none; }
        
        .screen-hidden {
            transform: translateX(100%); opacity: 0; pointer-events: none;
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            height: 100vh; overflow: hidden; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
        }
        .screen-active {
            transform: translateX(0); opacity: 1; position: relative;
            height: 100vh; overflow-y: auto; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
        }
        
        @keyframes shimmer { 0% { background-position: -1000px 0; } 100% { background-position: 1000px 0; } }
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 1000px 100%; animation: shimmer 2s infinite linear;
        }
        
        /* Audio visualizer effect untuk tombol play */
        .playing-audio { color: #D4AF37; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* Highlight teks Mushaf saat diputar */
        .mushaf-playing { color: #D4AF37; transition: color 0.3s; }
    </style>
</head>
<body class="text-gray-800">

    <!-- ================= LAYAR 1: BERANDA ================= -->
    <div id="home-screen" class="screen-active flex flex-col bg-brokenwhite">
        
        <!-- Header & Search -->
        <header class="pt-8 pb-4 px-6 sticky top-0 bg-brokenwhite/95 backdrop-blur-md z-10 shadow-[0_2px_10px_-5px_rgba(0,0,0,0.05)]">
            <h1 class="text-2xl font-extrabold tracking-tighter text-gray-800 flex justify-between items-center mb-4">
                <span>dkrtv<span class="text-gold-500">.</span> Quran</span>
            </h1>
            
            <div class="relative w-full">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 text-sm"></i>
                <input type="text" id="search-input" placeholder="Cari surat... (misal: Yasin)" class="w-full bg-white border border-gray-200 text-sm rounded-full py-2.5 pl-10 pr-4 outline-none focus:border-gold-500 focus:ring-1 focus:ring-gold-500 transition shadow-sm placeholder-gray-300">
            </div>
        </header>

        <!-- Main Content -->
        <main class="px-6 flex-1">
            <!-- Card Terakhir Dibaca -->
            <div id="last-read-card" class="bg-gradient-to-tr from-gold-500 to-gold-400 rounded-3xl p-5 text-white shadow-gold-glow mt-4 mb-6 hidden relative overflow-hidden cursor-pointer active:scale-95 transition-transform">
                <div class="absolute -right-6 -top-6 opacity-20">
                    <i class="fa-solid fa-book-quran text-9xl"></i>
                </div>
                <div class="relative z-10">
                    <div class="flex items-center space-x-2 mb-3">
                        <i class="fa-solid fa-book-open text-xs"></i>
                        <span class="text-[10px] font-medium uppercase tracking-wider">Terakhir Dibaca</span>
                    </div>
                    <h2 id="lr-surah" class="text-xl font-bold mb-1">Al-Baqarah</h2>
                    <p id="lr-ayah" class="text-sm opacity-90">Ayat 102</p>
                </div>
            </div>

            <!-- Custom Tabs -->
            <div class="flex border-b border-gray-200 mb-4 mt-2">
                <button onclick="switchTab('surat')" id="tab-surat" class="flex-1 pb-3 font-semibold text-gold-500 border-b-2 border-gold-500 text-sm transition">Surat</button>
                <button onclick="switchTab('juz')" id="tab-juz" class="flex-1 pb-3 font-medium text-gray-400 border-b-2 border-transparent text-sm transition hover:text-gold-400">Juz</button>
                <button onclick="switchTab('bookmark')" id="tab-bookmark" class="flex-1 pb-3 font-medium text-gray-400 border-b-2 border-transparent text-sm transition hover:text-gold-400">Bookmark</button>
            </div>

            <div id="content-surat" class="space-y-3 pb-6 block">
                <div id="surah-list" class="space-y-3">
                    <div class="flex items-center p-4 bg-white rounded-2xl border border-gray-50"><div class="w-10 h-10 rounded-full skeleton"></div><div class="ml-4 space-y-2 flex-1"><div class="h-4 w-24 rounded skeleton"></div><div class="h-3 w-16 rounded skeleton"></div></div></div>
                </div>
            </div>

            <div id="content-juz" class="pb-6 hidden text-center pt-10">
                <i class="fa-solid fa-layer-group text-4xl text-gray-200 mb-3"></i>
                <h3 class="text-gray-800 font-medium text-sm">Mode Juz</h3>
                <p class="text-xs text-gray-400 mt-1">Akan tersedia pada update berikutnya.</p>
            </div>

            <div id="content-bookmark" class="pb-6 hidden space-y-3">
                <div id="bookmark-list" class="text-center pt-10"></div>
            </div>
            
            <!-- Company Footer -->
            <footer class="mt-8 mb-8 pt-6 border-t border-gray-100 text-center">
                <p class="text-[9px] text-gray-400 font-medium tracking-widest uppercase mb-1">A proudly crafted digital product by</p>
                <p class="text-xs font-bold text-gray-700">PT Dakreativ Digital Media <span class="text-gold-500">© 2026</span></p>
            </footer>
        </main>
    </div>

    <!-- ================= LAYAR 2: BACA AYAT ================= -->
    <div id="surah-screen" class="screen-hidden flex flex-col bg-brokenwhite">
        <!-- Sticky Header Detail Surat -->
        <header class="pt-8 pb-4 px-4 sticky top-0 bg-brokenwhite/95 backdrop-blur-md z-20 flex items-center justify-between shadow-[0_2px_15px_-5px_rgba(0,0,0,0.05)]">
            <div class="flex items-center">
                <button onclick="closeSurah()" class="text-gray-500 hover:bg-gray-200 rounded-full transition w-10 h-10 flex items-center justify-center bg-white shadow-sm border border-gray-100">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <div class="ml-4">
                    <h2 id="detail-surah-name" class="font-bold text-lg text-gray-800 leading-tight">Memuat...</h2>
                    <p id="detail-surah-info" class="text-[10px] font-medium text-gray-500 uppercase tracking-widest">...</p>
                </div>
            </div>
            
            <!-- TOMBOL TOGGLE MODE BACA -->
            <button onclick="toggleViewMode()" class="bg-gold-50 text-gold-600 px-3 py-1.5 rounded-full text-[10px] font-bold tracking-wider uppercase flex items-center shadow-sm border border-gold-100 active:scale-95 transition">
                <i id="mode-icon" class="fa-solid fa-list mr-1.5"></i> 
                <span id="mode-text">Terjemah</span>
            </button>
        </header>

        <!-- Container Ayat -->
        <main class="px-4 pb-24 relative">
            <div id="bismillah-container" class="my-10 text-center hidden">
                <h1 class="font-arabic text-4xl text-gray-800">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</h1>
            </div>
            
            <!-- Tempat Ayat di-Render -->
            <div id="ayah-list"></div>
        </main>
    </div>

    <!-- GLOBAL AUDIO PLAYER -->
    <audio id="global-audio-player"></audio>

    <!-- LOGIKA JAVASCRIPT -->
    <script>
        const API_URL = 'https://equran.id/api/v2/surat';
        let allSurahs = []; 
        let currentSurahData = null; // Menyimpan data surat yang sedang dibuka
        let bookmarks = JSON.parse(localStorage.getItem('dkrtv_bookmarks')) || [];
        
        // Mode Tampilan: 'terjemah' atau 'mushaf'
        let viewMode = localStorage.getItem('dkrtv_viewmode') || 'terjemah'; 
        
        const audioPlayer = document.getElementById('global-audio-player');
        let currentPlayingBtn = null; 

        document.addEventListener("DOMContentLoaded", () => {
            loadSurahs();
            checkLastRead();
            renderBookmarks();
            updateModeButtonUI(); // Update UI tombol di awal
        });

        // --- SEARCH & TABS LOGIC ---
        document.getElementById('search-input').addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            const filtered = allSurahs.filter(s => s.namaLatin.toLowerCase().includes(keyword) || s.arti.toLowerCase().includes(keyword));
            renderSurahList(filtered);
        });

        function switchTab(tabName) {
            ['surat', 'juz', 'bookmark'].forEach(t => {
                document.getElementById(`tab-${t}`).className = "flex-1 pb-3 font-medium text-gray-400 border-b-2 border-transparent text-sm transition hover:text-gold-400";
                document.getElementById(`content-${t}`).classList.add('hidden');
                document.getElementById(`content-${t}`).classList.remove('block');
            });
            document.getElementById(`tab-${tabName}`).className = "flex-1 pb-3 font-semibold text-gold-500 border-b-2 border-gold-500 text-sm transition";
            document.getElementById(`content-${tabName}`).classList.remove('hidden');
            document.getElementById(`content-${tabName}`).classList.add('block');
            if(tabName === 'bookmark') renderBookmarks();
        }

        // --- LOAD LIST SURAT ---
        async function loadSurahs() {
            try {
                const response = await fetch(API_URL);
                const result = await response.json();
                allSurahs = result.data;
                renderSurahList(allSurahs);
            } catch (error) {
                document.getElementById('surah-list').innerHTML = `<p class="text-center text-red-400 text-sm py-10">Gagal memuat koneksi.</p>`;
            }
        }

        function renderSurahList(surahs) {
            const container = document.getElementById('surah-list');
            container.innerHTML = '';
            if(surahs.length === 0) { container.innerHTML = `<p class="text-center text-gray-400 text-sm py-10">Surat tidak ditemukan.</p>`; return; }

            surahs.forEach(surah => {
                const item = document.createElement('div');
                item.className = 'flex items-center justify-between p-4 bg-white rounded-2xl shadow-sm border border-gray-50 hover:border-gold-300 cursor-pointer active:scale-[0.98] transition-all';
                item.onclick = () => openSurah(surah.nomor);
                item.innerHTML = `
                    <div class="flex items-center space-x-4">
                        <div class="relative flex items-center justify-center w-10 h-10">
                            <svg class="absolute w-10 h-10 text-gold-100" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L14.8 8.6L22 9.3L16.5 14L18.2 21L12 17.3L5.8 21L7.5 14L2 9.3L9.2 8.6L12 2Z"/></svg>
                            <span class="relative z-10 text-xs font-bold text-gray-800">${surah.nomor}</span>
                        </div>
                        <div>
                            <h3 class="font-bold text-gray-800">${surah.namaLatin}</h3>
                            <p class="text-[10px] text-gray-400 font-medium uppercase tracking-wider">${surah.tempatTurun} • ${surah.jumlahAyat} AYAT</p>
                        </div>
                    </div>
                    <h4 class="font-arabic text-xl text-gold-600 font-bold">${surah.nama}</h4>
                `;
                container.appendChild(item);
            });
        }

        // --- KONVERSI ANGKA KE HURUF ARAB ---
        function toArabicNum(num) {
            const arabDigits = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
            return num.toString().split('').map(n => arabDigits[n]).join('');
        }

        // --- BUKA SURAT & FETCH DATA ---
        async function openSurah(nomorSurat) {
            audioPlayer.pause();
            document.getElementById('home-screen').classList.replace('screen-active', 'screen-hidden');
            document.getElementById('surah-screen').classList.replace('screen-hidden', 'screen-active');
            window.scrollTo(0, 0);

            const container = document.getElementById('ayah-list');
            container.innerHTML = `<div class="p-6 bg-white rounded-2xl"><div class="h-6 w-3/4 bg-gray-200 rounded skeleton mb-4 ml-auto"></div><div class="h-4 w-full bg-gray-200 rounded skeleton"></div></div>`;
            document.getElementById('detail-surah-name').innerText = "Memuat...";

            try {
                const response = await fetch(`${API_URL}/${nomorSurat}`);
                const result = await response.json();
                currentSurahData = result.data; // Simpan ke variabel global

                document.getElementById('detail-surah-name').innerText = currentSurahData.namaLatin;
                document.getElementById('detail-surah-info').innerText = `${currentSurahData.arti} • ${currentSurahData.jumlahAyat} Ayat`;

                if (nomorSurat !== 1 && nomorSurat !== 9) document.getElementById('bismillah-container').classList.remove('hidden');
                else document.getElementById('bismillah-container').classList.add('hidden');

                // Render ayat sesuai mode saat ini
                renderAyahs();

            } catch (error) {
                container.innerHTML = `<p class="text-center text-red-400 py-10">Gagal memuat ayat.</p>`;
            }
        }

        // --- LOGIKA TOGGLE MODE ---
        function toggleViewMode() {
            viewMode = viewMode === 'terjemah' ? 'mushaf' : 'terjemah';
            localStorage.setItem('dkrtv_viewmode', viewMode);
            updateModeButtonUI();
            
            // Matikan audio jika sedang main karena elemennya akan digambar ulang
            audioPlayer.pause(); 
            
            if (currentSurahData) renderAyahs(); // Render ulang ayat
        }

        function updateModeButtonUI() {
            const modeIcon = document.getElementById('mode-icon');
            const modeText = document.getElementById('mode-text');
            
            if (viewMode === 'mushaf') {
                modeIcon.className = 'fa-solid fa-book-quran mr-1.5';
                modeText.innerText = 'Mushaf';
            } else {
                modeIcon.className = 'fa-solid fa-list mr-1.5';
                modeText.innerText = 'Terjemah';
            }
        }

        // --- RENDER AYAT (FLEKSIBEL 2 MODE) ---
        function renderAyahs() {
            const container = document.getElementById('ayah-list');
            container.innerHTML = '';
            
            if (viewMode === 'terjemah') {
                // MODE 1: KARTU TERJEMAHAN (Normal)
                container.className = "space-y-6";
                currentSurahData.ayat.forEach(ayat => {
                    const ayatEl = document.createElement('div');
                    ayatEl.className = 'bg-white p-5 rounded-2xl shadow-sm border border-gray-100';
                    const audioUrl = ayat.audio['05'];

                    ayatEl.innerHTML = `
                        <div class="flex justify-between items-center mb-6 bg-gray-50/50 p-2 rounded-xl">
                            <div class="w-8 h-8 flex items-center justify-center bg-gold-100 text-gold-600 font-bold text-xs rounded-full">
                                ${ayat.nomorAyat}
                            </div>
                            <div class="flex space-x-1 text-gray-400">
                                <button onclick="toggleAudio(this, '${audioUrl}')" class="w-10 h-10 rounded-full hover:bg-gold-50 hover:text-gold-500 transition-colors flex items-center justify-center">
                                    <i class="fa-solid fa-play"></i>
                                </button>
                                <button onclick="saveBookmark(${currentSurahData.nomor}, ${ayat.nomorAyat}, '${currentSurahData.namaLatin}')" class="w-10 h-10 rounded-full hover:bg-gold-50 hover:text-gold-500 transition-colors flex items-center justify-center">
                                    <i class="fa-regular fa-bookmark"></i>
                                </button>
                            </div>
                        </div>
                        <div class="text-right mb-6">
                            <p class="font-arabic text-[2rem] leading-[2.5] text-gray-900">${ayat.teksArab}</p>
                        </div>
                        <div class="text-left space-y-2 border-t border-gray-50 pt-4">
                            <p class="text-xs font-semibold text-gold-600 uppercase tracking-wide leading-relaxed">${ayat.teksLatin}</p>
                            <p class="text-[13px] text-gray-600 leading-relaxed">${ayat.teksIndonesia}</p>
                        </div>
                    `;
                    container.appendChild(ayatEl);
                });

            } else {
                // MODE 2: MUSHAF (Teks Menyambung / Tanpa Terjemah)
                container.className = "bg-white p-6 rounded-2xl shadow-sm border border-gray-100 text-right space-y-2";
                container.setAttribute('dir', 'rtl'); // Flow kanan ke kiri
                
                let mushafHTML = '';
                currentSurahData.ayat.forEach(ayat => {
                    const audioUrl = ayat.audio['05'];
                    const arabicNumber = toArabicNum(ayat.nomorAyat);
                    
                    // Span untuk setiap ayat agar bisa di-klik & diputar suaranya
                    mushafHTML += `
                        <span onclick="toggleAudioMushaf(this, '${audioUrl}')" class="inline font-arabic text-[2.2rem] leading-[2.8] text-gray-900 cursor-pointer hover:text-gold-500 transition-colors">
                            ${ayat.teksArab} <span class="text-gold-500 text-2xl mx-1 font-sans">﴿${arabicNumber}﴾</span>
                        </span>
                    `;
                });
                container.innerHTML = mushafHTML;
            }
        }

        // --- AUDIO PLAYER UNTUK MODE TERJEMAH ---
        function toggleAudio(btn, url) {
            if (audioPlayer.src === url && !audioPlayer.paused) {
                audioPlayer.pause();
                btn.innerHTML = '<i class="fa-solid fa-play"></i>';
                btn.classList.remove('playing-audio');
                return;
            }
            if (currentPlayingBtn && currentPlayingBtn.tagName === 'BUTTON') {
                currentPlayingBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
                currentPlayingBtn.classList.remove('playing-audio');
            } else if (currentPlayingBtn && currentPlayingBtn.tagName === 'SPAN') {
                currentPlayingBtn.classList.remove('mushaf-playing');
            }
            audioPlayer.src = url;
            audioPlayer.play();
            btn.innerHTML = '<i class="fa-solid fa-pause"></i>';
            btn.classList.add('playing-audio');
            currentPlayingBtn = btn;
        }

        // --- AUDIO PLAYER UNTUK MODE MUSHAF (KLIK TEKS) ---
        function toggleAudioMushaf(spanEl, url) {
            if (audioPlayer.src === url && !audioPlayer.paused) {
                audioPlayer.pause();
                spanEl.classList.remove('mushaf-playing');
                return;
            }
            
            // Hapus highlight dari tombol/teks sebelumnya
            if (currentPlayingBtn && currentPlayingBtn.tagName === 'SPAN') {
                currentPlayingBtn.classList.remove('mushaf-playing');
            } else if (currentPlayingBtn && currentPlayingBtn.tagName === 'BUTTON') {
                currentPlayingBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
                currentPlayingBtn.classList.remove('playing-audio');
            }

            audioPlayer.src = url;
            audioPlayer.play();
            
            // Berikan highlight warna emas ke teks ayat yang diklik
            spanEl.classList.add('mushaf-playing');
            currentPlayingBtn = spanEl;
        }

        // Reset UI saat audio selesai
        audioPlayer.onended = () => {
            if (currentPlayingBtn) {
                if(currentPlayingBtn.tagName === 'BUTTON') {
                    currentPlayingBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
                    currentPlayingBtn.classList.remove('playing-audio');
                } else {
                    currentPlayingBtn.classList.remove('mushaf-playing');
                }
            }
        };

        function closeSurah() {
            audioPlayer.pause(); 
            document.getElementById('surah-screen').classList.replace('screen-active', 'screen-hidden');
            document.getElementById('home-screen').classList.replace('screen-hidden', 'screen-active');
            checkLastRead();
        }

        // --- BOOKMARK LOGIC ---
        function saveBookmark(surahId, ayahId, surahName) {
            const data = { surahId, ayahId, surahName, date: new Date().toLocaleDateString() };
            localStorage.setItem('dkrtv_lastread', JSON.stringify(data));
            
            const exists = bookmarks.find(b => b.surahId === surahId && b.ayahId === ayahId);
            if(!exists) {
                bookmarks.push(data);
                localStorage.setItem('dkrtv_bookmarks', JSON.stringify(bookmarks));
            }
            alert(`Ayat ${ayahId} surat ${surahName} berhasil ditandai!`);
            renderBookmarks();
        }

        function checkLastRead() {
            const saved = localStorage.getItem('dkrtv_lastread');
            const card = document.getElementById('last-read-card');
            if (saved) {
                const data = JSON.parse(saved);
                document.getElementById('lr-surah').innerText = data.surahName;
                document.getElementById('lr-ayah').innerText = `Ayat ${data.ayahId}`;
                card.classList.remove('hidden');
                card.onclick = () => openSurah(data.surahId);
            }
        }

        function renderBookmarks() {
            const container = document.getElementById('bookmark-list');
            if (bookmarks.length === 0) {
                container.innerHTML = `<i class="fa-regular fa-bookmark text-4xl text-gray-200 mb-3"></i><h3 class="text-gray-800 font-medium text-sm">Belum Ada Bookmark</h3><p class="text-xs text-gray-400 mt-1">Tandai ayat favoritmu saat membaca.</p>`;
                return;
            }
            
            container.innerHTML = '';
            container.className = 'space-y-3';
            bookmarks.forEach((b, index) => {
                container.innerHTML += `
                    <div onclick="openSurah(${b.surahId})" class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-gray-50 cursor-pointer hover:border-gold-300 text-left">
                        <div class="flex items-center">
                            <div class="w-10 h-10 bg-gold-50 rounded-full flex items-center justify-center text-gold-500 mr-4"><i class="fa-solid fa-bookmark"></i></div>
                            <div><h4 class="font-bold text-gray-800">${b.surahName}</h4><p class="text-xs text-gray-400">Ayat ${b.ayahId} • Disimpan: ${b.date}</p></div>
                        </div>
                        <button onclick="event.stopPropagation(); removeBookmark(${index})" class="text-red-400 p-2 hover:bg-red-50 rounded-full"><i class="fa-solid fa-trash-can text-sm"></i></button>
                    </div>
                `;
            });
        }

        function removeBookmark(index) {
            bookmarks.splice(index, 1);
            localStorage.setItem('dkrtv_bookmarks', JSON.stringify(bookmarks));
            renderBookmarks();
        }
    </script>
</body>
</html>
