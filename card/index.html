<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Card - Dakreativ</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 15px;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .loading { color: #888; font-style: italic; }
        .error { color: #ff4d4d; }
        .btn {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div id="card-container" class="card">
        <p class="loading">Memuat data...</p>
    </div>

    <script>
        // 1. GANTI URL INI DENGAN URL WEB APP GOOGLE APPS SCRIPT KAMU
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxxKQCp8huU_pEJ2uOF3aYE30oYHo_3FYNXJ1pX2AEiHfiVO8LPZip8Z3e9uE8OPJquew/exec'; 

        // 2. Ambil ID dari URL (contoh: ?id=DAD-425410-01)
        const urlParams = new URLSearchParams(window.location.search);
        const idProduk = urlParams.get('id');
        const container = document.getElementById('card-container');

        if (!idProduk) {
            container.innerHTML = '<p class="error">ID Produk tidak ditemukan di URL.</p>';
        } else {
            // 3. Fetch data dari Google Sheets
            fetch(`${scriptURL}?id=${idProduk}`)
                .then(response => response.json())
                .then(data => {
                    // Jika data tidak ditemukan atau statusnya kosong
                    if (data.error) {
                        container.innerHTML = `<p class="error">Data untuk ID ${idProduk} tidak ditemukan.</p>`;
                    } else {
                        // 4. Tampilkan data ke HTML (Sesuai kolom di Google Sheet)
                        container.innerHTML = `
                            <h2>${data.Nama_Pemilik}</h2>
                            <p>${data.Pesan_Custom}</p>
                            <p style="color: #4CAF50; font-size: 0.9em;">Status: ${data.Status}</p>
                            
                            <hr style="border-color: #333; margin: 15px 0;">
                            
                            <a href="https://wa.me/62${data.WA_Pemilik.toString().substring(1)}" class="btn" target="_blank">WhatsApp</a>
                            <a href="https://instagram.com/${data.IG_Pemilik}" class="btn" target="_blank">Instagram</a>
                            <a href="https://tiktok.com/@${data.TikTok_Pemilik}" class="btn" target="_blank">TikTok</a>
                        `;
                    }
                })
                .catch(error => {
                    console.error('Error fetching data:', error);
                    container.innerHTML = '<p class="error">Gagal terhubung ke server.</p>';
                });
        }
    </script>
</body>
</html>
