<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Dakreativ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* TEMA PUTIH BERSIH & MODERN */
        :root { 
            --bg: #f9fafb; 
            --surface: #ffffff; 
            --border: #e5e7eb; 
            --text: #111827; 
            --text-muted: #6b7280; 
            --primary: #000000; 
            --primary-invert: #ffffff; 
        }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); padding: 24px 16px; -webkit-font-smoothing: antialiased; }
        .container { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
        
        /* KARTU / WADAH UTAMA */
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .card-header { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
        @media (min-width: 640px) { .card-header { flex-direction: row; justify-content: space-between; align-items: center; } }
        .card-title { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        
        /* FORM GENERATE */
        .form-grid { display: grid; grid-template-columns: 1fr; gap: 16px; align-items: end; }
        @media (min-width: 768px) { .form-grid { grid-template-columns: 1fr 1fr 1fr auto; } }
        .form-group label { display: block; font-size: 13px; font-weight: 500; color: var(--text-muted); margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 8px; outline: none; transition: 0.2s; font-size: 14px; }
        .form-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,0,0,0.05); }
        
        /* TOMBOL */
        .btn { background: var(--primary); color: var(--primary-invert); border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; height: 45px; width: 100%; }
        @media (min-width: 768px) { .btn { width: auto; } }
        .btn:hover { opacity: 0.8; transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        /* PENCARIAN */
        .search-box { width: 100%; max-width: 300px; position: relative; }
        .search-box input { width: 100%; padding: 10px 14px 10px 36px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; outline: none; transition: 0.2s; }
        .search-box input:focus { border-color: var(--text-muted); }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); opacity: 0.4; }

        /* TABEL & GRUP */
        .table-wrapper { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
        th { background: #f3f4f6; color: var(--text-muted); padding: 12px 16px; font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
        td { padding: 14px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        
        /* KEPALA GRUP PEMBELI */
        .group-header { background: #fafafa; border-bottom: 1px solid var(--border); border-top: 2px solid var(--border); }
        .group-header td { padding: 10px 16px; font-size: 12px; font-weight: 600; color: var(--text); }
        
        /* BADGE STATUS */
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block; }
        .status-terisi { background: #dcfce3; color: #166534; border: 1px solid #bbf7d0; }
        .status-kosong { background: #f3f4f6; color: #4b5563; border: 1px solid #e5e7eb; }
        
        .id-text { font-family: monospace; font-weight: 600; color: var(--text-muted); }
        
        /* RESPONSIF HP (Sembunyikan kolom yg kurang penting di layar kecil) */
        @media (max-width: 640px) {
            .hide-on-mobile { display: none; }
            .card { padding: 16px; }
            td { padding: 12px; }
        }

        /* NOTIFIKASI POPUP */
        #toast { position: fixed; bottom: 20px; right: 20px; background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 14px 20px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); transform: translateY(150%); transition: 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 50; font-weight: 500; font-size: 14px; }
        #toast.show { transform: translateY(0); }
    </style>
</head>
<body>

<div class="container">
    <!-- WADAH 1: MESIN GENERATE -->
    <div class="card">
        <div class="card-title" style="margin-bottom: 24px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
            Buat Batch Baru
        </div>
        <form class="form-grid" id="batchForm" onsubmit="generateBatch(event)">
            <div class="form-group"><label>Nama Klien / Pembeli</label><input type="text" id="klien" placeholder="Contoh: PT Dakreativ" required></div>
            <div class="form-group"><label>Nomor WA Klien</label><input type="number" id="wa" placeholder="0812..." required></div>
            <div class="form-group"><label>Jumlah Kartu</label><input type="number" id="jumlah" min="1" max="100" value="1" required></div>
            <button type="submit" class="btn" id="btnSubmit">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Buat & Download
            </button>
        </form>
    </div>

    <!-- WADAH 2: DATA KARTU -->
    <div class="card">
        <div class="card-header">
            <div class="card-title">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                Database Kartu
            </div>
            <!-- INPUT PENCARIAN -->
            <div class="search-box">
                <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchInput" placeholder="Cari ID, Klien, atau Pemilik..." oninput="handleSearch(event)">
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID Produk</th>
                        <th>Status</th>
                        <th>Nama Pemilik (End-User)</th>
                        <th class="hide-on-mobile">Tgl Terisi</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr><td colspan="4" style="text-align: center; color: var(--text-muted);">Memuat data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
    // KONEKSI DATABASE
    const supabaseUrl = 'https://bkxclrjycsdpchodgzzb.supabase.co';
    const supabaseKey = 'sb_publishable_F9D19Umk_ofD3bwZDP5sng_O4kSsG_3';
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
    const DOMAIN_WEB_CARD = "https://dkrtv.vercel.app/card/index.html?id="; 

    let allDatabaseData = []; // Simpan semua data di sini biar gampang dicari

    function showToast(msg, isError=false) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.style.borderLeft = isError ? "4px solid #ef4444" : "4px solid #22c55e";
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3500);
    }

    // FUNGSI MEMUAT SEMUA DATA & MENAMPILKANNYA
    async function loadOrders() {
        try {
            // Ambil SEMUA kartu (baik yg kosong maupun terisi) dari yg terbaru
            const { data, error } = await supabaseClient.from('cards').select('*').order('tgl_order', { ascending: false });
            
            if (error) throw error;
            
            allDatabaseData = data || [];
            renderTable(allDatabaseData); // Jalankan fungsi render
        } catch (err) {
            document.getElementById('table-body').innerHTML = '<tr><td colspan="4" style="text-align:center; color:#ef4444;">Gagal memuat data dari server.</td></tr>';
        }
    }

    // FUNGSI RENDER TABEL (DENGAN GROUPING KLIENT)
    function renderTable(dataToRender) {
        const tbody = document.getElementById('table-body');
        
        if (dataToRender.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color: var(--text-muted);">Data tidak ditemukan.</td></tr>';
            return;
        }

        // 1. Kelompokkan data berdasarkan klien_pembeli
        const groupedData = dataToRender.reduce((acc, item) => {
            const klien = item.klien_pembeli || 'Tanpa Klien / Sistem';
            if (!acc[klien]) acc[klien] = [];
            acc[klien].push(item);
            return acc;
        }, {});

        // 2. Susun HTML-nya
        let html = '';
        for (const [klien, cards] of Object.entries(groupedData)) {
            // Header Grup
            html += `
                <tr class="group-header">
                    <td colspan="4">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:6px; vertical-align:middle; opacity:0.6;"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                        Klien Pembeli: <strong>${klien}</strong> 
                        <span style="opacity:0.6; font-weight:normal; margin-left:6px;">(${cards.length} kartu)</span>
                    </td>
                </tr>
            `;
            
            // Baris Kartu
            cards.forEach(item => {
                const badgeClass = item.status === 'Terisi' ? 'status-terisi' : 'status-kosong';
                const tgl = item.tgl_aktivasi ? new Date(item.tgl_aktivasi).toLocaleDateString('id-ID') : '-';
                
                html += `
                    <tr>
                        <td class="id-text">${item.id_produk}</td>
                        <td><span class="status-badge ${badgeClass}">${item.status}</span></td>
                        <td>${item.nama_pemilik || '<span style="color:var(--text-muted);font-style:italic;">Belum diaktifkan</span>'}</td>
                        <td class="hide-on-mobile">${tgl}</td>
                    </tr>
                `;
            });
        }

        tbody.innerHTML = html;
    }

    // FUNGSI PENCARIAN WAKTU NGETIK KOTAK SEARCH
    function handleSearch(e) {
        const keyword = e.target.value.toLowerCase();
        
        const filteredData = allDatabaseData.filter(item => {
            const matchId = item.id_produk && item.id_produk.toLowerCase().includes(keyword);
            const matchKlien = item.klien_pembeli && item.klien_pembeli.toLowerCase().includes(keyword);
            const matchPemilik = item.nama_pemilik && item.nama_pemilik.toLowerCase().includes(keyword);
            return matchId || matchKlien || matchPemilik;
        });

        renderTable(filteredData);
    }

    // MESIN UTAMA GENERATE (NGGAK ADA YANG BERUBAH)
    async function generateBatch(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        btn.disabled = true; 
        btn.innerHTML = "Processing...";

        try {
            const klien = document.getElementById('klien').value;
            const wa = document.getElementById('wa').value;
            const jumlah = parseInt(document.getElementById('jumlah').value);
            const newRows = [];
            const generatedIds = [];
            const prefix = "DAD-" + Math.floor(100000 + Math.random() * 900000);

            for (let i = 1; i <= jumlah; i++) {
                const id = `${prefix}-${i.toString().padStart(2, '0')}`;
                generatedIds.push(id);
                newRows.push({ id_produk: id, klien_pembeli: klien, wa_klien: wa, status: "Kosong" });
            }

            const { error } = await supabaseClient.from('cards').insert(newRows);
            if(error) throw new Error("Gagal nyimpen ke database: " + error.message);

            btn.innerHTML = "Membuat ZIP...";
            
            const zip = new JSZip();
            
            for (let i = 0; i < generatedIds.length; i++) {
                const id = generatedIds[i];
                const qr = new QRious({ value: DOMAIN_WEB_CARD + id, size: 400, level: 'H' });
                const canvas = document.createElement('canvas');
                canvas.width = 400; canvas.height = 460;
                const ctx = canvas.getContext('2d');
                
                ctx.fillStyle = '#ffffff'; 
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                const img = new Image();
                
                const drawPromise = new Promise((resolve, reject) => {
                    img.onload = () => {
                        ctx.drawImage(img, 0, 0);
                        ctx.fillStyle = '#000000'; 
                        ctx.font = 'bold 24px Inter, sans-serif'; 
                        ctx.textAlign = 'center';
                        ctx.fillText(id, canvas.width / 2, 435);
                        resolve();
                    };
                    img.onerror = () => reject(new Error("Gagal menggambar QR Code"));
                });

                img.src = qr.toDataURL();
                await drawPromise;

                const base64Data = canvas.toDataURL('image/png').split(',')[1];
                zip.file(`${id}.png`, base64Data, {base64: true});
            }

            const amanKlien = klien.replace(/[^a-zA-Z0-9]/g, '_');
            const content = await zip.generateAsync({type:"blob"});
            
            saveAs(content, `Batch_${amanKlien}_${jumlah}pcs.zip`);
            
            showToast("Berhasil generate dan download ZIP!");
            document.getElementById('batchForm').reset();
            
            // Muat ulang tabel dan bersihkan pencarian
            document.getElementById('searchInput').value = '';
            loadOrders(); 

        } catch (err) {
            console.error(err);
            showToast("ERROR: " + err.message, true);
        } finally {
            btn.disabled = false; 
            btn.innerHTML = "Buat & Download";
        }
    }

    // Jalankan pertama kali saat web dibuka
    window.onload = loadOrders;
</script>
</body>
</html>
