<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Dakreativ</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #121212; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn { background: #007bff; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { background: #555; cursor: not-allowed; }
        
        /* Table Styles */
        table { width: 100%; border-collapse: collapse; background: #1e1e1e; border-radius: 8px; overflow: hidden; margin-top: 15px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #333; font-size: 14px; }
        th { background: #252525; color: #aaa; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-kosong { background: #ff4d4d; color: white; }
        .badge-terisi { background: #28a745; color: white; }

        /* Modal Backdrop */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        
        /* Modal Box */
        .modal { background: #ffffff; color: #333; padding: 25px; border-radius: 12px; width: 100%; max-width: 400px; }
        .modal h3 { margin-top: 0; color: #111; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 13px; font-weight: bold; color: #555; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .modal-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .btn-black { background: #000; color: #fff; width: 100%; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-cancel { background: transparent; color: #666; border: none; cursor: pointer; text-align: center; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>Data Order & Batch QR</h2>
            <button class="btn" onclick="openModal()">+ Buat Batch Baru</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID Produk</th>
                    <th>Klien Pembeli</th>
                    <th>WA Klien</th>
                    <th>Tgl Order</th>
                    <th>Pemilik Kartu</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <tr><td colspan="6" style="text-align: center; color: #888;">Memuat data...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Modal Form -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h3>Buat Batch Baru</h3>
            <form id="batchForm" onsubmit="submitBatch(event)">
                <div class="form-group">
                    <label>Nama Klien / Pembeli</label>
                    <input type="text" id="klienPembeli" placeholder="Contoh: Budi" required>
                </div>
                <div class="form-group">
                    <label>WhatsApp Klien</label>
                    <input type="text" id="waKlien" placeholder="Contoh: 08123456789" required>
                </div>
                <div class="form-group">
                    <label>Jumlah QR / ID</label>
                    <input type="number" id="jumlah" min="1" max="100" value="1" required>
                </div>
                
                <div class="modal-actions">
                    <button type="submit" class="btn-black" id="btnSubmit">Proses ke Database</button>
                    <button type="button" class="btn-cancel" onclick="closeModal()">Batal</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // GANTI URL INI DENGAN URL WEB APP GOOGLE APPS SCRIPT KAMU
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxxKQCp8huU_pEJ2uOF3aYE30oYHo_3FYNXJ1pX2AEiHfiVO8LPZip8Z3e9uE8OPJquew/exec";

        // 1. Fetch Data Orderan untuk Tabel Admin
        function loadOrders() {
            fetch(`${SCRIPT_URL}?action=getOrders`)
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById('table-body');
                    if (!data || data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Belum ada data.</td></tr>';
                        return;
                    }

                    tbody.innerHTML = data.map(item => `
                        <tr>
                            <td><b>${item.idProduk}</b></td>
                            <td>${item.klienPembeli || '-'}</td>
                            <td>${item.waKlien || '-'}</td>
                            <td>${item.tglOrder || '-'}</td>
                            <td>${item.namaPemilik || '-'}</td>
                            <td><span class="badge badge-${(item.status || 'kosong').toLowerCase()}">${item.status || 'Kosong'}</span></td>
                        </tr>
                    `).join('');
                })
                .catch(err => {
                    console.error("Error loading orders:", err);
                    document.getElementById('table-body').innerHTML = '<tr><td colspan="6" style="text-align:center; color:red;">Gagal mengambil data dari server.</td></tr>';
                });
        }

        // 2. Submit Form Batch Baru (Penanganan CORS Fixed)
        function submitBatch(event) {
            event.preventDefault();
            
            const btnSubmit = document.getElementById('btnSubmit');
            btnSubmit.disabled = true;
            btnSubmit.innerText = "Memproses ke Database...";

            const payload = {
                action: "addBatchOrder",
                klienPembeli: document.getElementById('klienPembeli').value,
                waKlien: document.getElementById('waKlien').value,
                jumlah: document.getElementById('jumlah').value
            };

            // PERBAIKAN CORS: Menggunakan 'text/plain;charset=utf-8' mencegah browser memicu Preflight OPTIONS
            fetch(SCRIPT_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(res => {
                if (res.success) {
                    alert(`Berhasil! ${res.generatedIds ? res.generatedIds.length : ''} ID baru telah dibuat.`);
                    closeModal();
                    loadOrders(); // Refresh tabel
                } else {
                    alert("Gagal: " + (res.error || "Terjadi kesalahan."));
                }
            })
            .catch(err => {
                console.error("Error submitting batch:", err);
                alert("Terjadi kesalahan jaringan/server. Pastikan Apps Script sudah dideploy ulang sebagai Versi Baru.");
            })
            .finally(() => {
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Proses ke Database";
            });
        }

        function openModal() {
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.getElementById('batchForm').reset();
        }

        // Load data saat halaman dibuka
        window.onload = loadOrders;
    </script>
</body>
</html>
