<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dkrtv.google - QR Generator</title>
    <!-- Font modern dari Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --brand-color: #2563eb;
            --btn-dark: #111827;
            --btn-dark-hover: #374151;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main);
            margin: 0; 
            padding: 20px; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card { 
            background: var(--card-bg); 
            padding: 40px 32px; 
            border-radius: 24px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.04); 
            width: 100%;
            max-width: 400px; 
        }

        /* Branding */
        .brand {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 30px;
        }
        .brand span { color: var(--brand-color); }

        .form-group { margin-bottom: 20px; }
        
        .label-text {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input { 
            width: 100%; 
            padding: 14px 16px; 
            background: #f9fafb;
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            font-size: 15px; 
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease; 
            box-sizing: border-box; 
        }
        input:focus { 
            border-color: var(--brand-color); 
            outline: none; 
            background: #fff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        
        button { 
            font-family: 'Inter', sans-serif;
            border: none; 
            padding: 14px 20px; 
            cursor: pointer; 
            border-radius: 12px; 
            font-size: 15px; 
            font-weight: 600; 
            width: 100%; 
            transition: all 0.2s ease; 
            box-sizing: border-box; 
        }
        
        .btn-outline { 
            background: #fff; 
            color: var(--text-main); 
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
        }
        .btn-outline:hover { background: #f9fafb; border-color: #d1d5db; }
        
        .btn-primary { 
            background: var(--btn-dark); 
            color: white; 
            margin-top: 10px; 
        }
        .btn-primary:hover { background: var(--btn-dark-hover); transform: translateY(-1px); }

        /* Area Hasil QR */
        #resultArea {
            display: none;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid var(--border-color);
            text-align: center;
        }

        .qr-wrapper {
            background: #fff;
            padding: 16px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            display: inline-block;
            margin-bottom: 16px;
        }

        .qr-wrapper img {
            display: block;
            border-radius: 8px;
            width: 200px;
            height: 200px;
        }

        .qr-code-text {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            margin-top: 12px;
            letter-spacing: 1px;
        }

        /* Tombol Tester */
        .btn-test {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #eff6ff;
            color: var(--brand-color);
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-test:hover {
            background: #dbeafe;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="brand">dkrtv.<span>google</span></div>
    
    <button class="btn-outline" onclick="window.open('https://productmate.com/id/developers/google-review-link', '_blank')">
        1. Buka ProductMate (Get Link)
    </button>

    <div class="form-group">
        <label class="label-text">Link Review Google</label>
        <input type="url" id="linkInput" placeholder="Paste link dari ProductMate...">
    </div>

    <div class="form-group">
        <label class="label-text">ID / Nama Klien</label>
        <input type="text" id="kodeInput" placeholder="Contoh: TOKO MAJU (Opsional)">
    </div>

    <button class="btn-primary" onclick="generateQR()">Generate Barcode</button>

    <!-- Hasil QR Code -->
    <div id="resultArea">
        <div class="qr-wrapper" id="qrCaptureArea">
            <div id="qrcodeImg"></div>
            <div id="qrLabel" class="qr-code-text"></div>
        </div>
        
        <div>
            <!-- Tombol Test Link -->
            <a href="#" target="_blank" id="testBtn" class="btn-test">
                🔗 Test Link (Buka Popup)
            </a>
        </div>
        <p style="font-size: 12px; color: var(--text-muted); margin-top: 16px;">
            Screenshot area kotak QR di atas untuk dikirim ke klien.
        </p>
    </div>
</div>

<script>
    function generateQR() {
        var linkVal = document.getElementById("linkInput").value.trim();
        var kodeVal = document.getElementById("kodeInput").value.trim();

        if (!linkVal) {
            alert("Harap masukkan link review terlebih dahulu!");
            return;
        }

        // Auto-generate kode jika dikosongkan
        if (!kodeVal) {
            kodeVal = "INV-" + Math.floor(1000 + Math.random() * 9000);
        }

        // Buat URL API QR Code
        var apiUrl = "https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=10&data=" + encodeURIComponent(linkVal);
        
        // Tampilkan gambar dan teks
        document.getElementById("qrcodeImg").innerHTML = "<img src='" + apiUrl + "' alt='QR Code'>";
        document.getElementById("qrLabel").innerText = kodeVal;
        
        // Setup tombol Tester
        var testBtn = document.getElementById("testBtn");
        testBtn.href = linkVal; // Masukkan link ke tombol
        
        // Tampilkan area hasil
        document.getElementById("resultArea").style.display = "block";
    }
</script>

</body>
</html>
