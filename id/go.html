<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akses Galeri</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F8FAFC; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { text-align: center; background: white; padding: 40px 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 90%; max-width: 400px; }
        .hidden { display: none !important; }
        
        /* Animasi Loading */
        .loader { border: 4px solid #E2E8F0; border-top: 4px solid #2563EB; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        h3 { color: #0F172A; margin: 0 0 10px 0; font-weight: 800; font-size: 22px; }
        p { color: #64748B; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
        
        /* Input & Button Modern */
        input { width: 100%; padding: 15px; margin-bottom: 15px; border: 1.5px solid #E2E8F0; border-radius: 12px; box-sizing: border-box; font-size: 15px; font-weight: 700; text-align: center; outline: none; transition: 0.3s; }
        input:focus { border-color: #2563EB; box-shadow: 0 0 0 4px #EFF6FF; }
        button { background: #0F172A; color: white; border: none; padding: 15px; border-radius: 12px; cursor: pointer; width: 100%; font-weight: 700; font-size: 15px; transition: 0.3s; }
        button:hover { background: #1E293B; transform: translateY(-2px); }
        .error-msg { color: #EF4444; font-size: 13px; margin-top: 10px; font-weight: 700; display: none; }
    </style>
</head>
<body>

    <!-- Box 1: Loading Animasi (Menutupi delay dari Google Script) -->
    <div class="container" id="loadingBox">
        <div class="loader"></div>
        <h3>Membuka Akses...</h3>
        <p>Sistem sedang mengambil data galeri Anda.</p>
    </div>

    <!-- Box 2: Input Password (Hanya muncul jika tipe 'Event') -->
    <div class="container hidden" id="passwordBox">
        <h3 id="greetName">Halo!</h3>
        <p>Silakan masukkan kode akses (kunci) dari admin untuk membuka galeri dokumentasi.</p>
        <input type="password" id="inputPass" placeholder="Masukkan Kunci Akses">
        <button onclick="checkPassword()">Buka Galeri</button>
        <div id="errorMsg" class="error-msg">❌ Kunci akses salah, coba lagi!</div>
    </div>

    <!-- Box 3: Error Box (Jika barcode salah/dihapus) -->
    <div class="container hidden" id="errorBox">
        <h3 style="color: #EF4444;">Oops! 💔</h3>
        <p id="errorText">Barcode tidak valid atau data galeri belum tersedia.</p>
    </div>

    <script>
        // 1. PASTE LINK WEB APP GOOGLE APPS SCRIPT LU DI SINI
        const GAS_URL = "https://script.google.com/macros/library/d/1aJUb3usLbG7SrHGU1WjUKuEZsbmkRlpkrkeSkz282G6QGdqwZif4A-BN/2"; 
        
        // 2. Ambil ID dari URL (?id=dadan01)
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('id');

        let targetDriveUrl = "";
        let correctPass = "";

        if(orderId) {
            // Tarik data ke Google Sheet
            fetch(GAS_URL + "?id=" + orderId)
            .then(res => res.json())
            .then(data => {
                // Sembunyikan loading
                document.getElementById('loadingBox').classList.add('hidden');

                if(data.status === 'success') {
                    targetDriveUrl = data.folder_url;
                    
                    if(data.tipe === 'Event') {
                        // Tipe Event -> Tampilkan Pop-Up Password
                        correctPass = data.password;
                        document.getElementById('greetName').innerText = "Halo, " + data.name + " ✨";
                        document.getElementById('passwordBox').classList.remove('hidden');
                    } else {
                        // Tipe Info/Affiliate -> Langsung buka Drive tanpa babibu
                        window.location.href = targetDriveUrl;
                    }
                } else {
                    document.getElementById('errorBox').classList.remove('hidden');
                }
            }).catch(err => {
                document.getElementById('loadingBox').classList.add('hidden');
                document.getElementById('errorText').innerText = "Terjadi gangguan jaringan, silakan muat ulang.";
                document.getElementById('errorBox').classList.remove('hidden');
            });
        } else {
            document.getElementById('loadingBox').classList.add('hidden');
            document.getElementById('errorText').innerText = "Silakan scan Barcode atau akses melalui link yang sah.";
            document.getElementById('errorBox').classList.remove('hidden');
        }

        // 3. Fungsi Cek Password dari tombol
        function checkPassword() {
            const userInput = document.getElementById('inputPass').value;
            if(userInput === correctPass) {
                // Jika password benar, ubah tulisan tombol dan langsung ke Drive
                document.querySelector('button').innerText = "Mengalihkan...";
                window.location.href = targetDriveUrl;
            } else {
                document.getElementById('errorMsg').style.display = "block";
                document.getElementById('inputPass').value = ""; // Kosongkan input
            }
        }

        // 4. Enter di keyboard auto-submit password
        document.getElementById('inputPass').addEventListener("keypress", function(e) {
            if(e.key === "Enter") checkPassword();
        });
    </script>
</body>
</html>
