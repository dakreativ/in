<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mengarahkan...</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #ffffff; font-family: sans-serif; margin: 0; text-align: center; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #000; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="status"><div class="loader"></div><h3 style="color:#666;">Sedang memproses...</h3></div>

<script>
    const supabaseUrl = 'https://bkxclrjycsdpchodgzzb.supabase.co';
    const supabaseKey = 'sb_publishable_F9D19Umk_ofD3bwZDP5sng_O4kSsG_3';
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    const idQR = new URLSearchParams(window.location.search).get('id');

    async function proses() {
        if (!idQR) return document.getElementById('status').innerHTML = 'QR Tidak Valid.';
        
        const { data, error } = await supabaseClient.from('dynamic_links').select('target_url').eq('qr_id', idQR).single();
        
        if (error || !data) return document.getElementById('status').innerHTML = 'QR Code tidak terdaftar.';
        if (data.target_url && data.target_url.trim() !== "") {
            window.location.replace(data.target_url); // Langsung pindah lokasi
        } else {
            document.getElementById('status').innerHTML = 'Pemilik belum mengatur link tujuan QR ini.';
        }
    }
    proses();
</script>
</body>
</html>
