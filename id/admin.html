<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace Admin</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #0F172A; color: white; margin: 0; padding: 20px; }
        .hidden { display: none !important; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px; padding: 25px; margin-bottom: 20px; }
        h2 { margin-top: 0; color: #38BDF8; }
        input, select { width: 100%; background: #1E293B; border: 1px solid #475569; color: white; padding: 12px; border-radius: 8px; box-sizing: border-box; margin-bottom: 15px; }
        button { background: #38BDF8; color: #0F172A; font-weight: bold; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 5px; }
        button:hover { background: #0EA5E9; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { padding: 12px; border-bottom: 1px solid #334155; text-align: left; }
        th { color: #94A3B8; }
        .badge-kosong { background: #FCA5A5; color: #7F1D1D; padding: 4px 8px; border-radius: 5px; font-size: 11px; }
        .badge-aktif { background: #86EFAC; color: #14532D; padding: 4px 8px; border-radius: 5px; font-size: 11px; }
        .flex-row { display: flex; gap: 15px; }
        .flex-row > div { flex: 1; }
        #qr-container { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 20px; justify-content: center; }
        .qr-wrapper { background: white; padding: 15px; border-radius: 10px; text-align: center; color: black; font-weight: bold; font-size: 13px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .qr-box { margin: 0 auto 10px; display: flex; justify-content: center; }
        .btn-dl { background: #10B981; color: white; padding: 8px; font-size: 12px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- LOGIN -->
        <div id="loginSection" class="card" style="max-width: 400px; margin: 100px auto; text-align: center;">
            <h2>Admin Login</h2>
            <input type="password" id="adminPass" placeholder="Password Rahasia" value="Tetydadan21@">
            <button onclick="doLogin()">Masuk Workspace</button>
        </div>

        <!-- DASHBOARD -->
        <div id="dashboardSection" class="hidden">
            <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                <h1 style="margin: 0;">Workspace <span style="color:#38BDF8;">Admin</span></h1>
                <button onclick="logout()" style="width: auto; background: transparent; border: 1px solid #EF4444; color: #EF4444; padding: 8px 15px;">Keluar</button>
            </div>

            <!-- FORM GENERATE -->
            <div class="card">
                <h2>+ Generate Barcode Baru</h2>
                <div class="flex-row">
                    <div><label>Prefix ID Barcode</label><input type="text" id="orderId" placeholder="cth: KAFE-01" oninput="this.value=this.value.replace(/\s+/g, '').toUpperCase()"></div>
                    <div>
                        <label>Tipe Order</label>
                        <select id="orderType" onchange="toggleBulk()">
                            <option value="Single">1 Barcode (Setup Oleh Klien Saat Scan)</option>
                            <option value="Bulk">Banyak Barcode (Langsung Aktif/Kunci)</option>
                        </select>
                    </div>
                </div>

                <div id="bulkInputs" style="display:none; background: #0B1120; padding: 15px; border-radius: 10px; margin-bottom: 15px;">
                    <div class="flex-row">
                        <div><label>Nama Bisnis</label><input type="text" id="bulkName" placeholder="cth: Kafe Senja"></div>
                        <div><label>Jumlah Barcode</label><input type="number" id="bulkQty" placeholder="cth: 20"></div>
                    </div>
                    <label>Link Google Drive (Akses: Siapa Saja)</label><input type="text" id="bulkDrive">
                </div>

                <button id="btnGen" onclick="generateOrder()">Generate Barcode</button>
                <div id="qr-container"></div>
            </div>

            <!-- TABEL DATABASE -->
            <div class="card">
                <h2 style="display:flex; justify-content:space-between;">Database Barcode <button onclick="loadData()" style="width:auto; padding:5px 10px; font-size:12px;">🔄 Refresh</button></h2>
                <div style="overflow-x: auto;">
                    <table>
                        <thead><tr><th>ID</th><th>Tipe</th><th>Nama Bisnis</th><th>Status</th><th>Aksi</th></tr></thead>
                        <tbody id="tabel"><tr><td colspan="5" style="text-align: center;">Memuat data...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==============================================
        // GANTI INI DENGAN URL DEPLOYMENT GAS ANDA
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxS2Xad3FCI7YL2xvjJ8v6cXq_oa0l1Drj4RnzqEtbtwiHVuC90xFS-HcoDsnDL438BSQ/exec"; 
        // ==============================================
        
        // Memastikan link barcode diarahkan ke index.html, bukan admin.html
        const WEB_URL = window.location.origin + window.location.pathname.replace('admin.html', 'index.html'); 
        
        let currentPass = sessionStorage.getItem('adminPass');
        if (currentPass) showDashboard();

        function doLogin() { currentPass = document.getElementById('adminPass').value; if(currentPass) { sessionStorage.setItem('adminPass', currentPass); showDashboard(); } }
        function logout() { sessionStorage.removeItem('adminPass'); location.reload(); }
        function showDashboard() { document.getElementById('loginSection').classList.add('hidden'); document.getElementById('dashboardSection').classList.remove('hidden'); loadData(); }
        function toggleBulk() { document.getElementById('bulkInputs').style.display = document.getElementById('orderType').value === 'Bulk' ? 'block' : 'none'; }

        function generateOrder() {
            const btn = document.getElementById('btnGen');
            const tipe = document.getElementById('orderType').value;
            const orderId = document.getElementById('orderId').value;
            
            if(!orderId) return alert("ID Barcode Wajib Diisi!");
            btn.disabled = true; btn.innerText = "Processing...";

            // KIRIM PAKAI URLSearchParams (ANTI-CORS)
            const formData = new URLSearchParams();
            formData.append('action', 'create_order');
            formData.append('pass', currentPass);
            formData.append('prefix_id', orderId);
            formData.append('tipe', tipe);
            formData.append('nama', document.getElementById('bulkName').value);
            formData.append('qty', document.getElementById('bulkQty').value);
            formData.append('drive', document.getElementById('bulkDrive').value);
            
            fetch(GAS_URL, { 
                method: 'POST', 
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: formData 
            })
            .then(r => r.json())
            .then(d => {
                btn.disabled = false; btn.innerText = "Generate Barcode";
                if(d.status === 'success') {
                    loadData();
                    document.getElementById('qr-container').innerHTML = '';
                    let qty = document.getElementById('bulkQty').value || 1;
                    if(tipe === 'Single') bikinQR(orderId);
                    else for(let i=1; i<=qty; i++) bikinQR(orderId + '-' + i);
                    
                    document.getElementById('orderId').value = '';
                    document.getElementById('bulkName').value = '';
                    document.getElementById('bulkQty').value = '';
                    document.getElementById('bulkDrive').value = '';
                } else alert(d.message);
            }).catch(err => { 
                btn.disabled = false; btn.innerText = "Generate Barcode"; 
                alert("Error Server/Koneksi."); console.error(err);
            });
        }

        function bikinQR(id) {
            const wrapper = document.createElement('div'); wrapper.className = 'qr-wrapper';
            const qrBox = document.createElement('div'); qrBox.className = 'qr-box'; qrBox.id = 'qr-' + id;
            new QRCode(qrBox, { text: WEB_URL + "?id=" + id, width: 130, height: 130 });
            
            const teksId = document.createElement('div'); teksId.innerText = "ID: " + id;
            const btnDl = document.createElement('button'); btnDl.className = 'btn-dl'; btnDl.innerText = '⬇️ Download QR';
            btnDl.onclick = function() {
                const canvas = qrBox.querySelector('canvas');
                if(canvas) {
                    const link = document.createElement('a'); link.href = canvas.toDataURL("image/png");
                    link.download = 'Barcode_' + id + '.png'; link.click();
                }
            };
            wrapper.appendChild(qrBox); wrapper.appendChild(teksId); wrapper.appendChild(btnDl);
            document.getElementById('qr-container').appendChild(wrapper);
        }

        function loadData() {
            document.getElementById('tabel').innerHTML = '<tr><td colspan="5" style="text-align: center;">Memuat data...</td></tr>';
            fetch(`${GAS_URL}?action=get_all&pass=${encodeURIComponent(currentPass)}`)
            .then(r => r.json())
            .then(d => {
                if(d.status === 'error') { alert(d.message); if(d.message === 'Password salah!') logout(); return; }
                let html = '';
                d.data.forEach(x => { 
                    let badge = x.status === 'Kosong' ? 'badge-kosong' : 'badge-aktif';
                    let targetUrl = WEB_URL + "?id=" + x.id;
                    html += `<tr><td>${x.id}</td><td>${x.tipe}</td><td>${x.nama || '-'}</td><td><span class="${badge}">${x.status}</span></td>
                             <td><button style="background:transparent; border:1px solid #10B981; color:#10B981; padding:5px 10px; font-size:11px;" onclick="window.open('${targetUrl}')">Buka Web</button></td></tr>`; 
                });
                document.getElementById('tabel').innerHTML = html || '<tr><td colspan="5" style="text-align:center;">Belum ada data.</td></tr>';
            }).catch(err => { document.getElementById('tabel').innerHTML = '<tr><td colspan="5" style="text-align:center; color:red;">Koneksi Error / Gagal parsing JSON.</td></tr>'; });
        }
    </script>
</body>
</html>
