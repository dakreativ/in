<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Libraries untuk Generate QR dan ZIP di Browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <style>
        :root { --bg: #09090b; --surface: #18181b; --border: #27272a; --text: #fafafa; --text-muted: #a1a1aa; --primary: #ffffff; --primary-invert: #000000; }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
        
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
        .card-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }
        
        /* Grid Form Generator */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 12px; align-items: end; }
        @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
        
        .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; outline: none; transition: 0.2s; }
        .form-group input:focus { border-color: var(--text-muted); }
        
        .btn { background: var(--primary); color: var(--primary-invert); border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; height: 43px; }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Table */
        .table-wrapper { overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; text-align: left; }
        th { color: var(--text-muted); padding-bottom: 12px; border-bottom: 1px solid var(--border); font-weight: 500; }
        td { padding: 16px 0; border-bottom: 1px solid var(--border); }
        tr:last-child td { border-bottom: none; }
        
        .status-badge { background: rgba(34, 197, 94, 0.1); color: #22c55e; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 1px solid rgba(34, 197, 94, 0.2); }
        
        #toast { position: fixed; bottom: 20px; right: 20px; background: var(--surface); border: 1px solid var(--border); padding: 14px 20px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transform: translateY(150%); transition: 0.3s; z-index: 50; }
        #toast.show { transform: translateY(0); }
    </style>
</head>
<body>

<div class="container">
    <!-- Generator Section -->
    <div class="card">
        <div class="card-title">
            <span>📦 Generate Batch Baru (ZIP)</span>
        </div>
        <form class="form-grid" id="batchForm" onsubmit="generateBatch(event)">
            <div class="form-group">
                <label>Nama Klien</label>
                <input type="text" id="klien" placeholder="Cth: Budi" required>
            </div>
            <div class="form-group">
                <label>Nomor WA</label>
                <input type="number" id="wa" placeholder="0812..." required>
            </div>
            <div class="form-group">
                <label>Jumlah Barcode</label>
                <input type="number" id="jumlah" min="1" max="100" value="1" required>
            </div>
            <button type="submit" class="btn" id="btnSubmit">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Buat & Unduh ZIP
            </button>
        </form>
    </div>

    <!-- Data Teraktivasi Section -->
    <div class="card">
        <div class="card-title">✨ Kartu Teraktivasi</div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID Produk</th>
                        <th>Pembeli</th>
                        <th>Nama Terdaftar (Pemilik)</th>
                        <th>Tgl Aktivasi</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr><td colspan="5" style="text-align: center; color: var(--text-muted);">Memuat data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
    // MASUKKAN LINK GOOGLE APPS SCRIPT LO DI SINI
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxxKQCp8huU_pEJ2uOF3aYE30oYHo_3FYNXJ1pX2AEiHfiVO8LPZip8Z3e9uE8OPJquew/exec";
    
    // GANTI LINK DOMAIN WEB DIGITAL CARD LO DI SINI
    const DOMAIN_WEB_CARD = "https://domain-kamu.com/?id="; 

    function showToast(msg, isError=false) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.style.borderLeft = isError ? "4px solid #ef4444" : "4px solid #22c55e";
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3500);
    }

    async function loadOrders() {
        try {
            const res = await fetch(`${SCRIPT_URL}?action=getOrders`);
            const data = await res.json();
            const tbody = document.getElementById('table-body');
            
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Belum ada kartu yang diaktivasi.</td></tr>';
                return;
            }

            tbody.innerHTML = data.map(item => `
                <tr>
                    <td style="font-family: monospace; color: #fff;">${item.idProduk}</td>
                    <td>${item.klienPembeli || '-'}</td>
                    <td style="font-weight: 500;">${item.namaPemilik || '-'}</td>
                    <td>${item.tglAktivasi || '-'}</td>
                    <td><span class="status-badge">Terisi</span></td>
                </tr>
            `).join('');
        } catch (err) {
            document.getElementById('table-body').innerHTML = '<tr><td colspan="5" style="text-align:center; color:#ef4444;">Koneksi terputus.</td></tr>';
        }
    }

    async function generateBatch(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        btn.disabled = true;
        btn.innerHTML = "Menyimpan ke Database...";

        const payload = {
            action: "addBatchOrder",
            klienPembeli: document.getElementById('klien').value,
            waKlien: document.getElementById('wa').value,
            jumlah: document.getElementById('jumlah').value
        };

        try {
            const res = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) });
            const result = await res.json();
            
            if(result.success) {
                btn.innerHTML = "Membuat ZIP & Barcode...";
                const zip = new JSZip();
                
                // Looping generate QR dari browser (Sangat Cepat)
                result.generatedIds.forEach(id => {
                    const qr = new QRious({
                        value: DOMAIN_WEB_CARD + id,
                        size: 500,
                        level: 'H'
                    });
                    const base64Data = qr.toDataURL().split(',')[1];
                    zip.file(`${id}.png`, base64Data, {base64: true});
                });

                const content = await zip.generateAsync({type:"blob"});
                saveAs(content, `Batch_${result.klien}_${result.generatedIds.length}pcs.zip`);
                
                showToast("Berhasil generate dan download ZIP!");
                document.getElementById('batchForm').reset();
            } else {
                showToast("Gagal: " + result.error, true);
            }
        } catch (err) {
            showToast("Error sistem jaringan.", true);
        } finally {
            btn.disabled = false;
            btn.innerHTML = "Buat & Unduh ZIP";
        }
    }

    window.onload = loadOrders;
</script>
</body>
</html>
