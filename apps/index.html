<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dakreativ AI - Video Prompts</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root { 
            --bg: #f8fafc; 
            --text-main: #0f172a; 
            --text-muted: #64748b; 
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg); 
            color: var(--text-main); 
            -webkit-font-smoothing: antialiased;
        }
        
        /* --- HEADER --- */
        header { text-align: center; padding: 60px 20px 40px; }
        header h1 { font-size: 32px; font-weight: 800; letter-spacing: -1px; }
        header p { color: var(--text-muted); font-size: 16px; margin-top: 8px; font-weight: 500; }
        
        /* --- GALLERY GRID --- */
        .gallery { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
            gap: 24px; 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 0 20px 80px; 
        }
        
        /* --- KARTU PORTRAIT (REELS STYLE) --- */
        .card { 
            position: relative;
            background: #000;
            border-radius: 24px; 
            overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            cursor: pointer;
            aspect-ratio: 9 / 16; /* Format Portrait Reels/Shorts */
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease; 
        }
        
        .card:hover { 
            transform: translateY(-8px) scale(1.02); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.15); 
        }
        
        /* Gambar Background */
        .card img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; /* Zoom agar gambar full */
            transition: transform 0.5s ease; 
            opacity: 0.85;
        }
        .card:hover img { transform: scale(1.08); opacity: 1; }

        /* Icon Play Tengah */
        .play-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 56px;
            height: 56px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 28px;
            border: 1px solid rgba(255,255,255,0.3);
            pointer-events: none;
            transition: 0.3s;
        }
        .card:hover .play-center { background: #ef4444; border-color: #ef4444; transform: translate(-50%, -50%) scale(1.1); }
        
        /* Gradient Overlay Bawah */
        .card-overlay { 
            position: absolute; 
            bottom: 0; left: 0; right: 0; 
            height: 60%;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 40%, transparent 100%);
            display: flex; 
            flex-direction: column; 
            justify-content: flex-end;
            padding: 24px 20px;
            pointer-events: none; /* Biar klik nembus ke kartu */
        }
        
        .card-title { 
            color: #ffffff;
            font-size: 18px; 
            font-weight: 800; 
            margin-bottom: 16px; 
            line-height: 1.3; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        /* Glassmorphism Box untuk Tombol Action */
        .action-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 12px 12px 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto; /* Mengaktifkan klik hanya untuk box ini */
        }

        .action-label {
            color: rgba(255,255,255,0.9);
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .action-label i { font-size: 16px; color: #60a5fa; }

        .btn-copy { 
            background: #ffffff; 
            color: #0f172a; 
            border: none; 
            padding: 10px 16px; 
            border-radius: 12px; 
            font-weight: 800; 
            font-size: 13px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            transition: 0.2s; 
            font-family: inherit;
        }
        .btn-copy:hover { transform: scale(1.05); box-shadow: 0 4px 12px rgba(255,255,255,0.2); }
        
        #loader { text-align: center; width: 100%; padding: 40px; color: var(--text-muted); font-weight: 600; grid-column: 1 / -1; }

        /* --- MODAL ZOOM PREVIEW --- */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s ease;
        }
        .modal.active { opacity: 1; visibility: visible; }
        
        .modal-content {
            width: 100%;
            max-width: 420px; /* Ukuran pas untuk portrait video */
            aspect-ratio: 9 / 16;
            background: #000;
            border-radius: 24px;
            position: relative;
            transform: scale(0.9);
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .modal.active .modal-content { transform: scale(1); }

        .close-btn {
            position: absolute;
            top: -50px;
            right: 0;
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: none;
            width: 40px; height: 40px;
            border-radius: 50%;
            font-size: 20px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .close-btn:hover { background: #ef4444; }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 24px;
        }

        /* Responsive Mobile */
        @media (max-width: 480px) {
            .gallery { grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 16px 40px; }
            .card-title { font-size: 14px; margin-bottom: 12px; }
            .action-box { padding: 8px; border-radius: 12px; flex-direction: column; gap: 8px; }
            .btn-copy { width: 100%; justify-content: center; padding: 8px; font-size: 12px; }
            .play-center { width: 40px; height: 40px; font-size: 20px; }
            .modal-content { max-width: 85vw; border-radius: 16px; }
            iframe { border-radius: 16px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>AI Video Database</h1>
        <p>Koleksi Referensi YouTube & Prompt AI Siap Copas.</p>
    </header>

    <div class="gallery" id="galleryContainer">
        <div id="loader"><i class="ph ph-spinner ph-spin" style="font-size: 24px; vertical-align: middle;"></i> Memuat inspirasi...</div>
    </div>

    <!-- Modal Zoom Preview -->
    <div class="modal" id="videoModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()"> <!-- Stop propagation biar ga nutup kalo diklik videonya -->
            <button class="close-btn" onclick="closeModal(event)"><i class="ph ph-x"></i></button>
            <iframe id="ytIframe" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyO_pvfm2Dtx30ZTq8gRCdT2l3Cg4g6WsKTZWBA-a8iUcu-In85PzyMAajl3wNcA56wCQ/exec";

        async function loadData() {
            const container = document.getElementById('galleryContainer');
            try {
                const response = await fetch(GAS_URL);
                const textResponse = await response.text(); 
                
                let data;
                try {
                    data = JSON.parse(textResponse);
                } catch (err) {
                    container.innerHTML = `<div id="loader" style="color:#ef4444;">Error Akses! Pastikan Google Apps Script diatur 'Siapa Saja'.</div>`;
                    return;
                }
                
                if(data.error) {
                    container.innerHTML = `<div id="loader" style="color:#ef4444;">Script Error: ${data.error}</div>`;
                    return;
                }
                
                container.innerHTML = '';
                
                if(!data || data.length === 0) {
                    container.innerHTML = '<div id="loader">Belum ada data. Tambahkan di halaman Admin.</div>';
                    return;
                }

                data.forEach(item => {
                    // Gunakan maxresdefault atau hqdefault untuk thumbnail
                    const thumbnailUrl = `https://img.youtube.com/vi/${item.ytId}/hqdefault.jpg`;
                    
                    const card = document.createElement('div');
                    card.className = 'card';
                    // Event onclick buka modal video
                    card.onclick = () => openModal(item.ytId);
                    
                    card.innerHTML = `
                        <img src="${thumbnailUrl}" alt="${item.title}" loading="lazy">
                        
                        <div class="play-center"><i class="ph-fill ph-play"></i></div>
                        
                        <div class="card-overlay">
                            <div class="card-title">${item.title}</div>
                            
                            <div class="action-box">
                                <div class="action-label"><i class="ph-fill ph-magic-wand"></i> Prompt</div>
                                <!-- Kirim event untuk stopPropagation biar modal ga kebuka pas diklik Salin -->
                                <button class="btn-copy" onclick="copyPrompt(event, \`${item.prompt.replace(/`/g, '\\`')}\`, this)">
                                    <i class="ph ph-copy"></i> Salin
                                </button>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                container.innerHTML = `<div id="loader" style="color:#ef4444;">Gagal memuat data. Periksa koneksi internet.</div>`;
            }
        }

        // Fungsi Salin Prompt
        function copyPrompt(event, text, btn) {
            event.stopPropagation(); // Mencegah klik kartu (Modal) kepicu saat klik tombol salin
            
            navigator.clipboard.writeText(text).then(() => {
                const originalHtml = btn.innerHTML;
                btn.innerHTML = '<i class="ph ph-check-circle"></i> Tersalin';
                btn.style.background = '#10b981';
                btn.style.color = '#fff';
                
                setTimeout(() => {
                    btn.innerHTML = originalHtml;
                    btn.style.background = '#ffffff';
                    btn.style.color = '#0f172a';
                }, 2000);
            });
        }

        // Fungsi Buka Modal Video
        function openModal(ytId) {
            const modal = document.getElementById('videoModal');
            const iframe = document.getElementById('ytIframe');
            // Autoplay di set 1 biar pas diklik langsung main
            iframe.src = `https://www.youtube.com/embed/${ytId}?autoplay=1`;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden'; // Kunci scroll background
        }

        // Fungsi Tutup Modal Video
        function closeModal(event) {
            if(event) event.stopPropagation();
            const modal = document.getElementById('videoModal');
            const iframe = document.getElementById('ytIframe');
            iframe.src = ''; // Hapus src untuk mematikan video
            modal.classList.remove('active');
            document.body.style.overflow = 'auto'; // Buka scroll background
        }

        window.onload = loadData;
    </script>
</body>
</html>
