<!DOCTYPE html>
<html lang="id">
<head>
    <title>Akses Galeri</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; background: #f8fafc; padding: 20px;}
        .card { background: white; padding: 20px; border-radius: 10px; max-width: 450px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1);}
        input { width: 100%; padding: 12px; margin-bottom: 15px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px;}
        button { background: #0F172A; color: white; padding: 12px; width: 100%; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;}
        .hidden { display: none !important; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 20px;}
        .grid img, .grid video { width: 100%; border-radius: 8px; aspect-ratio: 1; object-fit: cover;}
    </style>
</head>
<body>

    <h3 id="loadingText" style="text-align:center;">Memproses Barcode...</h3>

    <!-- 1. FORM SETUP PERTAMA KALI SCAN (Hanya muncul jika Status: Kosong) -->
    <div class="card hidden" id="setupBox">
        <h2 style="margin-top:0;">Setup Galeri</h2>
        <p style="font-size:14px; color:gray;">Masukkan data galeri. Setelah disimpan, barcode akan otomatis terkunci.</p>
        <label>Deskripsi Acara / Toko</label>
        <input type="text" id="setupDesc" placeholder="cth: Wedding Dadan">
        <label>Link Google Drive</label>
        <input type="text" id="setupDrive" placeholder="Akses wajib: Siapa Saja">
        <button onclick="submitSetup()">Simpan & Kunci Barcode</button>
    </div>

    <!-- 2. FORM PASSWORD UNTUK BUKA GALERI (Scan Ke-2 dst) -->
    <div class="card hidden" id="passBox">
        <h2 style="margin-top:0;" id="passTitle">Buka Galeri</h2>
        <input type="password" id="userPass" placeholder="Masukkan Password Galeri">
        <button onclick="cekPassword()">Buka Sekarang</button>
    </div>

    <!-- 3. FORM EDIT LINK (Khusus URL ?edit=xxx) -->
    <div class="card hidden" id="editBox">
        <h2 style="margin-top:0;">Edit Link Drive</h2>
        <input type="password" id="editPass" placeholder="Masukkan Password Klien">
        <input type="text" id="editDesc" placeholder="Deskripsi Baru">
        <input type="text" id="editDrive" placeholder="Link Drive Baru">
        <button onclick="submitEdit()">Update Link</button>
    </div>

    <!-- 4. GALERI FOTO -->
    <div class="card hidden" id="galleryBox" style="max-width: 800px;">
        <h2 id="gTitle" style="margin:0;"></h2>
        <p id="gDesc" style="color:gray; margin-top:5px;"></p>
        <div id="gridFoto" class="grid">Memuat foto dari Drive...</div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxS2Xad3FCI7YL2xvjJ8v6cXq_oa0l1Drj4RnzqEtbtwiHVuC90xFS-HcoDsnDL438BSQ/execI"; 
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('id');
        const editId = urlParams.get('edit');

        let dbPass = ""; let dbDrive = "";

        if(editId) {
            document.getElementById('loadingText').classList.add('hidden');
            document.getElementById('editBox').classList.remove('hidden');
        } else if(orderId) {
            fetch(GAS_URL + "?action=scan&id=" + orderId).then(r=>r.json()).then(data => {
                document.getElementById('loadingText').classList.add('hidden');
                
                if (data.status === 'success') {
                    dbPass = data.pass; dbDrive = data.drive;
                    document.getElementById('gTitle').innerText = data.nama;
                    document.getElementById('gDesc').innerText = data.desc;

                    if (data.is_locked === 'Kosong') {
                        document.getElementById('setupBox').classList.remove('hidden');
                    } else {
                        document.getElementById('passTitle').innerText = "Galeri " + data.nama;
                        document.getElementById('passBox').classList.remove('hidden');
                    }
                } else alert(data.message);
            });
        }

        function submitSetup() {
            fetch(GAS_URL, {
                method: 'POST', body: JSON.stringify({
                    action: 'first_setup', id: orderId, 
                    desc: document.getElementById('setupDesc').value, drive: document.getElementById('setupDrive').value
                })
            }).then(r=>r.json()).then(d => { alert("Berhasil Terkunci!"); location.reload(); });
        }

        function cekPassword() {
            if(document.getElementById('userPass').value !== dbPass) return alert("Password Salah!");
            document.getElementById('passBox').classList.add('hidden');
            document.getElementById('galleryBox').classList.remove('hidden');
            loadFoto(dbDrive);
        }

        function submitEdit() {
            fetch(GAS_URL, {
                method: 'POST', body: JSON.stringify({
                    action: 'edit_link', id: editId, pass_klien: document.getElementById('editPass').value,
                    desc: document.getElementById('editDesc').value, drive: document.getElementById('editDrive').value
                })
            }).then(r=>r.json()).then(d => alert(d.message));
        }

        function loadFoto(url) {
            fetch(GAS_URL + "?action=get_images&url=" + encodeURIComponent(url)).then(r=>r.json()).then(d => {
                let html = '';
                if(d.images) {
                    d.images.forEach(img => {
                        if(img.type.includes('image')) html += `<img src="${img.url}">`;
                        if(img.type.includes('video')) html += `<video src="${img.url}" controls></video>`;
                    });
                }
                document.getElementById('gridFoto').innerHTML = html;
            });
        }
    </script>
</body>
</html>
