<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akses Galeri</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F8FAFC; color: #0F172A; margin: 0; padding: 20px;}
        .hidden { display: none !important; }
        .container { max-width: 450px; margin: 5vh auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; }
        
        /* Animasi Muter */
        .loader { border: 4px solid #E2E8F0; border-top: 4px solid #2563EB; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        h2 { font-weight: 800; margin: 0 0 10px; color: #1E293B; }
        p { color: #64748B; font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
        
        label { text-align: left; display: block; font-size: 13px; font-weight: 700; color: #475569; margin: 15px 0 5px; }
        input { width: 100%; padding: 14px; border: 1.5px solid #E2E8F0; border-radius: 12px; box-sizing: border-box; outline: none; transition: 0.3s; font-family: inherit; }
        input:focus { border-color: #2563EB; box-shadow: 0 0 0 4px #EFF6FF; }
        button { background: #0F172A; color: white; border: none; padding: 15px; border-radius: 12px; font-weight: 800; cursor: pointer; width: 100%; transition: 0.3s; margin-top: 15px; }
        button:hover { background: #1E293B; transform: translateY(-2px); }
        
        /* Galeri */
        .gallery-wrap { max-width: 800px; margin: 0 auto; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-top: 20px; }
        .grid img, .grid video { width: 100%; border-radius: 12px; aspect-ratio: 1; object-fit: cover; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <!-- 1. LOADING CEK BARCODE -->
    <div class="container" id="loadingBox">
        <div class="loader"></div>
        <h2 id="loadingTxt">Memeriksa Akses...</h2>
    </div>

    <!-- 2. FORM KLAIM (Kalo Admin Bikin Tipe: Single) -->
    <div class="container hidden" id="setupBox">
        <h2>✨ Setup Link Drive</h2>
        <p>Halo <span id="sNama" style="font-weight:bold;"></span>, silakan masukkan link foto Anda. Barcode akan permanen terkunci setelah disimpan.</p>
        <label>Deskripsi Singkat / Judul</label>
        <input type="text" id="setupDesc" placeholder="cth: Katalog Kaos Vol. 1">
        <label>Link Folder Google Drive</label>
        <input type="text" id="setupDrive" placeholder="Pastikan Share = Siapa Saja (Anyone)">
        <button onclick="submitSetup()" id="btnSetup">Simpan & Aktifkan Barcode</button>
    </div>

    <!-- 3. FORM PASSWORD (Kalo Galeri Diproteksi) -->
    <div class="container hidden" id="passBox">
        <h2>🔒 Galeri Terkunci</h2>
        <p>Silakan masukkan password untuk melihat isi galeri ini.</p>
        <input type="password" id="userPass" placeholder="Ketik Password...">
        <button onclick="cekPassword()">Buka Galeri</button>
    </div>

    <!-- 4. HASIL GALERI FOTO -->
    <div class="gallery-wrap hidden" id="galleryBox">
        <h2 id="gTitle" style="font-size: 28px;"></h2>
        <p id="gDesc" style="color: #64748B; font-weight: 500;"></p>
        <div id="gLoader" class="loader"></div>
        <div id="gridFoto" class="grid"></div>
    </div>

    <script>
        // =======================================================
        // WAJIB GANTI LINK DI BAWAH INI SESUAI PUNYA LU BRO!
        // =======================================================
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxS2Xad3FCI7YL2xvjJ8v6cXq_oa0l1Drj4RnzqEtbtwiHVuC90xFS-HcoDsnDL438BSQ/exec"; 
        // =======================================================

        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('id');

        let dbPass = ""; let dbDrive = "";

        if(orderId) {
            fetch(GAS_URL + "?action=scan&id=" + orderId)
            .then(res => res.json())
            .then(data => {
                document.getElementById('loadingBox').classList.add('hidden');
                
                if (data.status === 'success') {
                    dbPass = data.pass; dbDrive = data.drive;
                    document.getElementById('gTitle').innerText = data.nama;
                    document.getElementById('gDesc').innerText = data.desc;

                    // KALO KOSONG -> Buka Form Setup (Khusus Tipe Single)
                    if (data.state === 'Kosong') {
                        document.getElementById('sNama').innerText = data.nama;
                        document.getElementById('setupBox').classList.remove('hidden');
                    } 
                    // KALO AKTIF -> Cek Password Dulu
                    else if (data.state === 'Aktif') {
                        if (dbPass) {
                            // Ada passwordnya, minta user input
                            document.getElementById('passBox').classList.remove('hidden');
                        } else {
                            // Gak ada password, langsung buka galeri
                            bukaGaleri();
                        }
                    }
                } else {
                    document.getElementById('loadingBox').classList.remove('hidden');
                    document.querySelector('.loader').style.display = 'none';
                    document.getElementById('loadingTxt').innerText = "❌ " + data.message;
                }
            }).catch(err => alert("Jaringan Error!"));
        } else {
            document.querySelector('.loader').style.display = 'none';
            document.getElementById('loadingTxt').innerText = "Silakan Scan Barcode yang Valid.";
        }

        // FUNGSI SIMPAN SETUP KLIEN
        function submitSetup() {
            const desc = document.getElementById('setupDesc').value;
            const drive = document.getElementById('setupDrive').value;
            const btn = document.getElementById('btnSetup');

            if(!desc || !drive) return alert("Deskripsi dan Link Drive harus diisi!");
            btn.disabled = true; btn.innerText = "Mengunci Barcode...";

            fetch(GAS_URL, {
                method: 'POST', body: JSON.stringify({ action: 'first_setup', id: orderId, desc: desc, drive: drive })
            }).then(r=>r.json()).then(d => {
                if(d.status === 'success') {
                    alert("Berhasil! Barcode sekarang aktif.");
                    window.location.reload(); // Otomatis refresh buat nampilin galeri
                } else {
                    alert(d.message); btn.disabled = false; btn.innerText = "Simpan & Aktifkan Barcode";
                }
            });
        }

        // FUNGSI CEK PASSWORD PENGUNJUNG
        function cekPassword() {
            if(document.getElementById('userPass').value !== dbPass) return alert("Password Salah!");
            document.getElementById('passBox').classList.add('hidden');
            bukaGaleri();
        }

        // FUNGSI LOAD GAMBAR GOOGLE DRIVE
        function bukaGaleri() {
            document.getElementById('galleryBox').classList.remove('hidden');
            
            fetch(GAS_URL + "?action=get_images&url=" + encodeURIComponent(dbDrive))
            .then(r=>r.json()).then(d => {
                document.getElementById('gLoader').style.display = 'none';
                let html = '';
                if(d.images && d.images.length > 0) {
                    d.images.forEach(img => {
                        if(img.type.includes('image')) html += `<img src="${img.url}">`;
                        else if(img.type.includes('video')) html += `<video src="${img.url}" controls></video>`;
                    });
                } else {
                    html = "<p style='grid-column:1/-1; color:red;'>Gagal memuat. Pastikan Akses Link Drive = Siapa Saja.</p>";
                }
                document.getElementById('gridFoto').innerHTML = html;
            });
        }
    </script>
</body>
</html>
