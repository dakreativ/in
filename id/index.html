<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akses Galeri Dokumentasi</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F4F7F6; color: #1E293B; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .hidden { display: none !important; }
        .card { background: #FFFFFF; width: 100%; max-width: 450px; padding: 35px 25px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.04); text-align: center; box-sizing: border-box; margin-top: 5vh; }
        .loading-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60vh; }
        .spinner { width: 50px; height: 50px; border: 4px solid #F1F5F9; border-top: 4px solid #3B82F6; border-radius: 50%; animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { font-size: 16px; font-weight: 800; color: #0F172A; transition: opacity 0.3s ease; }
        .progress-bar { width: 200px; height: 6px; background: #E2E8F0; border-radius: 10px; margin-top: 15px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: #3B82F6; transition: width 0.5s ease; border-radius: 10px; }
        h2 { font-weight: 800; margin: 0 0 8px; font-size: 24px; letter-spacing: -0.5px; }
        p { color: #64748B; font-size: 14px; margin-bottom: 25px; line-height: 1.6; }
        label { text-align: left; display: block; font-size: 13px; font-weight: 800; color: #334155; margin: 15px 0 8px; }
        input { width: 100%; padding: 16px; border: 2px solid #E2E8F0; border-radius: 14px; box-sizing: border-box; outline: none; transition: 0.3s; font-family: inherit; font-size: 14px; }
        input:focus { border-color: #3B82F6; background: #F8FAFC; }
        button { background: #0F172A; color: white; border: none; padding: 16px; border-radius: 14px; font-weight: 800; font-size: 15px; cursor: pointer; width: 100%; transition: 0.3s; margin-top: 20px; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15); }
        button:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(15, 23, 42, 0.2); }
        button:disabled { background: #94A3B8; cursor: not-allowed; box-shadow: none; transform: none; }
        .gallery-wrap { max-width: 1000px; width: 100%; margin: 0 auto; text-align: center; }
        .gallery-header { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #E2E8F0; }
        .gallery-header h2 { font-size: 32px; color: #0F172A; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; margin-top: 10px; }
        .grid img, .grid video { width: 100%; border-radius: 16px; aspect-ratio: 4/5; object-fit: cover; box-shadow: 0 4px 15px rgba(0,0,0,0.06); transition: 0.3s; cursor: pointer; }
        .grid img:hover { transform: scale(1.03); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <!-- 1. LOADING SCREEN -->
    <div class="loading-container" id="loadingBox">
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">Memindai Barcode...</div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <!-- 2. FORM SETUP KLIEN -->
    <div class="card hidden" id="setupBox">
        <h2>Setup Galeri ✨</h2>
        <p>Aktivasi barcode Anda dengan mengisi data di bawah. Setelah disimpan, pengunjung bisa langsung melihat galeri Anda.</p>
        <label>Nama Bisnis / Acara</label>
        <input type="text" id="setupNama" placeholder="Ketik nama di sini...">
        <label>Link Folder Google Drive</label>
        <input type="text" id="setupDrive" placeholder="Pastikan hak akses 'Siapa Saja (Public)'">
        <button onclick="submitSetup()" id="btnSetup">Aktifkan & Kunci Barcode</button>
    </div>

    <!-- 3. TAMPILAN GALERI -->
    <div class="gallery-wrap hidden" id="galleryBox">
        <div class="gallery-header">
            <h2 id="gTitle">Nama Galeri</h2>
            <p style="margin-bottom:0;">Dokumentasi & Katalog Resmi</p>
        </div>
        <div id="gridFoto" class="grid"></div>
    </div>

    <script>
        // ==============================================
        // ISI DENGAN URL DEPLOYMENT GAS TERBARU ANDA
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxS2Xad3FCI7YL2xvjJ8v6cXq_oa0l1Drj4RnzqEtbtwiHVuC90xFS-HcoDsnDL438BSQ/exec"; 
        // ==============================================
        
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('id');
        let dbDrive = "";

        const loadingMessages = ["Menghubungkan ke server...", "Memeriksa database...", "Memindai folder foto...", "Mempersiapkan galeri...", "Sedikit lagi selesai..."];
        let msgIndex = 0, progress = 5;

        const loadingInterval = setInterval(() => {
            msgIndex = (msgIndex + 1) % loadingMessages.length;
            const textEl = document.getElementById('loadingText');
            textEl.style.opacity = 0;
            setTimeout(() => { textEl.innerText = loadingMessages[msgIndex]; textEl.style.opacity = 1; }, 300);
        }, 1500);

        const progressInterval = setInterval(() => {
            if(progress < 90) progress += Math.random() * 10;
            document.getElementById('progressFill').style.width = progress + "%";
        }, 500);

        if(orderId) {
            fetch(`${GAS_URL}?action=scan&id=${orderId}`)
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    dbDrive = data.drive;
                    document.getElementById('gTitle').innerText = data.nama || "Galeri Foto";

                    if (data.state === 'Kosong') {
                        hentikanLoading();
                        document.getElementById('setupBox').classList.remove('hidden');
                    } else if (data.state === 'Aktif') {
                        bukaGaleri(); 
                    }
                } else { tampilkanError(data.message); }
            }).catch(err => tampilkanError("Gagal terhubung ke server."));
        } else {
            tampilkanError("Silakan Scan Barcode yang Valid.");
        }

        function hentikanLoading() {
            clearInterval(loadingInterval); clearInterval(progressInterval);
            document.getElementById('progressFill').style.width = "100%";
            setTimeout(() => { document.getElementById('loadingBox').classList.add('hidden'); }, 500);
        }

        function tampilkanError(pesan) {
            clearInterval(loadingInterval); clearInterval(progressInterval);
            document.querySelector('.spinner').style.display = 'none';
            document.querySelector('.progress-bar').style.display = 'none';
            document.getElementById('loadingText').innerHTML = `<span style="color:#EF4444; font-size:20px;">⚠️<br><br>${pesan}</span>`;
        }

        function submitSetup() {
            const nama = document.getElementById('setupNama').value;
            const drive = document.getElementById('setupDrive').value;
            const btn = document.getElementById('btnSetup');

            if(!nama || !drive) return alert("Semua kolom wajib diisi!");
            btn.disabled = true; btn.innerText = "Menyimpan Data...";

            // KUNCI ANTI-CORS BROWSER (Kirim POST sebagai Form, Bukan JSON)
            const formData = new URLSearchParams();
            formData.append('action', 'first_setup');
            formData.append('id', orderId);
            formData.append('nama', nama);
            formData.append('drive', drive);

            fetch(GAS_URL, { 
                method: 'POST', 
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: formData 
            })
            .then(r => r.json())
            .then(d => {
                if(d.status === 'success') { window.location.reload(); } 
                else { alert(d.message); btn.disabled = false; btn.innerText = "Aktifkan & Kunci Barcode"; }
            }).catch(err => {
                alert("Terjadi kesalahan jaringan.");
                btn.disabled = false; btn.innerText = "Aktifkan & Kunci Barcode"; 
            });
        }

       function bukaGaleri() {
            document.getElementById('loadingText').innerText = "Mengunduh gambar dari Drive...";
            fetch(`${GAS_URL}?action=get_images&url=${encodeURIComponent(dbDrive)}`)
            .then(r => r.json())
            .then(d => {
                hentikanLoading();
                document.getElementById('galleryBox').classList.remove('hidden');
                
                let html = '';
                if (d.status === 'success') {
                    if(d.images && d.images.length > 0) {
                        d.images.forEach(img => {
                            // Ambil mime type dan ubah jadi huruf kecil untuk keamanan
                            let fileType = (img.type || "").toLowerCase();
                            
                            // PERBAIKAN: Jika mengandung 'video' atau 'mp4', render video
                            if (fileType.includes('video') || fileType.includes('mp4')) {
                                html += `<video src="${img.url}" controls></video>`;
                            } 
                            // Jika bukan video, anggap sebagai gambar (image)
                            else {
                                html += `<img src="${img.url}" loading="lazy" alt="Gallery Image">`;
                            }
                        });
                    } else { html = "<p style='grid-column:1/-1;'>Folder kosong / tidak ada file gambar.</p>"; }
                } else { html = `<p style='grid-column:1/-1; color:#EF4444;'>Gagal memuat galeri.<br>${d.message}</p>`; }
                document.getElementById('gridFoto').innerHTML = html;
            }).catch(err => {
                hentikanLoading(); document.getElementById('galleryBox').classList.remove('hidden');
                document.getElementById('gridFoto').innerHTML = "<p style='grid-column:1/-1; color:#EF4444;'>Jaringan bermasalah.</p>";
                console.error("Error ambil gambar:", err);
            });
        }
    </script>
</body>
</html>
